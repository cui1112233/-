<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>一战晟铭本地执行器</title><link rel="stylesheet" href="renderer.css"/></head>
<body><main><div class="brand"><img src="assets/brand-logo-white.png" alt="一战晟铭"/></div><h1>本地视频执行器</h1><p class="intro">豆包账号只在这台电脑登录和保存。平台只下发任务和接收结果。</p>
<section id="paired" hidden><div class="status ok">● 已配对并保持在线</div><p id="paired-name"></p><div class="job-actions"><button id="heartbeat">立即刷新在线状态</button><button id="check-update" class="text">检查更新</button><button class="text" id="unpair">解除本机配对</button></div><div id="update-card" hidden><strong id="update-message"></strong><button id="download-update">下载并安装更新</button></div></section>
<section id="accounts" hidden><h2>豆包账号</h2><p class="intro">登录窗口由你自行完成扫码或验证码。账号会话仅保存在这台电脑。</p><div id="account-list"></div><form id="account-form"><input id="account-name" maxlength="80" placeholder="账号备注，例如 豆包账号 1"/><button type="submit">添加并登录账号</button></form></section>
<section id="jobs" hidden><h2>视频任务</h2><p class="intro">领取后会在已登录的豆包窗口填入提示词。生成完成后从该窗口下载视频，执行器会自动回传；也可手动选择视频回传。</p><label class="auto-submit"><input id="auto-submit" type="checkbox" checked/> 自动点击豆包的“生成”按钮</label><button id="claim-job">领取下一条视频任务</button><div id="job-card" hidden><p><strong id="job-title">当前任务</strong></p><pre id="job-prompt"></pre><div class="job-actions"><select id="job-account"></select><button id="open-job">打开豆包并填入提示词</button><button class="text" id="copy-job">复制提示词</button></div><div class="job-actions"><button id="upload-result">选择视频并回传</button><button class="text danger" id="fail-job">标记此任务失败</button></div></div></section>
<form id="pair-form"><label>平台服务地址<input id="server-url" type="url" placeholder="http://10.0.100.183:14000" required/></label><label>本机名称<input id="display-name" maxlength="128" placeholder="例如 剪辑电脑-小王"/></label><label>配对码<input id="pair-code" maxlength="16" autocomplete="one-time-code" placeholder="在平台设置页生成" required/></label><button type="submit">配对并保持在线</button></form>
<div id="notice" role="status"></div><aside><strong>当前版本</strong><br/>已支持：安全配对、在线心跳、设备本地加密保存、自动领取视频任务、账号池切换、自动点击生成与视频回传。<br/>请保持执行器运行；豆包页面会按账号自动打开、填入提示词并点击生成。</aside></main><script src="renderer.js"></script></body></html>
