<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一战晟铭 — 小说转可视化剧本</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ============================================
     Sidebar
     ============================================ -->
<nav id="sidebar">
  <div class="nav-header">
    <button id="nav-toggle" type="button" title="收起/展开导航">☰</button>
    <div class="nav-brand-container">
      <svg class="nav-logo" viewBox="0 0 1000 700" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M350 100 L50 350 L350 600" stroke="currentColor" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M410 650 L410 250 L530 450 L650 250 L650 450" stroke="currentColor" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="nav-brand">一战晟铭</span>
    </div>
  </div>
  <ul id="nav-list">
    <li class="nav-item active" data-href="/">
      <span class="nav-icon">🏠</span>
      <span class="nav-text">首页</span>
    </li>
    <li class="nav-item" data-href="/script">
      <span class="nav-icon">📝</span>
      <span class="nav-text">剧本生成</span>
    </li>
    <li class="nav-item" data-href="/agent">
      <span class="nav-icon">🤖</span>
      <span class="nav-text">Agent工作区</span>
    </li>
    <li class="nav-item" data-href="/tts">
      <span class="nav-icon">🎙️</span>
      <span class="nav-text">配音</span>
    </li>
  </ul>
  <div class="nav-footer">
    <button id="theme-toggle" class="nav-item theme-toggle-btn" type="button" title="切换主题">
      <span class="nav-icon" id="theme-icon">🌙</span>
      <span class="nav-text">切换主题</span>
    </button>
  </div>
</nav>

<!-- ============================================
     Main Area
     ============================================ -->
<div id="main">

  <!-- Topbar -->
  <div id="topbar">
    <span id="page-title">首页</span>
    <span id="login-user-display"></span>
    <div class="topbar-spacer"></div>
    <button id="btn-logout" class="btn-action" type="button">退出</button>
    <button class="btn-open-history" id="btn-open-history" type="button" title="生成记录">📋</button>
    <button class="btn-open-settings" type="button" title="设置">⚙️</button>
    <div class="history-dropdown" id="history-dropdown">
      <div class="history-dropdown-header">
        <span>📋 生成记录 <span id="history-count" class="history-count">0</span></span>
        <button class="history-clear" id="history-clear">清空</button>
      </div>
      <div id="history-list" class="history-list"></div>
      <div id="history-empty" class="history-empty">还没有生成记录</div>
    </div>
  </div>

  <!-- Progress Bar -->
  <div id="progress-bar">
    <div id="step1" class="step1"></div>
    <div class="step-divider"></div>
    <div id="step2" class="step2"></div>
  </div>

  <!-- Page: Home -->
  <div id="page-home" class="page-container active">
    <!-- 1. 动态欢迎面板 -->
    <div class="home-hero-banner">
      <div class="banner-glow-bg"></div>
      <h1 class="banner-title">一战晟铭</h1>
      <p class="banner-subtitle">探索文字的视觉边界，将小说章节转化为可视化剧本</p>
    </div>

    <!-- 2. 快捷入口组 -->
    <div class="home-quick-actions">
      <div class="quick-action-card card-write" data-href="/script">
        <span class="card-icon">📝</span>
        <div class="card-info">
          <h3 class="card-title">新建剧本项目</h3>
          <p class="card-desc">一键导入小说，自动拆分智能分镜</p>
        </div>
        <span class="card-arrow">➔</span>
      </div>
      <div class="quick-action-card card-agent" data-href="/agent">
        <span class="card-icon">🤖</span>
        <div class="card-info">
          <h3 class="card-title">AI 智能 Agent</h3>
          <p class="card-desc">专属助手对话，辅助精细化剧本包装</p>
        </div>
        <span class="card-arrow">➔</span>
      </div>
      <div class="quick-action-card card-tts" data-href="/tts">
        <span class="card-icon">🎙️</span>
        <div class="card-info">
          <h3 class="card-title">声音配音工坊</h3>
          <p class="card-desc">多音色情感合成，让你的画面声临其境</p>
        </div>
        <span class="card-arrow">➔</span>
      </div>
    </div>

    <!-- 3. 最近剧本画廊 -->
    <div class="home-recent-section">
      <div class="section-header">
        <h2 class="section-title">📂 最近创作项目</h2>
        <button id="btn-more-projects" class="btn-more-projects">查看全部历史记录</button>
      </div>
      <div id="home-recent-grid" class="recent-grid">
        <!-- 动态渲染，若无则展示极简 placeholder -->
        <div class="recent-empty">
          <div class="empty-icon">📂</div>
          <p>暂无最近的创作记录，点击上方 "新建剧本项目" 开始首个剧本吧！</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============================================
     Settings Modal
     ============================================ -->
<div id="settings-modal" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">⚙️ API 设置</div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">API 提供商</label>
        <select id="settings-provider" class="form-select">
          <option value="openai">OpenAI</option>
          <option value="claude">Claude</option>
          <option value="deepseek">DeepSeek</option>
          <option value="qwen">通义千问</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">API Key</label>
        <input id="settings-apikey" class="form-input" type="password" placeholder="输入你的 API Key">
      </div>
      <div class="form-group">
        <label class="form-label">Base URL</label>
        <input id="settings-baseurl" class="form-input" type="text" placeholder="https://api.openai.com/v1">
      </div>
      <div class="form-group">
        <label class="form-label">模型名称</label>
        <input id="settings-model" class="form-input" type="text" placeholder="gpt-4o">
      </div>
      <div id="test-result" class="test-result"></div>
    </div>
    <div class="modal-footer">
      <button id="btn-test-connection" class="btn btn-secondary" type="button">🔌 测试连接</button>
      <button id="btn-save-settings" class="btn btn-primary" type="button">保存</button>
      <button id="btn-close-settings" class="btn btn-secondary" type="button">关闭</button>
    </div>
  </div>
</div>

<!-- ============================================
     Toast Container
     ============================================ -->
<div id="toast-container"></div>

<!-- ============================================
     Login Overlay
     ============================================ -->
<div id="login-overlay" class="modal-overlay visible">
  <div class="modal login-modal">
    <div class="modal-title">🔐 登录</div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">账号</label>
        <input id="login-username" class="form-input" type="text" placeholder="请输入账号" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input id="login-password" class="form-input" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <div id="login-error"></div>
    </div>
    <div class="modal-footer">
      <button id="btn-login" class="btn btn-primary" type="button">登 录</button>
    </div>
    <p class="login-hint">提示：请联系管理员获取账号</p>
  </div>
</div>

<!-- ============================================
     Mobile Sidebar Overlay
     ============================================ -->
<div id="mobile-overlay"></div>

<script src="/js/common.js"></script>

</body>
</html>
