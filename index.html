<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一战晟铭 — 小说转可视化剧本</title>
<style>
/* ============================================
   CSS Custom Properties — Dark Theme
   ============================================ */
:root {
  --bg-primary: #0f0f14;
  --bg-secondary: #16161e;
  --bg-panel: #1a1a24;
  --bg-card: #1e1e2a;
  --bg-card-hover: #242433;
  --bg-input: #12121a;
  --bg-modal: #1a1a28;
  --bg-overlay: rgba(0, 0, 0, 0.65);
  --text-primary: #e8e8f0;
  --text-secondary: #9090a8;
  --text-muted: #5a5a72;
  --accent: #e94560;
  --accent-hover: #ff5a75;
  --accent-dim: rgba(233, 69, 96, 0.15);
  --border: #2a2a3a;
  --border-light: #333348;
  --success: #4ade80;
  --warning: #fbbf24;
  --error: #f87171;
  --info: #60a5fa;
  --sidebar-width: 200px;
  --sidebar-collapsed: 56px;
  --topbar-height: 52px;
  --radius: 8px;
  --radius-sm: 6px;
  --radius-lg: 12px;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ============================================
   Global Reset
   ============================================ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", "Helvetica Neue", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-primary);
  background: var(--bg-primary);
  display: flex;
}

a { color: var(--accent); text-decoration: none; }
button { cursor: pointer; font-family: inherit; }
input, textarea, select { font-family: inherit; }

/* ============================================
   Scrollbar Styling
   ============================================ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ============================================
   Sidebar
   ============================================ */
#sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-collapsed);
  height: 100vh;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: width var(--transition);
  overflow: hidden;
  z-index: 100;
}

#sidebar.collapsed {
  width: var(--sidebar-collapsed);
}

.nav-header {
  height: var(--topbar-height);
  display: flex;
  align-items: center;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#nav-toggle {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 20px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  transition: color var(--transition), background var(--transition);
}

#nav-toggle:hover {
  color: var(--text-primary);
  background: var(--bg-card);
}

.nav-header .nav-brand {
  margin-left: 10px;
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  opacity: 1;
  transition: opacity var(--transition);
}

#sidebar.collapsed .nav-brand {
  opacity: 0;
  pointer-events: none;
}

#nav-list {
  list-style: none;
  padding: 8px;
  flex: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  margin-bottom: 2px;
  border-radius: var(--radius);
  color: var(--text-secondary);
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
  white-space: nowrap;
  user-select: none;
}

.nav-item:hover {
  background: var(--bg-card);
  color: var(--text-primary);
}

.nav-item.active {
  background: var(--accent-dim);
  color: var(--accent);
}

.nav-icon {
  font-size: 18px;
  width: 24px;
  text-align: center;
  flex-shrink: 0;
}

.nav-text {
  margin-left: 10px;
  opacity: 1;
  transition: opacity var(--transition);
}

#sidebar.collapsed .nav-text {
  opacity: 0;
  pointer-events: none;
}

/* ============================================
   Main Area
   ============================================ */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  min-width: 0;
}

/* ============================================
   Top Bar
   ============================================ */
#topbar {
  height: var(--topbar-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
  flex-shrink: 0;
}

#page-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
}

.btn-open-settings {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color var(--transition), background var(--transition), border-color var(--transition);
}

.btn-open-settings:hover {
  color: var(--text-primary);
  background: var(--bg-card-hover);
  border-color: var(--border-light);
}

/* ============================================
   Progress Bar
   ============================================ */
#progress-bar {
  height: 3px;
  background: var(--border);
  display: none;
  flex-shrink: 0;
}

#progress-bar.visible {
  display: flex;
}

#progress-bar .step1 {
  flex: 1;
  height: 100%;
  background: var(--accent);
  transition: width 0.5s ease;
  width: 0;
}

#progress-bar .step2 {
  flex: 1;
  height: 100%;
  background: var(--accent);
  transition: width 0.5s ease;
  width: 0;
}

#progress-bar .step-divider {
  width: 2px;
  height: 100%;
  background: var(--bg-primary);
  flex-shrink: 0;
}

#progress-bar .step {
  flex: 1;
  height: 100%;
  background: var(--border);
  transition: background 0.3s ease;
}

#progress-bar .step.done {
  background: var(--accent);
}

#progress-bar .step.active {
  background: var(--accent);
  animation: stepPulse 1s ease-in-out infinite;
}

@keyframes stepPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* ============================================
   Page Container
   ============================================ */
.page-container {
  display: none;
  flex: 1;
  overflow: hidden;
}

.page-container.active {
  display: flex;
}

/* ============================================
   Home Page (placeholder)
   ============================================ */
#page-home {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  gap: 16px;
}

#page-home .placeholder-icon {
  font-size: 64px;
  opacity: 0.4;
}

#page-home .placeholder-text {
  font-size: 16px;
  opacity: 0.6;
}

#page-home .placeholder-sub {
  font-size: 13px;
  opacity: 0.4;
}

/* ============================================
   Script Page — Left Panel
   ============================================ */
#page-script {
  flex-direction: row;
}

.left-panel {
  width: 35%;
  min-width: 280px;
  max-width: 420px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.left-panel-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Input area */
.novel-input {
  width: 100%;
  min-height: 180px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  padding: 12px;
  font-size: 13px;
  line-height: 1.7;
  resize: vertical;
  outline: none;
  transition: border-color var(--transition);
}

.novel-input:focus {
  border-color: var(--accent);
}

.novel-input::placeholder {
  color: var(--text-muted);
}

/* Generate button */
.btn-generate {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background var(--transition), opacity var(--transition);
}

.btn-generate:hover {
  background: var(--accent-hover);
}

.btn-generate:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Loading status */
.loading-status {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--bg-card);
  border-radius: var(--radius);
  color: var(--text-secondary);
  font-size: 13px;
}

.loading-status.visible {
  display: flex;
}

/* Spinner */
.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Card sections */
.card-section {
  margin-top: 4px;
}

.card-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.card-section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 6px;
}

.card-section-count {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 400;
}

.card-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  cursor: pointer;
  transition: background var(--transition), border-color var(--transition);
}

.card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-light);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.card-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.card-edit-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 14px;
  padding: 2px 4px;
  border-radius: 4px;
  transition: color var(--transition);
}

.card-edit-btn:hover {
  color: var(--text-primary);
}

/* Also support btn-edit class used in JS rendering */
.btn-edit {
  position: absolute;
  top: 8px;
  right: 8px;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 4px;
}
.btn-edit:hover { color: var(--text-primary); background: var(--border); }

.card-detail {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-top: 2px;
}

.card-info {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ============================================
   Script Page — Right Panel
   ============================================ */
.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* Format tabs */
.format-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
  flex-shrink: 0;
  padding: 0 12px;
}

.format-tab {
  padding: 10px 18px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color var(--transition), border-color var(--transition);
  white-space: nowrap;
}

.format-tab:hover {
  color: var(--text-primary);
}

.format-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Output area */
.output-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}

.output-area .empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  gap: 12px;
}

.output-area .empty-state .empty-icon {
  font-size: 48px;
  opacity: 0.3;
}

.output-area .empty-state .empty-text {
  font-size: 14px;
  opacity: 0.5;
}

.output-content {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-primary);
  white-space: pre-wrap;
  word-break: break-word;
}

/* Action bar */
.action-bar {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.action-bar.visible {
  display: flex;
}

.btn-action {
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background var(--transition), border-color var(--transition);
}

.btn-action:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-light);
}

.btn-action.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn-action.primary:hover {
  background: var(--accent-hover);
}

/* ============================================
   Agent Page (placeholder)
   ============================================ */
#page-agent {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  gap: 16px;
}

#page-agent .placeholder-icon {
  font-size: 64px;
  opacity: 0.4;
}

#page-agent .placeholder-text {
  font-size: 16px;
  opacity: 0.6;
}

#page-agent .placeholder-sub {
  font-size: 13px;
  opacity: 0.4;
}

/* ============================================
   Modal Overlay
   ============================================ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg-overlay);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal-overlay.visible {
  display: flex;
}

.modal {
  background: var(--bg-modal);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  width: 420px;
  max-width: 90vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
}

.modal-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 20px;
}

.modal-body {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
}

.form-input,
.form-select {
  padding: 9px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  transition: border-color var(--transition);
}

.form-input:focus,
.form-select:focus {
  border-color: var(--accent);
}

.form-select {
  cursor: pointer;
}

.btn {
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  transition: background var(--transition), border-color var(--transition), color var(--transition);
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--text-primary);
}

.btn-secondary:hover {
  background: var(--bg-card-hover);
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn-primary:hover {
  background: var(--accent-hover);
}

/* Settings modal test feedback */
.test-result {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  display: none;
}

.test-result.success {
  display: block;
  background: rgba(74, 222, 128, 0.12);
  color: var(--success);
}

.test-result.error {
  display: block;
  background: rgba(248, 113, 113, 0.12);
  color: var(--error);
}

/* Edit modal */
#edit-modal .modal {
  width: 480px;
}

#edit-modal .form-textarea {
  width: 100%;
  min-height: 200px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  padding: 12px;
  font-size: 13px;
  line-height: 1.7;
  resize: vertical;
  outline: none;
  font-family: inherit;
}

#edit-modal .form-textarea:focus {
  border-color: var(--accent);
}

/* Regenerate modal */
.regenerate-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.regenerate-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition);
}

.regenerate-option:hover {
  border-color: var(--border-light);
  background: var(--bg-card-hover);
}

.regenerate-option input[type="radio"] {
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
}

.regenerate-option .option-label {
  font-size: 14px;
  color: var(--text-primary);
}

.regenerate-option .option-desc {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ============================================
   Toast Notifications
   ============================================ */
#toast-container {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  padding: 12px 18px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  color: #fff;
  box-shadow: var(--shadow);
  pointer-events: auto;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  max-width: 360px;
}

.toast.success {
  background: #1a7f3f;
  border: 1px solid var(--success);
}

.toast.error {
  background: #8b1a2b;
  border: 1px solid var(--error);
}

.toast.info {
  background: #1a4a7a;
  border: 1px solid var(--info);
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(40px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateX(0); }
  to   { opacity: 0; transform: translateX(40px); }
}
</style>
</head>
<body>

<!-- ============================================
     Sidebar
     ============================================ -->
<nav id="sidebar">
  <div class="nav-header">
    <button id="nav-toggle" type="button" title="收起/展开导航">☰</button>
    <span class="nav-brand">一战晟铭</span>
  </div>
  <ul id="nav-list">
    <li class="nav-item" data-page="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-text">首页</span>
    </li>
    <li class="nav-item active" data-page="script">
      <span class="nav-icon">📝</span>
      <span class="nav-text">剧本生成</span>
    </li>
    <li class="nav-item" data-page="agent">
      <span class="nav-icon">🤖</span>
      <span class="nav-text">Agent工作区</span>
    </li>
  </ul>
</nav>

<!-- ============================================
     Main Area
     ============================================ -->
<div id="main">

  <!-- Topbar -->
  <div id="topbar">
    <span id="page-title">剧本生成</span>
    <button class="btn-open-settings" type="button" title="设置">⚙️</button>
  </div>

  <!-- Progress Bar -->
  <div id="progress-bar">
    <div id="step1" class="step1"></div>
    <div class="step-divider"></div>
    <div id="step2" class="step2"></div>
  </div>

  <!-- Page: Home -->
  <div id="page-home" class="page-container">
    <div class="placeholder-icon">🏠</div>
    <div class="placeholder-text">欢迎使用 一战晟铭</div>
    <div class="placeholder-sub">将小说章节转化为可视化剧本</div>
  </div>

  <!-- Page: Script -->
  <div id="page-script" class="page-container active">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="left-panel-scroll">
        <textarea
          id="novel-input"
          class="novel-input"
          placeholder="在此粘贴小说章节内容..."
        ></textarea>

        <button id="btn-generate" class="btn-generate" type="button">
          🚀 一键生成
        </button>

        <div id="loading-status" class="loading-status">
          <div class="spinner"></div>
          <span id="loading-text">提取人物和场景中...</span>
        </div>

        <!-- Character Section -->

const ApiConfig = (function() {
    const API_BASE = 'http://127.0.0.1:3000';
    const providerDefaults = {
        openai:   { baseUrl: 'https://api.openai.com/v1', model: 'gpt-4o' },
        deepseek: { baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
        qwen:     { baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-plus' },
        claude:   { baseUrl: 'https://api.anthropic.com/v1', model: 'claude-3-5-sonnet-20241022' },
        custom:   { baseUrl: '', model: '' }
    };

    async function get() {
        const resp = await fetch(API_BASE + '/api/config');
        if (!resp.ok) throw new Error('获取配置失败 (HTTP ' + resp.status + ')');
        return resp.json();
    }

    async function save(cfg) {
        const resp = await fetch(API_BASE + '/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cfg)
        });
        if (!resp.ok) {
            const errData = await resp.json().catch(() => ({}));
            throw new Error(errData.error || '保存配置失败 (HTTP ' + resp.status + ')');
        }
    }

    async function testConnection(cfg) {
        const resp = await fetch(API_BASE + '/api/test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cfg)
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || !data.ok) {
            throw new Error(data.error || '测试连接失败 (HTTP ' + resp.status + ')');
        }
        return true;
    }

    return { get, save, testConnection, providerDefaults };
})();

// ============================================================
// 模块：设置 UI 交互
// ============================================================

(function() {
    const modal = document.getElementById('settings-modal');
    const btnOpen = document.querySelector('.btn-open-settings');
    const btnClose = document.getElementById('btn-close-settings');
    const btnSave = document.getElementById('btn-save-settings');
    const btnTest = document.getElementById('btn-test-connection');
    const providerSelect = document.getElementById('settings-provider');
    const apiKeyInput = document.getElementById('settings-apikey');
    const baseUrlInput = document.getElementById('settings-baseurl');
    const modelInput = document.getElementById('settings-model');
    const testResult = document.getElementById('test-result');

    let backendHasKey = false;

    btnOpen.addEventListener('click', async () => {
        try {
            const cfg = await ApiConfig.get();
            providerSelect.value = cfg.provider || 'custom';
            baseUrlInput.value = cfg.baseUrl || '';
            modelInput.value = cfg.model || '';
            backendHasKey = cfg.hasApiKey;
            apiKeyInput.value = '';
            if (cfg.hasApiKey) {
                apiKeyInput.placeholder = '已保存，留空则不修改';
            } else {
                apiKeyInput.placeholder = '输入你的 API Key';
            }
            testResult.className = 'test-result';
            testResult.textContent = '';
            modal.style.display = 'flex';
        } catch (e) {
            showToast('获取配置失败：' + e.message, 'error');
        }
    });

    btnClose.addEventListener('click', () => { modal.style.display = 'none'; });
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

    providerSelect.addEventListener('change', () => {
        const defaults = ApiConfig.providerDefaults[providerSelect.value];
        if (defaults && defaults.baseUrl) baseUrlInput.value = defaults.baseUrl;
        if (defaults && defaults.model) modelInput.value = defaults.model;
        if (providerSelect.value === 'custom') { baseUrlInput.value = ''; modelInput.value = ''; }
    });

    btnSave.addEventListener('click', async () => {
        const apiKey = apiKeyInput.value.trim();
        const cfg = {
            provider: providerSelect.value,
            baseUrl: baseUrlInput.value.trim(),
            model: modelInput.value.trim()
        };
        if (apiKey) {
            cfg.apiKey = apiKey;
        } else if (!backendHasKey) {
            showToast('请输入 API Key', 'error');
            return;
        } else {
            cfg.apiKey = '';
        }
        if (!cfg.baseUrl) { showToast('请输入 Base URL', 'error'); return; }
        if (!cfg.model) { showToast('请输入模型名称', 'error'); return; }
        try {
            await ApiConfig.save(cfg);
            modal.style.display = 'none';
            showToast('设置已保存', 'success');
        } catch (e) {
            showToast('保存失败：' + e.message, 'error');
        }
    });

    btnTest.addEventListener('click', async () => {
        const apiKey = apiKeyInput.value.trim();
        const cfg = {
            provider: providerSelect.value,
            baseUrl: baseUrlInput.value.trim(),
            model: modelInput.value.trim()
        };
        if (apiKey) {
            cfg.apiKey = apiKey;
        } else if (!backendHasKey) {
            showToast('请先填写完整配置', 'error');
            return;
        } else {
            cfg.apiKey = '';
        }
        if (!cfg.baseUrl || !cfg.model) { showToast('请先填写完整配置', 'error'); return; }
        btnTest.disabled = true;
        btnTest.textContent = '测试中...';
        testResult.className = 'test-result';
        testResult.textContent = '';
        try {
            await ApiConfig.save(cfg);
            await ApiConfig.testConnection(cfg);
            testResult.className = 'test-result success';
            testResult.textContent = '✓ 连接成功！';
            showToast('连接成功！', 'success');
        } catch (e) {
            testResult.className = 'test-result error';
            testResult.textContent = '✗ 连接失败：' + e.message;
            showToast('连接失败：' + e.message, 'error');
        } finally {
            btnTest.disabled = false;
            btnTest.textContent = '🔌 测试连接';
        }
    });
})();

function showToast(message, type) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast ' + (type || '');
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 3000);
}

**方式一：场景跳切**
开场直接切到全章最炸裂的画面（如：对峙、崩溃、打脸），用一个镜头建立冲突，然后通过【字幕：X小时前/X天前】回到故事起点。

**方式二：人物冲突前置**
从全章中选取一段冲突最强的对话作为开场。不交代前因后果，直接用对话把观众扔进冲突中心，后续再补原因。

**前提条件：**
- 炸雷画面必须来自小说原文，不能编造
- 时间标注（字幕）必须准确，不能误导观众
- 回到正常叙事时，必须保证情节完整衔接

## 规则3：三幕式结构（默认）
- 第一幕 0-5s：钩子。最炸裂的画面、冲突、反转开场（优先使用炸雷前置）
- 第二幕 5-20s：冲突升级。桥接回小说真实情节，推进情绪
- 第三幕 20-30s：反转卡点。停在关键冲突点，不解决，吸引点进小说

特殊章节（情绪流强、无明显事件推进）可自动选择单爆点一镜到底。

## 规则4：情节保真
- 钩子可以适度强化（闪回、冲突前置），但必须能在小说里找到落点
- 禁止编造小说不存在的人物关系、核心事件
- 瞎编的镜头，最终要能用小说原文解释

## 规则5：心理描写视觉化（最重要）
所有心理活动必须转化为AI视频平台可识别的中观以上粒度动作。

- ✅ 身体姿态变化、大幅度肢体动作、明显面部表情变化、物体交互
- ✅ 可见的生理反应：指节发白、青筋暴起、脸色发白/涨红、眼眶泛红、嘴唇发抖
- ❌ 微观动作：指尖动作、瞳孔变化、睫毛颤动、微表情
- ❌ 不可见感受：心跳加速、手心出汗、脊背发凉、胃里翻涌
- 禁止出现"心里想""感到""觉得""内心"等词汇
- 禁止使用画外音/旁白/内心OS

心理状态转化示例：
- "内心酸涩" → "眼眶迅速泛红，别过头去，肩膀微微发抖"
- "愤怒" → "一拳砸在桌上，脖子上青筋暴起"
- "紧张" → "反复捏手指，指节发白；不停舔嘴唇"
- "压抑" → "胸口剧烈起伏，深呼吸后缓慢吐出"
- "回忆" → "盯着一个方向不动，手中动作完全停下，旁人叫了两声才回神"
- "犹豫" → "手伸出去又缩回来，拿起东西又放下"
- "恐惧" → "脸色刷白，后退两步，手抖得拿不稳东西"

## 规则6：对白括号 A/B/C 分级
人物括号不是每句都写满，按台词功能分级：

**A级：关键爆点，必须写具体括号**
适用：主角反击、反派施压、亮证据、打脸、拒绝、崩溃、结尾卡点
格式：人物（关键动作 + 表情/眼神 + 声音状态）：台词
要求：动作必须是中观以上粒度

**B级：普通推进，简写括号**
适用：报数、问话、承接信息、日常对话
格式：人物（一个动作或声音状态）：台词
△动作已写清的，括号可省略

**C级：背景/群戏，不写括号**
适用：群众口号、短促附和、电话音、录音、背景议论
格式：人物：台词 或 人物（声音状态）：台词

错误倾向：
- 不要把每句都写成"身体姿态+手部动作+眼神+声音"的满配格式
- 不要为了具体而具体，导致对白节奏变慢
- 不要在普通报数、接话、群众口号里塞复杂表演

## 规则7：△画面描述规则
- 只写镜头能看到的：动作、表情、道具、站位、互动
- 不写心理描写、环境描写、抽象形容
- 每个△段落是一个独立的画面单元

## 规则8：结尾卡点
- 必须停在"观众想知道接下来发生什么"的位置
- 不能给答案，不能给完整结局

## 规则9：转化要求
- 逐段完整转化，不遗漏任何情节
- 过渡性叙述也要转化为视觉化动作或空镜
- 对白前必须有动作描写，不能只有台词
- 女频特点：注重情感递进，对话中留白和潜台词

${formatRules[format]}`;

// 模块：AI API 调用
// ============================================================

const AIClient = (function() {
    const API_BASE = 'http://127.0.0.1:3000';

    async function call(messages, options = {}) {
        const body = JSON.stringify({
            messages: messages,
            max_tokens: options.maxTokens || 4096,
            temperature: options.temperature ?? 0.7,
            stream: false
        });
        const resp = await fetch(API_BASE + '/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: body
        });
        if (!resp.ok) {
            const errText = await resp.text();
            throw new Error('API 请求失败 (HTTP ' + resp.status + '): ' + errText.slice(0, 300));
        }
        const data = await resp.json();
        if (!data.choices || !data.choices[0] || !data.choices[0].message) {
            throw new Error('API 返回格式异常');
        }
        return data.choices[0].message.content;
    }

    async function callStream(messages, onChunk, options = {}) {
        const body = JSON.stringify({
            messages: messages,
            max_tokens: options.maxTokens || 4096,
            temperature: options.temperature ?? 0.7,
            stream: true
        });
        const resp = await fetch(API_BASE + '/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: body
        });
        if (!resp.ok) {
            const errText = await resp.text();
            throw new Error('API 请求失败 (HTTP ' + resp.status + '): ' + errText.slice(0, 300));
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let fullContent = '';
        let buffer = '';
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed || !trimmed.startsWith('data: ')) continue;
                const data = trimmed.slice(6);
                if (data === '[DONE]') continue;
                try {
                    const parsed = JSON.parse(data);
                    const delta = parsed.choices?.[0]?.delta?.content;
                    if (delta) { fullContent += delta; onChunk(delta); }
                } catch (e) {}
            }
        }
        return fullContent;
    }

    return { call, callStream };
})();

// 工具：JSON 解析（从 AI 响应中提取 JSON）
// ============================================================

function extractJSON(text) {
    try { return JSON.parse(text); } catch (e) {}
    const codeBlock = text.match(/```json\s*([\s\S]*?)```/);
    if (codeBlock) {
        try { return JSON.parse(codeBlock[1].trim()); } catch (e) {}
    }
    const firstBrace = text.indexOf('{');
    const lastBrace = text.lastIndexOf('}');
    if (firstBrace !== -1 && lastBrace > firstBrace) {
        try { return JSON.parse(text.slice(firstBrace, lastBrace + 1)); } catch (e) {}
    }
    throw new Error('无法从 AI 响应中提取 JSON');
}

const Extraction = (function() {
    let currentData = { era: '', characters: [], scenes: [] };

    function getData() { return currentData; }
    function setData(data) { currentData = data; }

    async function extract(novelText) {
        const messages = PromptTemplates.extractPrompt(novelText);
        const response = await AIClient.call(messages, { maxTokens: 4096, temperature: 0.3 });
        const data = extractJSON(response);
        const era = data.时代背景 || data.era || '';
        const characters = (data.人物 || data.characters || []).map(c => {
            const app = c.外貌描述 || c.appearance || {};
            return {
                name: c.姓名 || c.name || '',
                alias: c.别名 || c.alias || '',
                role: c.角色定位 || c.role || '',
                identity: c.身份标签 || c.identity || '',
                gender: c.性别 || c.gender || '',
                age: c.大致年龄 || c.age || '',
                appearance: {
                    body: app.基本体征 || app.body || '',
                    face: app.五官与妆容 || app.face || '',
                    hair: app.发型与发饰 || app.hair || '',
                    clothing: app.服饰与配饰 || app.clothing || ''
                },
                personality: c.性格关键词 || c.personality || [],
                relations: c.关系网络 || c.relations || '',
                speechStyle: c.说话风格 || c.speechStyle || '',
                function: c.在章节中的功能 || c.function || ''
            };
        });
        const scenes = (data.场景 || data.scenes || []).map(s => ({
            number: s.场景编号 || s.number || 0,
            location: s.地点 || s.location || '',
            time: s.时间 || s.time || '',
            characters: s.出场人物 || s.characters || [],
            event: s.核心事件 || s.event || '',
            mood: s.情绪基调 || s.mood || '',
            conflictType: s.冲突类型 || s.conflictType || ''
        }));
        currentData = { era, characters, scenes };
        return currentData;
    }

    function renderCards(data) {
        const charSection = document.getElementById('char-section');
        const sceneSection = document.getElementById('scene-section');
        const charList = document.getElementById('char-list');
        const sceneList = document.getElementById('scene-list');
        const charCount = document.getElementById('char-count');
        const sceneCount = document.getElementById('scene-count');

        if (data.characters.length > 0) {
            charSection.style.display = '';
            charCount.textContent = '(' + data.characters.length + ')';
            charList.innerHTML = data.characters.map((c, i) => {
                var app = c.appearance || {};
                return '<div class="card" data-type="char" data-index="' + i + '">'
                    + '<button class="btn-edit" data-type="char" data-index="' + i + '">✏️</button>'
                    + '<div class="card-name">' + escapeHtml(c.name) || '未命名' + (c.role ? ' · ' + escapeHtml(c.role) : '') + '</div>'
                    + '<div class="card-detail">' + escapeHtml(c.identity) + '</div>'
                    + (app.body ? '<div class="card-detail">体征：' + escapeHtml(app.body) + '</div>' : '')
                    + (app.face ? '<div class="card-detail">五官：' + escapeHtml(app.face) + '</div>' : '')
                    + (app.hair ? '<div class="card-detail">发型：' + escapeHtml(app.hair) + '</div>' : '')
                    + (app.clothing ? '<div class="card-detail">服饰：' + escapeHtml(app.clothing) + '</div>' : '')
                    + (c.speechStyle ? '<div class="card-detail">说话：' + escapeHtml(c.speechStyle) + '</div>' : '')
                    + (c.relations ? '<div class="card-detail">关系：' + escapeHtml(c.relations) + '</div>' : '')
                    + '</div>';
            }).join('');
        } else { charSection.style.display = 'none'; }

        if (data.scenes.length > 0) {
            sceneSection.style.display = '';
            sceneCount.textContent = '(' + data.scenes.length + ')';
            sceneList.innerHTML = data.scenes.map((s, i) => `
                <div class="card" data-type="scene" data-index="${i}">
                    <button class="btn-edit" data-type="scene" data-index="${i}">✏️</button>
                    <div class="card-name">场景${s.number}：${escapeHtml(s.location)}</div>
                    <div class="card-detail">${escapeHtml(s.time)} · 情绪：${escapeHtml(s.mood)}</div>
                    <div class="card-detail">出场：${Array.isArray(s.characters) ? s.characters.join('、') : ''}</div>
                </div>`).join('');
        } else { sceneSection.style.display = 'none'; }
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    return { extract, renderCards, getData, setData, escapeHtml };
})();

(function() {
    const editModal = document.getElementById('edit-modal');
    const editTitle = document.getElementById('edit-modal-title');
    const editContent = document.getElementById('edit-modal-textarea');
    const btnClose = document.getElementById('btn-close-edit');
    const btnSave = document.getElementById('btn-save-edit');
    let editTarget = null;

    document.getElementById('char-list').addEventListener('click', handleEditClick);
    document.getElementById('scene-list').addEventListener('click', handleEditClick);

    function handleEditClick(e) {
        const btn = e.target.closest('.btn-edit');
        if (!btn) return;
        editTarget = { type: btn.dataset.type, index: parseInt(btn.dataset.index) };
        const data = Extraction.getData();
        if (editTarget.type === 'char') {
            const c = data.characters[editTarget.index];
            editTitle.textContent = '编辑人物：' + (c.name || '未命名');
            editContent.value = JSON.stringify({ name: c.name, alias: c.alias, role: c.role, identity: c.identity, gender: c.gender, age: c.age, appearance: c.appearance || { body: '', face: '', hair: '', clothing: '' }, personality: c.personality, relations: c.relations, speechStyle: c.speechStyle, function: c.function }, null, 2);
        } else {
            const s = data.scenes[editTarget.index];
            editTitle.textContent = '编辑场景' + s.number;
            editContent.value = JSON.stringify({ number: s.number, location: s.location, time: s.time, characters: s.characters, event: s.event, mood: s.mood, conflictType: s.conflictType }, null, 2);
        }
        editModal.style.display = 'flex';
    }

    btnClose.addEventListener('click', () => { editModal.style.display = 'none'; });
    editModal.addEventListener('click', (e) => { if (e.target === editModal) editModal.style.display = 'none'; });

    btnSave.addEventListener('click', () => {
        if (!editTarget) return;
        try {
            const newData = JSON.parse(editContent.value);
            const data = Extraction.getData();
            if (editTarget.type === 'char') {
                data.characters[editTarget.index] = { ...data.characters[editTarget.index], ...newData };
            } else {
                data.scenes[editTarget.index] = { ...data.scenes[editTarget.index], ...newData };
            }
            Extraction.setData(data);
            Extraction.renderCards(data);
            editModal.style.display = 'none';
            showToast('已保存', 'success');
        } catch (e) { showToast('JSON 格式错误', 'error'); }
    });
})();

const ScriptGenerator = (function() {
    let currentFormat = 'shortdrama';
    let outputs = { screenplay: '', storyboard: '', shortdrama: '' };
    let currentNovelText = '';

    function getCurrentFormat() { return currentFormat; }
    function setCurrentFormat(f) { currentFormat = f; }
    function getCurrentOutput() { return outputs[currentFormat] || ''; }
    function hasOutput(format) { return !!outputs[format]; }
    function getCurrentNovelText() { return currentNovelText; }
    function setCurrentNovelText(t) { currentNovelText = t; }

    async function generate(novelText, format) {
        setCurrentNovelText(novelText);
        currentFormat = format;
        outputs[format] = '';

        // 清空输出区，准备流式写入
        const outputArea = document.getElementById('output-area');
        outputArea.innerHTML = '';
        const contentDiv = document.createElement('div');
        contentDiv.style.whiteSpace = 'pre-wrap';
        contentDiv.style.lineHeight = '1.8';
        outputArea.appendChild(contentDiv);

        const data = Extraction.getData();
        const charsJson = JSON.stringify(data.characters, null, 2);
        const scenesJson = JSON.stringify(data.scenes, null, 2);
        const messages = PromptTemplates.scriptPrompt(novelText, charsJson, scenesJson, format);
        const response = await AIClient.callStream(messages, (chunk) => {
            contentDiv.textContent += chunk;
            outputArea.scrollTop = outputArea.scrollHeight;
        }, { maxTokens: 8192, temperature: 0.7 });
        outputs[format] = response;
        showActionButtons();
        return response;
    }

    function switchToFormat(format) {
        currentFormat = format;
        const outputArea = document.getElementById('output-area');
        outputArea.innerHTML = '';
        if (outputs[format]) {
            const div = document.createElement('div');
            div.style.whiteSpace = 'pre-wrap';
            div.style.lineHeight = '1.8';
            div.textContent = outputs[format];
            outputArea.appendChild(div);
            showActionButtons();
        } else {
            outputArea.innerHTML = '<div class="empty-state"><div class="empty-icon">📄</div><div class="empty-text">点击"一键生成"生成此格式的剧本</div></div>';
            hideActionButtons();
        }
        // 同步 tab 激活状态
        document.querySelectorAll('#format-tabs .format-tab').forEach(function(t) { t.classList.remove('active'); });
        var targetTab = document.querySelector('#format-tabs .format-tab[data-format="' + format + '"]');
        if (targetTab) targetTab.classList.add('active');
    }

    function showActionButtons() {
        document.getElementById('btn-regenerate').style.display = '';
        document.getElementById('btn-copy').style.display = '';
        document.getElementById('btn-export').style.display = '';
    }

    function hideActionButtons() {
        document.getElementById('btn-regenerate').style.display = 'none';
        document.getElementById('btn-copy').style.display = 'none';
        document.getElementById('btn-export').style.display = 'none';
    }

    return { generate: generate, getCurrentFormat: getCurrentFormat, setCurrentFormat: setCurrentFormat, getCurrentOutput: getCurrentOutput, getCurrentNovelText: getCurrentNovelText, setCurrentNovelText: setCurrentNovelText, showActionButtons: showActionButtons, hideActionButtons: hideActionButtons, switchToFormat: switchToFormat, hasOutput: hasOutput };
})();

(function() {
    var pendingFormat = null;
    var switchModal = document.getElementById('format-switch-modal');
    var btnConfirm = document.getElementById('btn-confirm-switch');
    var btnCancel = document.getElementById('btn-cancel-switch');
    var switchMsg = document.getElementById('switch-format-name');

    var formatNames = { screenplay: '影视剧本', storyboard: '分镜脚本', shortdrama: '短视频脚本' };

    document.querySelectorAll('#format-tabs .format-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            var newFormat = tab.dataset.format;
            if (newFormat === ScriptGenerator.getCurrentFormat()) return;

            // 如果当前格式没有生成过内容，且目标也没有缓存 → 直接切换
            if (!ScriptGenerator.getCurrentOutput() && !ScriptGenerator.hasOutput(newFormat)) {
                ScriptGenerator.switchToFormat(newFormat);
                return;
            }

            // 如果目标格式已有缓存内容 → 直接切换显示
            if (ScriptGenerator.hasOutput(newFormat)) {
                ScriptGenerator.switchToFormat(newFormat);
                return;
            }

            // 当前格式有内容，目标格式无缓存 → 弹窗确认
            pendingFormat = newFormat;
            switchMsg.textContent = formatNames[newFormat];
            switchModal.style.display = 'flex';
        });
    });

    btnConfirm.addEventListener('click', async function() {
        if (!pendingFormat) return;
        switchModal.style.display = 'none';
        var format = pendingFormat;
        pendingFormat = null;

        // 切换 tab 激活状态
        document.querySelectorAll('#format-tabs .format-tab').forEach(function(t) { t.classList.remove('active'); });
        var targetTab = document.querySelector('#format-tabs .format-tab[data-format="' + format + '"]');
        if (targetTab) targetTab.classList.add('active');

        ScriptGenerator.setCurrentFormat(format);

        var btnGenerate = document.getElementById('btn-generate');
        btnGenerate.disabled = true;
        btnGenerate.textContent = '生成中...';

        var loadingStatus = document.getElementById('loading-status');
        loadingStatus.style.display = 'flex';
        loadingStatus.innerHTML = '<div class="spinner"></div><span>剧本生成中...</span>';

        try {
            var novelText = ScriptGenerator.getCurrentNovelText();
            await ScriptGenerator.generate(novelText, format);
            showToast('生成完成！', 'success');
        } catch (e) {
            showToast('生成失败：' + e.message, 'error');
        } finally {
            btnGenerate.disabled = false;
            btnGenerate.textContent = '一键生成';
            loadingStatus.style.display = 'none';
            loadingStatus.innerHTML = '';
        }
    });

    btnCancel.addEventListener('click', function() {
        switchModal.style.display = 'none';
        pendingFormat = null;
    });
    switchModal.addEventListener('click', function(e) {
        if (e.target === switchModal) {
            switchModal.style.display = 'none';
            pendingFormat = null;
        }
    });
})();

(function() {
    document.getElementById('btn-copy').addEventListener('click', async () => {
        const text = ScriptGenerator.getCurrentOutput();
        if (!text) return;
        try {
            await navigator.clipboard.writeText(text);
            showToast('已复制到剪贴板', 'success');
        } catch (e) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('已复制到剪贴板', 'success');
        }
    });

    document.getElementById('btn-export').addEventListener('click', () => {
        const text = ScriptGenerator.getCurrentOutput();
        if (!text) return;
        const names = { screenplay: '影视剧本', storyboard: '分镜脚本', shortdrama: '短视频脚本' };
        const name = names[ScriptGenerator.getCurrentFormat()] || '剧本';
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name + '_' + new Date().toISOString().slice(0, 10) + '.txt';
        a.click();
        URL.revokeObjectURL(url);
        showToast('导出成功', 'success');
    });
})();

// ============================================================
// 模块：一键生成流水线
// ============================================================

(function() {
    const btnGenerate = document.getElementById('btn-generate');
    const novelInput = document.getElementById('novel-input');
    const loadingStatus = document.getElementById('loading-status');
    const progressBar = document.getElementById('progress-bar');
    const step1El = document.getElementById('step1');
    const step2El = document.getElementById('step2');

    function setLoading(msg) {
        loadingStatus.style.display = 'flex';
        loadingStatus.innerHTML = '<div class="spinner"></div><span>' + msg + '</span>';
    }

    function clearLoading() {
        loadingStatus.style.display = 'none';
        loadingStatus.innerHTML = '';
    }

    function setProgress(step) {
        progressBar.style.display = 'flex';
        step1El.className = 'step1 step';
        step2El.className = 'step2 step';
        if (step >= 1) step1El.className = 'step1 step done';
        if (step >= 2) step2El.className = 'step2 step done';
        if (step === 1.5) step2El.className = 'step2 step active';
    }

    function hideProgress() {
        progressBar.style.display = 'none';
    }

    function resetUI() {
        const outputArea = document.getElementById('output-area');
        outputArea.innerHTML = '<div class="empty-state"><div class="empty-icon">📄</div><div class="empty-text">粘贴小说后点击"一键生成"</div><div class="empty-sub">自动提取人物、场景，生成可视化剧本</div></div>';
        ScriptGenerator.hideActionButtons();
        document.getElementById('char-section').style.display = 'none';
        document.getElementById('scene-section').style.display = 'none';
        hideProgress();
    }

    btnGenerate.addEventListener('click', async () => {
        const novelText = novelInput.value.trim();
        if (!novelText) {
            showToast('请先粘贴小说内容', 'error');
            return;
        }
        if (novelText.length < 100) {
            showToast('内容太短，请至少输入100字', 'error');
            return;
        }

        btnGenerate.disabled = true;
        btnGenerate.textContent = '处理中...';
        hideProgress();

        try {
            // 第1步：提取人物和场景
            setLoading('提取人物和场景中...');
            setProgress(1);
            const data = await Extraction.extract(novelText);
            Extraction.renderCards(data);
            step1El.className = 'step done';

            // 第2步：生成剧本
            setLoading('剧本生成中...');
            setProgress(1.5);
            const format = ScriptGenerator.getCurrentFormat();
            await ScriptGenerator.generate(novelText, format);
            setProgress(2);

            clearLoading();
            showToast('生成完成！', 'success');
        } catch (e) {
            clearLoading();
            showToast('生成失败：' + e.message, 'error');
            console.error(e);
        } finally {
            btnGenerate.disabled = false;
            btnGenerate.textContent = '🚀 一键生成';
        }
    });
})();

// ============================================================
// 模块：重新生成
// ============================================================

(function() {
    const modal = document.getElementById('regenerate-modal');
    const btnOpen = document.getElementById('btn-regenerate');
    const btnClose = document.getElementById('btn-close-regenerate');
    const btnConfirm = document.getElementById('btn-confirm-regenerate');

    btnOpen.addEventListener('click', () => { modal.style.display = 'flex'; });
    btnClose.addEventListener('click', () => { modal.style.display = 'none'; });
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

    btnConfirm.addEventListener('click', async () => {
        const selected = document.querySelector('input[name="regenerate-option"]:checked');
        if (!selected) return;
        modal.style.display = 'none';

        const btnGenerate = document.getElementById('btn-generate');
        btnGenerate.disabled = true;
        btnGenerate.textContent = '重新生成中...';

        const loadingStatus = document.getElementById('loading-status');
        const progressBar = document.getElementById('progress-bar');
        const step1El = document.getElementById('step1');
        const step2El = document.getElementById('step2');

        function setLoading(msg) {
            loadingStatus.style.display = 'flex';
            loadingStatus.innerHTML = '<div class="spinner"></div><span>' + msg + '</span>';
        }
        function clearLoading() { loadingStatus.style.display = 'none'; loadingStatus.innerHTML = ''; }

        try {
            const novelText = ScriptGenerator.getCurrentNovelText();

            if (selected.value === 'all') {
                progressBar.style.display = 'flex';
                setLoading('提取人物和场景中...');
                step1El.className = 'step1 step done';
                const data = await Extraction.extract(novelText);
                Extraction.renderCards(data);
                setLoading('剧本生成中...');
                step2El.className = 'step2 step active';
                await ScriptGenerator.generate(novelText, ScriptGenerator.getCurrentFormat());
                step2El.className = 'step2 step done';
                clearLoading();
                showToast('全部重新生成完成', 'success');
            } else if (selected.value === 'extract-only') {
                setLoading('提取人物和场景中...');
                progressBar.style.display = 'flex';
                step1El.className = 'step1 step done';
                const data = await Extraction.extract(novelText);
                Extraction.renderCards(data);
                clearLoading();
                showToast('人物和场景已更新', 'success');
            } else {
                setLoading('剧本生成中...');
                progressBar.style.display = 'flex';
                step2El.className = 'step2 step active';
                await ScriptGenerator.generate(novelText, ScriptGenerator.getCurrentFormat());
                step2El.className = 'step2 step done';
                clearLoading();
                showToast('剧本已重新生成', 'success');
            }
        } catch (e) {
            clearLoading();
            showToast('重新生成失败：' + e.message, 'error');
            console.error(e);
        } finally {
            btnGenerate.disabled = false;
            btnGenerate.textContent = '🚀 一键生成';
        }
    });
})();
</script>

</body>
</html>
