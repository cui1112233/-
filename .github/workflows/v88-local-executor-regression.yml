name: V88 Local Executor Regression

on:
  push:
    branches:
      - v88
      - fix/v88-doubao-video-tab
    paths:
      - 'local-executor/**'
      - 'branding/**'
      - 'frontend/index.html'
      - 'frontend/public/yizhan-icon.png'
      - '.github/workflows/v88-local-executor-regression.yml'
  workflow_dispatch:

jobs:
  local-executor-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full local executor tests
        working-directory: local-executor
        run: npm test
      - name: Check local executor JavaScript syntax
        working-directory: local-executor
        run: npm run check
