name: Temporary Novel Fetch Upload Session GREEN

on:
  push:
    branches:
      - tdd/v88-upload-session-expired-401-20260909

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run upload-session GET and Worker regression
        run: node --test tests/novel-fetch-upload-browser-worker.test.js
      - name: Preserve accepted_pending and submitted semantics
        run: node --test tests/novel-fetch-121-web-service.test.js
      - name: Syntax check changed route and test
        run: |
          node --check routes/novel-fetch-upload.js
          node --check tests/novel-fetch-upload-browser-worker.test.js
