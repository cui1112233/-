name: Novel Panel V78.3.0.31 Regression

on:
  push:
    branches:
      - v88
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novel-panel-v783031-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v88 source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run V78.3.0.31 novel-panel regressions
        run: node --test tests/novel-panel-v783031-*.test.js
