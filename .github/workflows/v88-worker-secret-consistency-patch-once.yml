name: V88 Worker Secret Consistency Patch Once

on:
  push:
    branches:
      - v88
    paths:
      - '.github/workflows/v88-worker-secret-consistency-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout v88
        uses: actions/checkout@v4
        with:
          ref: v88
          fetch-depth: 1

      - name: Patch canonical 121 secret injection
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/v88-linux-amd64-image-release.yml')
          text = workflow.read_text()
          old = 'compose=(docker compose -f "$compose_file" -f "$compose_dir/docker-compose.browser-worker.yml")'
          new = 'compose=(docker compose --env-file "$compose_dir/novel-fetch-121.env" -f "$compose_file" -f "$compose_dir/docker-compose.browser-worker.yml")'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected exactly 3 compose invocations, found {count}')
          workflow.write_text(text.replace(old, new))

          overlay = Path('deploy/v88-public/docker-compose.browser-worker.yml')
          text = overlay.read_text()
          node_marker = '      QIANTIE_121_BROWSER_WORKER_URL: http://novel-fetch-121-worker:8787\n'
          node_insert = node_marker + (
              '      QIANTIE_121_WORKER_SECRET: ${QIANTIE_121_WORKER_SECRET}\n'
              '      QIANTIE_121_CREDENTIAL_SECRET: ${QIANTIE_121_CREDENTIAL_SECRET}\n'
              '      QIANTIE_121_STORAGE_STATE_SECRET: ${QIANTIE_121_STORAGE_STATE_SECRET}\n'
          )
          if text.count(node_marker) != 1:
              raise SystemExit('unexpected v88-node worker URL marker count')
          text = text.replace(node_marker, node_insert, 1)

          worker_marker = '      QIANTIE_121_SESSION_DIR: /data/sessions\n'
          worker_insert = worker_marker + (
              '      QIANTIE_121_WORKER_SECRET: ${QIANTIE_121_WORKER_SECRET}\n'
              '      QIANTIE_121_CREDENTIAL_SECRET: ${QIANTIE_121_CREDENTIAL_SECRET}\n'
              '      QIANTIE_121_STORAGE_STATE_SECRET: ${QIANTIE_121_STORAGE_STATE_SECRET}\n'
          )
          if text.count(worker_marker) != 1:
              raise SystemExit('unexpected worker session-dir marker count')
          overlay.write_text(text.replace(worker_marker, worker_insert, 1))
          PY

          cat > tests/v88-release-worker-secret-consistency.test.js <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('fs');
          const path = require('path');

          const root = path.join(__dirname, '..');
          const workflow = fs.readFileSync(path.join(root, '.github', 'workflows', 'v88-linux-amd64-image-release.yml'), 'utf8');
          const overlay = fs.readFileSync(path.join(root, 'deploy', 'v88-public', 'docker-compose.browser-worker.yml'), 'utf8');

          function serviceBlock(source, serviceName) {
            const lines = source.split('\n');
            const start = lines.findIndex(line => line === `  ${serviceName}:`);
            assert.ok(start >= 0, `missing service ${serviceName}`);
            let end = lines.length;
            for (let i = start + 1; i < lines.length; i += 1) {
              if (/^  [A-Za-z0-9_.-]+:\s*$/.test(lines[i])) { end = i; break; }
            }
            return lines.slice(start, end).join('\n');
          }

          test('Node 与 121 Worker 必须由同一个 compose env-file 显式注入内部密钥', () => {
            const node = serviceBlock(overlay, 'v88-node');
            const worker = serviceBlock(overlay, 'novel-fetch-121-worker');
            for (const block of [node, worker]) {
              assert.match(block, /QIANTIE_121_WORKER_SECRET: \$\{QIANTIE_121_WORKER_SECRET\}/);
              assert.match(block, /QIANTIE_121_CREDENTIAL_SECRET: \$\{QIANTIE_121_CREDENTIAL_SECRET\}/);
              assert.match(block, /QIANTIE_121_STORAGE_STATE_SECRET: \$\{QIANTIE_121_STORAGE_STATE_SECRET\}/);
            }
            const canonical = 'compose=(docker compose --env-file "$compose_dir/novel-fetch-121.env" -f "$compose_file" -f "$compose_dir/docker-compose.browser-worker.yml")';
            assert.equal(workflow.split(canonical).length - 1, 3, 'deploy/verify/rollback 三处必须使用同一 env-file 做 Compose 插值');
          });
          EOF
          sed -i 's/^          //' tests/v88-release-worker-secret-consistency.test.js

      - name: Verify focused release contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test tests/v88-release-worker-secret-consistency.test.js tests/v88-release-registry-resilience.test.js

      - name: Commit patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v88-linux-amd64-image-release.yml deploy/v88-public/docker-compose.browser-worker.yml tests/v88-release-worker-secret-consistency.test.js
          git commit -m 'fix(v88): unify 121 worker internal secrets'
          git push origin HEAD:v88

      - name: Remove one-shot patch workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git pull --ff-only origin v88
          git rm .github/workflows/v88-worker-secret-consistency-patch-once.yml
          git commit -m 'ci(v88): remove one-shot worker secret patch'
          git push origin HEAD:v88
