name: Codex Public Auth Diagnostic Once

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root

jobs:
  inspect-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare ECS SSH
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          timeout 15 ssh-keyscan -H "$ECS_HOST" > "$HOME/.ssh/known_hosts"

      - name: Inspect public Node authentication state without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          timeout 90 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          stage_unit=qiantie-v88-node-stage.service
          stage_env=/opt/qiantie/v88/shared/env/v88-stage.env
          stage_dir="$(systemctl show "$stage_unit" -p WorkingDirectory --value)"
          echo "stage_dir=$stage_dir"
          test -d "$stage_dir"

          echo "stage_release_sha=$(tr -d '\r\n' < "$stage_dir/RELEASE-SHA" 2>/dev/null || true)"
          echo "stage_env_mode=$(sed -n 's/^QIANTIE_DEPLOY_MODE=//p' "$stage_env" | tail -n1)"
          echo "stage_env_release=$(sed -n 's/^QIANTIE_RELEASE_SHA=//p' "$stage_env" | tail -n1)"
          echo "stage_env_data=$(sed -n 's#^QIANTIE_DATA_DIR=##p' "$stage_env" | tail -n1)"

          echo '--- persistence paths ---'
          for path in \
            "$stage_dir/data" \
            "$stage_dir/data/sessions.json" \
            "$stage_dir/app/data" \
            "$stage_dir/app/data/sessions.json" \
            /opt/qiantie/v88/shared/data \
            /opt/qiantie/v88/shared/data/sessions.json; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              stat -c 'path=%n type=%F size=%s mtime=%y target=%N' "$path" 2>/dev/null || true
            else
              echo "path=$path missing"
            fi
          done

          echo '--- session summary ---'
          python3 - <<'PY'
          import json
          import os
          import time

          candidates = [
              '/opt/qiantie/v88/shared/data/sessions.json',
              '/opt/qiantie/v88/shared/data/data/sessions.json',
          ]
          seen = set()
          for path in candidates:
              real = os.path.realpath(path)
              if real in seen or not os.path.isfile(real):
                  continue
              seen.add(real)
              try:
                  with open(real, 'r', encoding='utf-8') as fh:
                      data = json.load(fh)
                  now = int(time.time() * 1000)
                  values = list(data.values()) if isinstance(data, dict) else []
                  active = sum(1 for item in values if isinstance(item, dict) and isinstance(item.get('expiresAt'), int) and item['expiresAt'] > now)
                  expired = sum(1 for item in values if isinstance(item, dict) and isinstance(item.get('expiresAt'), int) and item['expiresAt'] <= now)
                  print(f'sessions_file={real}')
                  print(f'sessions_count={len(values)}')
                  print(f'sessions_active={active}')
                  print(f'sessions_expired={expired}')
              except Exception as exc:
                  print(f'sessions_parse_error={type(exc).__name__}')
          PY

          echo '--- internal status codes ---'
          for path in /api/build-info /api/login/session /batch-rewrite/index.html /user-content/avatars/choushiyiguai.jpg; do
            code="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:18081$path" || true)"
            echo "stage_http_${path//\//_}=$code"
          done
          for path in /api/build-info /api/login/session /batch-rewrite/index.html /user-content/avatars/choushiyiguai.jpg; do
            code="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path" || true)"
            echo "public_http_${path//\//_}=$code"
          done

          echo '--- auth-related journal counts ---'
          journal="$(journalctl -u "$stage_unit" -n 300 --no-pager 2>/dev/null || true)"
          printf '%s\n' "$journal" | grep -Eic 'unauthorized|invalid or expired token|401' | awk '{print "journal_auth_error_lines=" $1}'
          REMOTE
