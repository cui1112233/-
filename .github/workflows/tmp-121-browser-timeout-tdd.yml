name: TMP 121 Browser Timeout TDD

on:
  push:
    branches:
      - fix/v88-121-browser-login-timeout-20260906
    paths:
      - 'tests/121-browser-client.test.js'
      - 'lib/novel-fetch-workshop/121-browser-client.js'
      - '.github/workflows/tmp-121-browser-timeout-tdd.yml'

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 121 browser client regression
        run: node --test tests/121-browser-client.test.js
