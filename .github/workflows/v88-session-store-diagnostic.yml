name: V88 Session Store Diagnostic
# Runs only when this diagnostic definition changes; it never modifies session data.

on:
  workflow_dispatch:
  push:
    branches: [v88]
    paths:
      - '.github/workflows/v88-session-store-diagnostic.yml'

permissions:
  contents: read

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Prepare ECS SSH
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          timeout 15 ssh-keyscan -T 10 -H "$ECS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"

      - name: Inspect authenticated session storage without reading sessions
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15 -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          timeout 90 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s <<'REMOTE' | tee session-diagnostic.txt
          set -Eeuo pipefail
          cd /opt/qiantie/v88/deploy/v88-public
          node_id="$(docker compose -f docker-compose.yml ps -q v88-node)"
          test -n "$node_id"
          echo "node_state=$(docker inspect -f '{{.State.Status}}' "$node_id")"
          docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app/data"}}data_mount_type={{.Type}} data_mount_name={{.Name}}{{end}}{{end}}' "$node_id"
          docker exec "$node_id" node -e '
          const fs = require("node:fs");
          const file = "/app/data/sessions.json";
          if (!fs.existsSync(file)) {
            console.log("session_file=absent");
            process.exit(0);
          }
          const stat = fs.statSync(file);
          let records;
          try { records = JSON.parse(fs.readFileSync(file, "utf8")); } catch { console.log("session_file=invalid_json"); process.exit(0); }
          if (!records || typeof records !== "object" || Array.isArray(records)) { console.log("session_file=invalid_shape"); process.exit(0); }
          const now = Date.now();
          const values = Object.values(records);
          const valid = values.filter(value => value && typeof value === "object" && Number.isSafeInteger(value.expiresAt) && value.expiresAt > now).length;
          const expired = values.filter(value => value && typeof value === "object" && Number.isSafeInteger(value.expiresAt) && value.expiresAt <= now).length;
          console.log("session_file=valid_json");
          console.log("session_record_count=" + values.length);
          console.log("session_valid_count=" + valid);
          console.log("session_expired_count=" + expired);
          console.log("session_file_mtime=" + stat.mtime.toISOString());
          '
          REMOTE

      - name: Upload non-sensitive session diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v88-session-diagnostic
          path: session-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Verify public authentication endpoint is reachable
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "http://${ECS_HOST}:3000/api/login" || true)"
          echo "public_login_get_status=$status"
          test "$status" = 401
