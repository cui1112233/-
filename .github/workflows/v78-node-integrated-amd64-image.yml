name: V78 Node Integrated AMD64 Image

on:
  push:
    branches:
      - feat/v78-go-integrated-novel-fetch-doubao
  workflow_dispatch:

jobs:
  image-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build AMD64 Node image tar
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag qiantie-v78-node:public-v78 \
            --provenance=false \
            --output type=docker,dest=/tmp/qiantie-v78-node-public-v78-amd64.tar \
            .
          sha256sum /tmp/qiantie-v78-node-public-v78-amd64.tar | tee /tmp/qiantie-v78-node-public-v78-amd64.tar.sha256
      - name: Upload AMD64 image tar
        uses: actions/upload-artifact@v4
        with:
          name: qiantie-v78-node-public-v78-amd64
          path: |
            /tmp/qiantie-v78-node-public-v78-amd64.tar
            /tmp/qiantie-v78-node-public-v78-amd64.tar.sha256
          if-no-files-found: error
