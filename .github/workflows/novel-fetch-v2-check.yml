name: V78 Full Regression Check

on:
  push:
    branches:
      - integration/v78-novel-fetch-v2-20260901
      - release/production-v78.3.0.3-batch-factory-go-first
      - fix/v78-full-regression-20260902
      - fix/v78-schedule-121-contract-20260902
  workflow_dispatch:

jobs:
  novel-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run novel fetch V2 tests
        run: >-
          node --test
          tests/novel-fetch-v2-ui.test.js
          tests/novel-fetch-v2-run-controls.test.js
          tests/novel-fetch-v2-task-list-bridge.test.js
          tests/novel-fetch-v2-page.test.js
          tests/novel-fetch-queue-stop-control.test.js
          tests/novel-fetch-batches.test.js
          tests/novel-fetch-target-web-submit.test.js
          tests/novel-fetch-runner.test.js
          tests/batch-rewrite-v2-batch-router.test.js
          tests/batch-rewrite-v2-retry-api.test.js
          tests/batch-rewrite-batches-api.test.js
          tests/batch-rewrite-v2-router.test.js
          tests/novel-fetch-v2-compose.test.js

  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run root Node regression tests
        run: node --test test/*.test.js tests/*.test.js lib/*.test.js

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run frontend unit tests
        run: node --test src/shared/pet/*.test.js
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  go-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: qiantie_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BFV11_MYSQL_TEST_DSN: root:root@tcp(127.0.0.1:3306)/qiantie_test?parseTime=true&multiStatements=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run Go backend tests
        shell: bash
        run: |
          set +e
          go test ./... -count=1 2>&1 | tee go-test.log
          status=${PIPESTATUS[0]}
          exit "$status"
        working-directory: backend
      - name: Upload Go test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-log
          path: backend/go-test.log

  browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install 121 Browser Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: services/121-browser-worker
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Run 121 Browser Worker tests
        run: npm test
        working-directory: services/121-browser-worker
