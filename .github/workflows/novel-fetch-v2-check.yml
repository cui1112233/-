name: Novel Fetch V2 Check

on:
  push:
    branches:
      - integration/v78-novel-fetch-v2-final-20260902
      - release/production-v78.3.0.3-batch-factory-go-first
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci

      - name: Run novel fetch V2 focused tests
        run: >-
          node --test
          tests/novel-fetch-v2-ui.test.js
          tests/novel-fetch-v2-run-controls.test.js
          tests/novel-fetch-v2-task-list-bridge.test.js
          tests/novel-fetch-v2-page.test.js
          tests/novel-fetch-queue-stop-control.test.js
          tests/novel-fetch-batches.test.js
          tests/novel-fetch-target-web-submit.test.js
          tests/novel-fetch-runner.test.js
          tests/batch-rewrite-v2-batch-router.test.js
          tests/batch-rewrite-v2-retry-api.test.js
          tests/batch-rewrite-batches-api.test.js
          tests/batch-rewrite-v2-router.test.js
          tests/novel-fetch-v2-compose.test.js

      - name: Run full Node regression
        run: |
          TEST_FILES="$(find tests lib -type f -name '*.test.js' -print)"
          if [ -d routes ]; then
            ROUTE_TEST_FILES="$(find routes -type f -name '*.test.js' -print)"
            TEST_FILES="$TEST_FILES $ROUTE_TEST_FILES"
          fi
          node --test $TEST_FILES

      - name: Install 121 Browser Worker dependencies
        run: npm --prefix services/121-browser-worker install --ignore-scripts --no-audit --no-fund

      - name: Run 121 Browser Worker tests
        run: npm --prefix services/121-browser-worker test

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=moderate

      - name: Build frontend
        run: npm run frontend:build
