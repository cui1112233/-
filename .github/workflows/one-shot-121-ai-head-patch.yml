name: One-shot 121 AI Head Patch

on:
  push:
    branches:
      - 09-batch-factory-independent-pipeline
    paths:
      - '.github/workflows/one-shot-121-ai-head-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09-batch-factory-independent-pipeline
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/patch-121-ai-head.py

      - name: Install root dependencies
        run: npm ci

      - name: Run Batch Factory tests
        run: node --test test/batch-factory.test.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit implementation
        run: |
          git rm .github/workflows/one-shot-121-ai-head-patch.yml scripts/patch-121-ai-head.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/user/pages/BatchFactoryPageV10.jsx frontend/src/shared/api/batchFactory.js routes/batch-factory-controls.js routes/batch-factory-publish.js test/batch-factory.test.js
          git commit -m "feat(batch-factory): match 121 AI head behavior"
          git push origin HEAD:09-batch-factory-independent-pipeline
