name: Codex Public Local Novel Fetch Layout Once

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root
  NODE_LAYOUT_SHA256: 7aea02f318f2573ad0ab111e6578c4d6d5b91ae412abb6f99128c2c75225b728

concurrency:
  group: codex-public-local-layout-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout V88 deployment scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the tested V88 Go route source
        uses: actions/checkout@v4
        with:
          ref: codex-public-local-layout-runtime
          path: v88-go-source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the exact local V78 processing-layout Node source
        uses: actions/checkout@v4
        with:
          ref: v88
          path: v88-node-source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate source identity and local layout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(sha256sum v88-node-source/frontend/dist/batch-rewrite/index.html | awk '{print $1}')" = "$NODE_LAYOUT_SHA256"
          grep -q 'versionConfigBtn' v88-node-source/frontend/dist/batch-rewrite/index.html
          for file in \
            v78-novel-fetch-v2.js \
            v78-novel-fetch-v2-date.js \
            v78-novel-fetch-v2-config.js \
            v78-novel-fetch-v2-layout.js \
            v78-novel-fetch-v2-run-controls.js; do
            test -s "v88-node-source/public/batch-rewrite/$file"
          done
          grep -q 'buildLoginRequest' v88-node-source/routes/novel-fetch-upload.js
          grep -q "headers\['set-cookie'\]" v88-node-source/routes/novel-fetch-upload.js
          grep -q 'Cookie: cookie' v88-node-source/routes/novel-fetch-upload.js
          grep -q 'NovelFetchStore' v88-go-source/backend/internal/httpapi/router.go
          test -f deploy/v88-direct/stage-node-host.sh
          test -f deploy/v88-direct/cutover-node-host.sh

      - name: Build and push AMD64 images
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::12}"
          go_image="ghcr.io/${owner}/qiantie-v88:public-local-layout-go-${short_sha}"

          docker build --platform linux/amd64 --provenance=false -t "$go_image" v88-go-source/backend
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$go_image")" = linux/amd64

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$owner" --password-stdin
          docker push "$go_image"
          docker logout ghcr.io >/dev/null 2>&1 || true

          echo "GO_IMAGE=$go_image" >> "$GITHUB_ENV"

      - name: Prepare ECS SSH
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if timeout 15 ssh-keyscan -H "$ECS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null && test -s "$HOME/.ssh/known_hosts"; then
              break
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep 2
          done
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload local novel-fetch assets and stage scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          release_dir="/opt/qiantie/releases/v88-stage/${GITHUB_SHA}"

          mkdir -p release/v88-batch-rewrite
          cp v88-node-source/frontend/dist/batch-rewrite/index.html release/v88-batch-rewrite/
          cp v88-node-source/frontend/dist/batch-rewrite/app.js release/v88-batch-rewrite/
          cp v88-node-source/frontend/dist/batch-rewrite/styles.css release/v88-batch-rewrite/
          cp v88-node-source/frontend/dist/batch-rewrite/121-login-hotfix.js release/v88-batch-rewrite/
          for file in \
            v78-novel-fetch-v2.js \
            v78-novel-fetch-v2-date.js \
            v78-novel-fetch-v2-config.js \
            v78-novel-fetch-v2-layout.js \
            v78-novel-fetch-v2-run-controls.js; do
            cp "v88-node-source/public/batch-rewrite/$file" "release/v88-batch-rewrite/$file"
          done
          python3 - <<'PY'
          from pathlib import Path

          index = Path('release/v88-batch-rewrite/index.html')
          source = index.read_text(encoding='utf-8')
          tags = [
              '<script src="/batch-rewrite/v78-novel-fetch-v2.js?v=20260901-source-aligned-r3"></script>',
              '<script src="/batch-rewrite/v78-novel-fetch-v2-date.js?v=20260901-source-aligned-r3"></script>',
              '<script src="/batch-rewrite/v78-novel-fetch-v2-config.js?v=20260901-source-aligned-r3"></script>',
              '<script src="/batch-rewrite/v78-novel-fetch-v2-layout.js?v=20260901-image-layout-r2"></script>',
              '<script src="/batch-rewrite/v78-novel-fetch-v2-run-controls.js?v=20260902-run-controls-r2"></script>',
          ]
          marker = '</body>'
          if marker not in source:
              raise SystemExit('V88 batch-rewrite index has no body marker')
          source = source.replace(marker, '    ' + '\n    '.join(tags) + '\n  ' + marker, 1)
          index.write_text(source, encoding='utf-8')
          PY
          timeout 45 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" "rm -rf /tmp/qiantie-batch-rewrite && mkdir -p /tmp/qiantie-batch-rewrite"
          timeout 60 scp "${ssh_opts[@]}" \
            deploy/v88-direct/stage-node-host.sh \
            deploy/v88-direct/cutover-node-host.sh \
            "$ECS_USER@$ECS_HOST:/tmp/"
          timeout 60 scp "${ssh_opts[@]}" \
            release/v88-batch-rewrite/index.html \
            release/v88-batch-rewrite/app.js \
            release/v88-batch-rewrite/styles.css \
            release/v88-batch-rewrite/121-login-hotfix.js \
            release/v88-batch-rewrite/v78-novel-fetch-v2.js \
            release/v88-batch-rewrite/v78-novel-fetch-v2-date.js \
            release/v88-batch-rewrite/v78-novel-fetch-v2-config.js \
            release/v88-batch-rewrite/v78-novel-fetch-v2-layout.js \
            release/v88-batch-rewrite/v78-novel-fetch-v2-run-controls.js \
            "$ECS_USER@$ECS_HOST:/tmp/qiantie-batch-rewrite/"

      - name: Deploy Go route and cut public Node to the local layout
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$GHCR_TOKEN" | timeout 60 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" "docker login ghcr.io --username '$owner' --password-stdin"
          timeout 1200 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$GO_IMAGE" "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          go_image="$1"
          sha="$2"
          compose_file=/opt/qiantie/v88/deploy/v88-public/docker-compose.yml
          release_dir="/opt/qiantie/releases/v88-stage/$sha"
          network=v88-public_qiantie_internal
          compose=(docker compose -f "$compose_file")

          test -s "$compose_file"
          go_id="$(docker ps --filter 'name=v88-public-go-api' --format '{{.ID}}' | head -n1)"
          test -n "$go_id"
          old_go_image="$(docker inspect "$go_id" --format '{{.Config.Image}}')"
          rollback_go_image="qiantie-go-api:codex-rollback-${sha:0:12}-$(date +%Y%m%d%H%M%S)"
          docker tag "$old_go_image" "$rollback_go_image"

          rollback_go() {
            status=$?
            trap - ERR
            if [ "$status" -ne 0 ]; then
              docker tag "$rollback_go_image" "$old_go_image" || true
              "${compose[@]}" up -d --no-build --no-deps --force-recreate --pull never go-api || true
            fi
            docker logout ghcr.io >/dev/null 2>&1 || true
            exit "$status"
          }
          trap rollback_go ERR

          docker pull "$go_image"
          docker image inspect "$go_image" --format '{{.Os}}/{{.Architecture}}' | grep -qx linux/amd64
          docker tag "$go_image" "$old_go_image"
          "${compose[@]}" up -d --no-build --no-deps --force-recreate --pull never go-api

          go_id="$(docker ps --filter 'name=v88-public-go-api' --format '{{.ID}}' | head -n1)"
          test -n "$go_id"
          test "$(docker inspect "$go_id" --format '{{.State.Status}}')" = running

          current_release_dir="$(systemctl show qiantie-v88-node-stage.service -p WorkingDirectory --value)"
          case "$current_release_dir" in
            /opt/qiantie/releases/v88-stage/*) ;;
            *) echo "current host Node stage directory is invalid: $current_release_dir" >&2; exit 1 ;;
          esac
          test -d "$current_release_dir"
          rm -rf "$release_dir"/*
          cp -a "$current_release_dir/." "$release_dir/"
          # The running legacy Node serves /batch-rewrite from frontend/dist
          # before its authenticated fallback route. Keep the public copy too,
          # but never remove the runtime directory or requests become 401.
          mkdir -p "$release_dir/frontend/dist/batch-rewrite"
          mkdir -p "$release_dir/frontend/public/batch-rewrite"
          cp /tmp/qiantie-batch-rewrite/index.html "$release_dir/frontend/public/batch-rewrite/"
          cp /tmp/qiantie-batch-rewrite/app.js "$release_dir/frontend/public/batch-rewrite/"
          cp /tmp/qiantie-batch-rewrite/styles.css "$release_dir/frontend/public/batch-rewrite/"
          cp /tmp/qiantie-batch-rewrite/index.html "$release_dir/frontend/dist/batch-rewrite/"
          cp /tmp/qiantie-batch-rewrite/app.js "$release_dir/frontend/dist/batch-rewrite/"
          cp /tmp/qiantie-batch-rewrite/styles.css "$release_dir/frontend/dist/batch-rewrite/"
          cp /tmp/qiantie-batch-rewrite/121-login-hotfix.js "$release_dir/frontend/public/batch-rewrite/"
          cp /tmp/qiantie-batch-rewrite/121-login-hotfix.js "$release_dir/frontend/dist/batch-rewrite/"
          for file in \
            v78-novel-fetch-v2.js \
            v78-novel-fetch-v2-date.js \
            v78-novel-fetch-v2-config.js \
            v78-novel-fetch-v2-layout.js \
            v78-novel-fetch-v2-run-controls.js; do
            cp "/tmp/qiantie-batch-rewrite/$file" "$release_dir/frontend/public/batch-rewrite/$file"
            cp "/tmp/qiantie-batch-rewrite/$file" "$release_dir/frontend/dist/batch-rewrite/$file"
          done
          printf '%s\n' "$sha" > "$release_dir/RELEASE-SHA"
          chmod 700 "/tmp/stage-node-host.sh" "/tmp/cutover-node-host.sh"
          bash /tmp/stage-node-host.sh "$release_dir" "$sha"

          stage_html_file="/tmp/stage-local-layout-${sha}.html"
          curl -fsS --max-time 10 http://127.0.0.1:18081/batch-rewrite/index.html -o "$stage_html_file"
          grep -q 'versionConfigBtn' "$stage_html_file"
          grep -q '/batch-rewrite/v78-novel-fetch-v2.js' "$stage_html_file"
          grep -q '/batch-rewrite/v78-novel-fetch-v2-layout.js' "$stage_html_file"
          grep -q '/batch-rewrite/v78-novel-fetch-v2-run-controls.js' "$stage_html_file"
          rm -f "$stage_html_file"
          bash /tmp/cutover-node-host.sh "$sha"

          curl -fsS --max-time 10 http://127.0.0.1:3000/api/build-info \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("app_version")=="v78.3.0.3"; assert d.get("build_id")=="v78.3.0.3-remote-workbench-20260819-r1"'

          rm -f /tmp/stage-node-host.sh /tmp/cutover-node-host.sh
          rm -rf /tmp/qiantie-batch-rewrite
          docker logout ghcr.io >/dev/null 2>&1 || true
          trap - ERR
          echo "PUBLIC_LOCAL_LAYOUT_CUTOVER_OK sha=$sha"
          REMOTE

      - name: Verify public local layout externally
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --retry 2 --retry-delay 1 --max-time 15 "http://${ECS_HOST}:3000/novel-fetch" >/dev/null
          public_html="$(curl -fsS --retry 2 --retry-delay 1 --max-time 15 "http://${ECS_HOST}:3000/batch-rewrite/index.html")"
          grep -q 'versionConfigBtn' <<<"$public_html"
          grep -q '/batch-rewrite/v78-novel-fetch-v2-run-controls.js' <<<"$public_html"
          curl -fsS --retry 2 --retry-delay 1 --max-time 15 "http://${ECS_HOST}:3000/api/build-info" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("app_version")=="v78.3.0.3"; assert d.get("build_id")=="v78.3.0.3-remote-workbench-20260819-r1"'
          echo 'PUBLIC_LOCAL_NOVEL_FETCH_LAYOUT_VERIFIED=true'
