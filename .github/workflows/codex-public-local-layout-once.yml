name: Codex Public Local Novel Fetch Layout Once

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root
  NODE_LAYOUT_SHA256: 64bb852e2c7abac64165fbee12b079f937a140a571fc74f57a076352fa3e485b

concurrency:
  group: codex-public-local-layout-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout V88 deployment scripts and Go source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the tested V88 Go route source
        uses: actions/checkout@v4
        with:
          ref: codex-public-local-layout-runtime
          path: v88-go-source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the exact local-layout Node source
        uses: actions/checkout@v4
        with:
          ref: feat/v78-go-integrated-novel-fetch-doubao
          path: v78-node-source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate source identity and local layout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(sha256sum v78-node-source/frontend/dist/batch-rewrite/index.html | awk '{print $1}')" = "$NODE_LAYOUT_SHA256"
          grep -q 'buildLoginRequest' v78-node-source/routes/novel-fetch-upload.js
          grep -q "headers\['set-cookie'\]" v78-node-source/routes/novel-fetch-upload.js
          grep -q 'Cookie: cookie' v78-node-source/routes/novel-fetch-upload.js
          grep -q 'NovelFetchStore' v88-go-source/backend/internal/httpapi/router.go
          test -f deploy/v88-direct/stage-node-host.sh
          test -f deploy/v88-direct/cutover-node-host.sh

      - name: Build and push AMD64 images
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::12}"
          node_image="ghcr.io/${owner}/qiantie-v88:public-local-layout-node-${short_sha}"
          go_image="ghcr.io/${owner}/qiantie-v88:public-local-layout-go-${short_sha}"

          docker build --platform linux/amd64 --provenance=false -t "$node_image" v78-node-source
          docker build --platform linux/amd64 --provenance=false -t "$go_image" v88-go-source/backend
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$node_image")" = linux/amd64
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$go_image")" = linux/amd64

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$owner" --password-stdin
          docker push "$node_image"
          docker push "$go_image"
          docker logout ghcr.io >/dev/null 2>&1 || true

          echo "NODE_IMAGE=$node_image" >> "$GITHUB_ENV"
          echo "GO_IMAGE=$go_image" >> "$GITHUB_ENV"

      - name: Package the local-layout Node release
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -a deploy/v88-direct v78-node-source/deploy/v88-direct
          ( cd v78-node-source && npm ci --omit=dev )
          mkdir -p release
          cd v78-node-source
          bash deploy/v88-direct/package-node-release.sh "$GITHUB_SHA" "$GITHUB_WORKSPACE/release/v88-node-${GITHUB_SHA}.tar.gz"
          sha256sum "$GITHUB_WORKSPACE/release/v88-node-${GITHUB_SHA}.tar.gz" | tee "$GITHUB_WORKSPACE/release/v88-node-${GITHUB_SHA}.tar.gz.sha256"

      - name: Prepare ECS SSH
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if timeout 15 ssh-keyscan -H "$ECS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null && test -s "$HOME/.ssh/known_hosts"; then
              break
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep 2
          done
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload Node release to an isolated ECS stage directory
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          release_dir="/opt/qiantie/releases/v88-stage/${GITHUB_SHA}"
          payload="release/v88-node-${GITHUB_SHA}.tar.gz"
          payload_sha="$(sha256sum "$payload" | awk '{print $1}')"
          chunk_dir="release/v88-node-${GITHUB_SHA}-chunks"
          rm -rf "$chunk_dir"
          mkdir -p "$chunk_dir"
          split -b 512K -d -a 4 "$payload" "$chunk_dir/source.tar.gz.part-"

          timeout 45 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" "rm -rf '$release_dir' && mkdir -p '$release_dir'"
          index=0
          for part in "$chunk_dir"/source.tar.gz.part-*; do
            index=$((index + 1))
            suffix="${part##*-}"
            timeout 120 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" "cat > '$release_dir/source.tar.gz.part-$suffix'" < "$part"
          done
          timeout 90 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" \
            "cd '$release_dir' && cat source.tar.gz.part-* > source.tar.gz && test \"\$(sha256sum source.tar.gz | awk '{print \$1}')\" = '$payload_sha' && rm -f source.tar.gz.part-*"
          timeout 60 scp "${ssh_opts[@]}" deploy/v88-direct/cutover-node-host.sh "$ECS_USER@$ECS_HOST:/tmp/cutover-node-host-${GITHUB_SHA}.sh"

      - name: Deploy Go route and cut public Node to the local layout
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$GHCR_TOKEN" | timeout 60 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" "docker login ghcr.io --username '$owner' --password-stdin"
          timeout 1200 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$GO_IMAGE" "$NODE_IMAGE" "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          go_image="$1"
          node_image="$2"
          sha="$3"
          compose_file=/opt/qiantie/v88/deploy/v88-public/docker-compose.yml
          release_dir="/opt/qiantie/releases/v88-stage/$sha"
          network=v88-public_qiantie_internal
          compose=(docker compose -f "$compose_file")

          test -s "$compose_file"
          go_id="$(docker ps --filter 'name=v88-public-go-api' --format '{{.ID}}' | head -n1)"
          test -n "$go_id"
          old_go_image="$(docker inspect "$go_id" --format '{{.Config.Image}}')"
          rollback_go_image="${old_go_image}:codex-rollback-${sha:0:12}-$(date +%Y%m%d%H%M%S)"
          docker tag "$old_go_image" "$rollback_go_image"

          rollback_go() {
            status=$?
            trap - ERR
            if [ "$status" -ne 0 ]; then
              docker tag "$rollback_go_image" "$old_go_image" || true
              "${compose[@]}" up -d --no-build --no-deps --force-recreate --pull never go-api || true
            fi
            docker logout ghcr.io >/dev/null 2>&1 || true
            exit "$status"
          }
          trap rollback_go ERR

          docker pull "$go_image"
          docker image inspect "$go_image" --format '{{.Os}}/{{.Architecture}}' | grep -qx linux/amd64
          docker tag "$go_image" "$old_go_image"
          "${compose[@]}" up -d --no-build --no-deps --force-recreate --pull never go-api

          go_id="$(docker ps --filter 'name=v88-public-go-api' --format '{{.ID}}' | head -n1)"
          test -n "$go_id"
          test "$(docker inspect "$go_id" --format '{{.State.Status}}')" = running

          cd "$release_dir"
          test -s source.tar.gz
          tar -xzf source.tar.gz
          test "$(tr -d '\r\n' < RELEASE-SHA)" = "$sha"
          bash deploy/v88-direct/stage-node-host.sh "$release_dir" "$sha"
          chmod 700 "/tmp/cutover-node-host-${sha}.sh"
          bash "/tmp/cutover-node-host-${sha}.sh" "$sha"

          public_html="$(curl -fsS --max-time 10 http://127.0.0.1:3000/batch-rewrite/index.html)"
          printf '%s' "$public_html" | sha256sum | awk -v expected='64bb852e2c7abac64165fbee12b079f937a140a571fc74f57a076352fa3e485b' '$1 == expected { ok=1 } END { exit ok ? 0 : 1 }'
          printf '%s' "$public_html" | grep -q 'columnOrderInput'
          if printf '%s' "$public_html" | grep -q 'v78-novel-fetch-v2.js'; then
            echo 'unexpected V78 layout override script remains in public HTML' >&2
            exit 1
          fi
          curl -fsS --max-time 10 http://127.0.0.1:3000/api/build-info \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("git_sha")==sys.argv[1]; assert d.get("deploy_mode")=="git-direct"' "$sha"

          rm -f "/tmp/cutover-node-host-${sha}.sh" "$release_dir/source.tar.gz"
          docker logout ghcr.io >/dev/null 2>&1 || true
          trap - ERR
          echo "PUBLIC_LOCAL_LAYOUT_CUTOVER_OK sha=$sha"
          REMOTE

      - name: Verify public local layout externally
        shell: bash
        run: |
          set -Eeuo pipefail
          html="$(curl -fsS --retry 2 --retry-delay 1 --max-time 15 http://${ECS_HOST}:3000/batch-rewrite/index.html)"
          printf '%s' "$html" | sha256sum | awk -v expected="$NODE_LAYOUT_SHA256" '$1 == expected { ok=1 } END { exit ok ? 0 : 1 }'
          printf '%s' "$html" | grep -q 'columnOrderInput'
          if printf '%s' "$html" | grep -q 'v78-novel-fetch-v2.js'; then
            echo 'public still serves the old V78 layout override' >&2
            exit 1
          fi
          curl -fsS --retry 2 --retry-delay 1 --max-time 15 "http://${ECS_HOST}:3000/novel-fetch" >/dev/null
          echo 'PUBLIC_LOCAL_NOVEL_FETCH_LAYOUT_VERIFIED=true'
