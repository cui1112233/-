name: V88 Go Runtime Repair

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact V88 source SHA for the Go-only emergency repair
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v88-public-release
  cancel-in-progress: false

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root

jobs:
  repair:
    if: github.ref == 'refs/heads/v88'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Validate requested Go release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build and extract only the exact Go binary
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          docker build --platform linux/amd64 --build-arg "QIANTIE_RELEASE_SHA=$RELEASE_SHA" -t "qiantie-go-api:$RELEASE_SHA" backend
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "qiantie-go-api:$RELEASE_SHA")" = linux/amd64
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "qiantie-go-api:$RELEASE_SHA")" = "$RELEASE_SHA"
          docker create --name go_binary_extract "qiantie-go-api:$RELEASE_SHA" true
          trap 'docker rm -f go_binary_extract >/dev/null 2>&1 || true' EXIT
          docker cp go_binary_extract:/qiantie /tmp/qiantie
          sha256sum /tmp/qiantie > /tmp/v88-go-binary.sha256
          gzip -1 < /tmp/qiantie > /tmp/v88-go-binary.gz
          test -s /tmp/v88-go-binary.gz

      - name: Prepare verified ECS connection
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          printf '%s\n' '115.190.156.223 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFdxABss1Y5GY5LXYWo48tsRIjPEeBMfKS74DDMNWFZz' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer the compact Go binary and compose contract
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          timeout 1200 scp "${ssh_opts[@]}" /tmp/v88-go-binary.gz "$ECS_USER@$ECS_HOST:/tmp/v88-go-binary-${RELEASE_SHA}.gz"
          timeout 60 scp "${ssh_opts[@]}" /tmp/v88-go-binary.sha256 "$ECS_USER@$ECS_HOST:/tmp/v88-go-binary-${RELEASE_SHA}.sha256"
          timeout 60 scp "${ssh_opts[@]}" deploy/v88-public/docker-compose.yml "$ECS_USER@$ECS_HOST:/tmp/v88-go-compose-${RELEASE_SHA}.yml"

      - name: Recreate only Go API with rollback and runtime verification
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          timeout 1200 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$RELEASE_SHA" "${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          backup_id="$2"
          binary_file="/tmp/v88-go-binary-${expected_sha}.gz"
          checksum_file="/tmp/v88-go-binary-${expected_sha}.sha256"
          compiled_binary="/tmp/qiantie-${expected_sha}"
          compose_file="/tmp/v88-go-compose-${expected_sha}.yml"
          cd /opt/qiantie/v88/deploy/v88-public
          test -s .env
          test -s docker-compose.yml
          test -s "$binary_file"
          test -s "$checksum_file"
          test -s "$compose_file"
          gzip -dc "$binary_file" > "$compiled_binary"
          chmod 0555 "$compiled_binary"
          expected_digest="$(awk '{print $1}' "$checksum_file")"
          actual_digest="$(sha256sum "$compiled_binary" | awk '{print $1}')"
          test "$actual_digest" = "$expected_digest"
          current_go_id="$(docker compose -f docker-compose.yml ps -q go-api)"
          test -n "$current_go_id"
          test "$(docker inspect --format '{{.State.Running}}' "$current_go_id")" = true
          base_go_image="$(docker inspect --format '{{.Config.Image}}' "$current_go_id")"
          patch_container="v88-go-patch-${expected_sha:0:12}"
          docker rm -f "$patch_container" >/dev/null 2>&1 || true
          docker create --name "$patch_container" "$base_go_image" true >/dev/null
          docker cp "$compiled_binary" "$patch_container:/qiantie"
          go_image="ghcr.io/cui1112233/qiantie-go-api:${expected_sha}"
          docker commit --change "LABEL org.opencontainers.image.revision=$expected_sha" --change "ENV QIANTIE_RELEASE_SHA=$expected_sha" "$patch_container" "$go_image" >/dev/null
          docker rm -f "$patch_container" >/dev/null
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$go_image")" = linux/amd64
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$go_image")" = "$expected_sha"
          cp -a .env ".env.pre-go-repair-${backup_id}"
          cp -a docker-compose.yml "docker-compose.yml.pre-go-repair-${backup_id}"
          rollback() {
            status=$?
            trap - EXIT ERR
            if [ "$status" -ne 0 ]; then
              cp -a ".env.pre-go-repair-${backup_id}" .env || true
              cp -a "docker-compose.yml.pre-go-repair-${backup_id}" docker-compose.yml || true
              docker compose -f docker-compose.yml up -d --no-deps --force-recreate --pull never go-api || true
            fi
            rm -f "$binary_file" "$checksum_file" "$compiled_binary" "$compose_file" "/tmp/v88-go-runtime-${expected_sha}.tar.gz"
            exit "$status"
          }
          trap rollback EXIT ERR
          set_env() {
            key="$1" value="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              printf '\n%s=%s\n' "$key" "$value" >> .env
            fi
          }
          set_env QIANTIE_GO_IMAGE "$go_image"
          set_env QIANTIE_GO_RELEASE_SHA "$expected_sha"
          cp "$compose_file" docker-compose.yml
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml up -d --no-deps --force-recreate --pull never go-api
          go_id="$(docker compose -f docker-compose.yml ps -q go-api)"
          node_id="$(docker compose -f docker-compose.yml ps -q v88-node)"
          test -n "$go_id" && test -n "$node_id"
          test "$(docker inspect --format '{{.State.Running}}' "$go_id")" = true
          docker exec -i "$node_id" node - "$expected_sha" <<'NODE'
          const expected = process.argv[2];
          const base = (process.env.QIANTIE_GO_BASE_URL || 'http://go-api:4000').replace(/\/$/, '');
          (async () => {
            const response = await fetch(`${base}/api/runtime-build-info`, { signal: AbortSignal.timeout(10000) });
            const payload = await response.json();
            if (!response.ok || payload.git_sha !== expected) process.exit(41);
            console.log(`GO_RUNTIME_OK git_sha=${payload.git_sha}`);
          })().catch((error) => { console.error(error.message); process.exit(42); });
          NODE
          docker exec "$go_id" sh -lc 'test -n "$QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_ENDPOINT" && test -n "$QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_REGION" && test -n "$QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_BUCKET" && test -n "$QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_ACCESS_KEY" && test -n "$QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_SECRET_KEY"'
          echo "STATUS=GO_REPAIRED release_sha=$expected_sha"
          trap - EXIT ERR
          rm -f "$binary_file" "$checksum_file" "$compiled_binary" "$compose_file" "/tmp/v88-go-runtime-${expected_sha}.tar.gz"
          REMOTE
