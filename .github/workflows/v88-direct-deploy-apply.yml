name: V88 Direct Deploy Apply

on:
  push:
    branches:
      - feat/v88-git-ecs-direct-deploy-20260907

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v88-git-ecs-direct-deploy-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Docker release trigger
        run: node scripts/patch-v88-docker-release-trigger.js
      - name: Verify RED-to-GREEN scaffold contract
        run: node --test tests/v88-direct-deploy-contract.test.js
      - name: Commit patched workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- .github/workflows/v88-linux-amd64-image-release.yml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v88-linux-amd64-image-release.yml
          git commit -m 'ci(deploy): make Docker release manual-only'
          git push origin HEAD:feat/v88-git-ecs-direct-deploy-20260907
