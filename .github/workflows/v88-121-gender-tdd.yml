name: V88 121 Gender TDD

on:
  push:
    branches:
      - feat/v88-121-gender-source-20261003

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum
      - run: npm ci --omit=dev
      - name: Run focused 121 gender tests
        run: node --test tests/novel-fetch-121-gender.test.js test/batch-factory-v11-source-refill.test.js
      - name: Run related novel-fetch and Batch Factory regressions
        continue-on-error: true
        run: node --test tests/novel-fetch-workshop-*.test.js tests/novel-fetch-ai-running-status.test.js test/batch-factory-v11*.test.js
      - name: Run Go backend tests
        working-directory: backend
        run: go test ./...
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
