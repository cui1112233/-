name: V88 Direct Deploy Node Stage

on:
  workflow_dispatch:
  push:
    branches:
      - v88
    paths:
      - 'deploy/v88-direct/STAGE-REQUEST'

permissions:
  contents: read

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root
  STAGE_ROOT: /opt/qiantie/releases/v88-stage

concurrency:
  group: v88-node-parallel-stage
  cancel-in-progress: true

jobs:
  stage-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Verify packaging contract
        shell: bash
        run: node --test tests/v88-node-release-package.test.js

      - name: Build whitelisted Node release payload
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --omit=dev
          npm --prefix frontend ci
          npm --prefix frontend run build

          install -d frontend/dist/batch-rewrite
          cp frontend/public/batch-rewrite/121-login-hotfix.js frontend/dist/batch-rewrite/121-login-hotfix.js
          cp frontend/public/batch-rewrite/interaction-feedback.js frontend/dist/batch-rewrite/interaction-feedback.js
          cp frontend/public/batch-rewrite/task-visibility-hotfix.js frontend/dist/batch-rewrite/task-visibility-hotfix.js
          cp frontend/public/batch-rewrite/v88-novel-status-center.js frontend/dist/batch-rewrite/v88-novel-status-center.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/dist/batch-rewrite/index.html')
          text = p.read_text(encoding='utf-8')
          tags = [
              ('qiantie-121-login-hotfix', '<script id="qiantie-121-login-hotfix" src="./121-login-hotfix.js?v=20260831-config-guard1"></script>'),
              ('qiantie-novel-fetch-interaction-feedback', '<script id="qiantie-novel-fetch-interaction-feedback" src="./interaction-feedback.js?v=20260906-public-feedback1"></script>'),
              ('qiantie-novel-fetch-task-visibility', '<script id="qiantie-novel-fetch-task-visibility" src="./task-visibility-hotfix.js?v=20260906-task-visibility1"></script>'),
              ('qiantie-novel-status-center', '<script id="qiantie-novel-status-center" src="./v88-novel-status-center.js?v=20260907-r1"></script>'),
          ]
          missing = [tag for marker, tag in tags if f'id="{marker}"' not in text]
          if missing:
              if '</body>' not in text:
                  raise SystemExit('batch-rewrite index has no </body> injection point')
              text = text.replace('</body>', '    ' + '\n    '.join(missing) + '\n  </body>')
              p.write_text(text, encoding='utf-8')
          PY
          rm -rf frontend/node_modules
          bash deploy/v88-direct/package-node-release.sh "$GITHUB_SHA"
          PAYLOAD_BYTES="$(stat -c '%s' "release/v88-node-${GITHUB_SHA}.tar.gz")"
          echo "PAYLOAD_BYTES=$PAYLOAD_BYTES"

      - name: Prepare ECS SSH
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          : > "$HOME/.ssh/known_hosts"
          timeout 20 ssh-keyscan -T 5 -H "$ECS_HOST" >> "$HOME/.ssh/known_hosts" || test -s "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage exact SHA without cutting public traffic
        shell: bash
        run: |
          set -Eeuo pipefail
          release_dir="${STAGE_ROOT}/${GITHUB_SHA}"
          payload="release/v88-node-${GITHUB_SHA}.tar.gz"
          payload_sha="$(sha256sum "$payload" | awk '{print $1}')"
          chunk_dir="release/v88-node-${GITHUB_SHA}-chunks"
          rm -rf "$chunk_dir"
          mkdir -p "$chunk_dir"
          split -b 512K -d -a 4 "$payload" "$chunk_dir/source.tar.gz.part-"

          control_path="$HOME/.ssh/v88-stage-%C"
          ssh_opts=(
            -i "$HOME/.ssh/v88_ecs"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o PasswordAuthentication=no
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o ControlMaster=auto
            -o ControlPersist=300
            -o "ControlPath=$control_path"
          )

          echo 'REMOTE_PREPARE_START'
          timeout 45 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" "rm -rf '$release_dir' && mkdir -p '$release_dir'"
          echo 'REMOTE_PREPARE_DONE'

          chunk_count="$(find "$chunk_dir" -type f -name 'source.tar.gz.part-*' | wc -l | tr -d ' ')"
          test "$chunk_count" -gt 0
          echo "SSH_CHUNK_UPLOAD_START chunks=$chunk_count sha256=$payload_sha"
          chunk_index=0
          for part in "$chunk_dir"/source.tar.gz.part-*; do
            chunk_index=$((chunk_index + 1))
            suffix="${part##*-}"
            uploaded=false
            for attempt in 1 2 3; do
              echo "SSH_CHUNK_UPLOAD chunk=${chunk_index}/${chunk_count} attempt=${attempt}"
              if timeout 120 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" "cat > '$release_dir/source.tar.gz.part-$suffix'" < "$part"; then
                uploaded=true
                break
              fi
              sleep 2
            done
            test "$uploaded" = true
          done

          echo 'REMOTE_REASSEMBLE_START'
          timeout 90 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" \
            "cd '$release_dir' && cat source.tar.gz.part-* > source.tar.gz && test \"\$(sha256sum source.tar.gz | awk '{print \$1}')\" = '$payload_sha' && rm -f source.tar.gz.part-*"
          echo 'REMOTE_REASSEMBLE_DONE'

          echo 'REMOTE_STAGE_START'
          timeout 600 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$release_dir" "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          release_dir="$1"
          sha="$2"
          cd "$release_dir"
          tar -xzf source.tar.gz
          test "$(tr -d '\r\n' < RELEASE-SHA)" = "$sha"
          bash deploy/v88-direct/stage-node-host.sh "$release_dir" "$sha"
          REMOTE
          echo 'REMOTE_STAGE_DONE'

          timeout 20 ssh "${ssh_opts[@]}" -O exit "$ECS_USER@$ECS_HOST" >/dev/null 2>&1 || true

      - name: Confirm existing public route remains healthy
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --max-time 10 "http://${ECS_HOST}:3000/api/build-info" >/dev/null
          echo 'PUBLIC_ROUTE_STILL_HEALTHY=true'
