name: V78 Script Video Local Executor Regression

on:
  push:
    branches:
      - feat/v78-go-integrated-novel-fetch-doubao
    paths:
      - 'routes/script-video.js'
      - 'frontend/src/user/pages/ScriptPage.jsx'
      - 'frontend/src/user/pages/scriptDraftStorage.js'
      - 'test/script-video-local-executor-bridge.test.js'
      - '.github/workflows/v78-script-video-local-executor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run local executor bridge regression test
        run: node --test test/script-video-local-executor-bridge.test.js
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
