name: TMP 121 Browser Timeout Verify

on:
  push:
    branches:
      - fix/v88-121-browser-login-timeout-20260906
    paths:
      - '.github/workflows/tmp-121-browser-timeout-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser client and 121 web service
        run: node --test tests/121-browser-client.test.js tests/novel-fetch-121-web-service.test.js
      - name: Install 121 Browser Worker dependencies
        run: npm --prefix services/121-browser-worker install --ignore-scripts --no-audit --no-fund
      - name: Run 121 Browser Worker tests
        run: npm --prefix services/121-browser-worker test
