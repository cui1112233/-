name: Cancel stale V88 public inspection

on:
  push:
    branches:
      - ops/cancel-stale-v88-release-20260906
    paths:
      - '.github/workflows/cancel-stale-v88-release.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel-stale-inspection:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel stale broad public inspection
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STALE_RUN_ID: '34034209577'
        run: |
          set -Eeuo pipefail
          status="$(curl -sS -o /tmp/cancel-body -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/actions/runs/${STALE_RUN_ID}/cancel")"
          cat /tmp/cancel-body || true
          case "$status" in
            202|409) ;;
            *) echo "Unexpected cancel status: $status" >&2; exit 1 ;;
          esac

      - name: Confirm stale inspection stopped
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STALE_RUN_ID: '34034209577'
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 30); do
            payload="$(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPO}/actions/runs/${STALE_RUN_ID}")"
            status="$(printf '%s' "$payload" | jq -r '.status')"
            conclusion="$(printf '%s' "$payload" | jq -r '.conclusion // ""')"
            echo "run status=${status} conclusion=${conclusion}"
            if [ "$status" = completed ]; then
              exit 0
            fi
            sleep 2
          done
          echo 'stale inspection did not stop' >&2
          exit 1
