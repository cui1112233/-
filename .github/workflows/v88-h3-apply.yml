name: V88 H3 Apply Minimal Patch

on:
  push:
    branches:
      - feat/v88-h3-unified-video-20260909
    paths:
      - scripts/apply-v88-h3-minimal.py
      - .github/workflows/v88-h3-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v88-h3-unified-video-20260909
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply bounded H3 patch
        run: python scripts/apply-v88-h3-minimal.py
      - name: Format Go files
        run: |
          gofmt -w \
            backend/internal/batchfactoryv11/video_provider.go \
            backend/internal/batchfactoryv11/video_model_catalog.go \
            backend/internal/batchfactoryv11/h3_workflow.go \
            backend/internal/batchfactoryv11/production.go \
            backend/internal/batchfactoryv11/production_adapter.go \
            backend/internal/httpapi/router.go \
            backend/internal/httpapi/batch_factory_v11_production.go \
            backend/internal/httpapi/batch_factory_v11_video_models.go
      - name: Guard scope and whitespace
        run: |
          git diff --check
          if git diff --name-only | grep -E '(^|/)(novel-fetch|121-|v78|deploy/)' ; then
            echo 'H3 patch touched forbidden Novel Fetch/V78/deploy scope' >&2
            exit 1
          fi
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit' >&2
            exit 1
          fi
          git config user.name 'cui1112233'
          git config user.email '732223510@qq.com'
          git add \
            backend/internal/batchfactoryv11/video_provider.go \
            backend/internal/batchfactoryv11/video_model_catalog.go \
            backend/internal/batchfactoryv11/h3_workflow.go \
            backend/internal/batchfactoryv11/production.go \
            backend/internal/batchfactoryv11/production_adapter.go \
            backend/internal/httpapi/router.go \
            backend/internal/httpapi/batch_factory_v11_production.go \
            backend/internal/httpapi/batch_factory_v11_video_models.go \
            routes/batch-factory-v11.js \
            routes/script-video.js \
            frontend/src/shared/api/batchFactoryV11.js \
            frontend/src/shared/api/scriptVideo.js \
            frontend/src/user/pages/batch-factory-v11/bf11UiAdapter.js \
            frontend/src/user/pages/batch-factory-v11/BatchFactoryV11SettingsDrawers.jsx \
            frontend/src/user/pages/batch-factory-v11/BatchFactoryV11UiPage.jsx \
            frontend/src/user/pages/ScriptPage.jsx
          git commit -m 'feat(v88): integrate MiniMax H3 unified video model'
          git push origin HEAD:feat/v88-h3-unified-video-20260909
