name: V88 ECS Image Pull Diagnostic

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable 40-character V88 release SHA to inspect locally on ECS
        required: true
        type: string

permissions:
  contents: read

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root

jobs:
  inspect:
    if: github.ref == 'refs/heads/v88'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate immutable release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          requested_sha='${{ inputs.release_sha }}'
          if [[ ! "$requested_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'release_sha must be a lowercase 40-character Git SHA' >&2
            exit 1
          fi
          printf 'RELEASE_SHA=%s\n' "$requested_sha" >> "$GITHUB_ENV"

      - name: Inspect ECS image pull readiness without changing ECS
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/v88_ecs" "$HOME/.ssh/known_hosts"' EXIT
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          printf '%s\n' '115.190.156.223 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFdxABss1Y5GY5LXYWo48tsRIjPEeBMfKS74DDMNWFZz' > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk 'NR == 1 { print $2 }')" = 'SHA256:euxaJwTUQEE1WrK+WDS1AH37foGIv7JXo6vU9iKBrCI'
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          timeout 240 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$RELEASE_SHA" <<'REMOTE'
          set -uo pipefail
          release_sha="$1"
          image="ghcr.io/cui1112233/qiantie-go-api:${release_sha}"

          report() {
            printf 'ECS_PULL_DIAGNOSTIC %s=%s\n' "$1" "$2"
          }

          report 'release_sha' "$release_sha"

          if timeout 15 df -h / /var/lib/docker; then
            report 'filesystem_capacity' 'ok'
          else
            report 'filesystem_capacity' "failed:$?"
          fi

          if timeout 15 df -ih / /var/lib/docker; then
            report 'filesystem_inodes' 'ok'
          else
            report 'filesystem_inodes' "failed:$?"
          fi

          if timeout 20 docker info --format 'storage_driver={{.Driver}} docker_root={{.DockerRootDir}}'; then
            report 'docker_info' 'ok'
          else
            report 'docker_info' "failed:$?"
          fi

          if timeout 20 docker system df --format '{{.Type}} size={{.Size}} reclaimable={{.Reclaimable}}'; then
            report 'docker_storage' 'ok'
          else
            report 'docker_storage' "failed:$?"
          fi

          if timeout 20 docker container ls -a --format 'ECS_PULL_DIAGNOSTIC container={{.ID}} status={{.Status}} image={{.Image}} names={{.Names}}'; then
            report 'docker_containers' 'ok'
          else
            report 'docker_containers' "failed:$?"
          fi

          if timeout 20 docker image ls --digests --format 'ECS_PULL_DIAGNOSTIC image={{.ID}} repository={{.Repository}} tag={{.Tag}} digest={{.Digest}} size={{.Size}}'; then
            report 'docker_images' 'ok'
          else
            report 'docker_images' "failed:$?"
          fi

          if timeout 20 docker image ls -f dangling=true --format 'ECS_PULL_DIAGNOSTIC dangling_image={{.ID}} size={{.Size}}'; then
            report 'docker_dangling_images' 'ok'
          else
            report 'docker_dangling_images' "failed:$?"
          fi

          ps -eo pid=,stat=,etime=,comm= | awk '$4 ~ /^(dockerd|containerd|docker)$/ { print "ECS_PULL_DIAGNOSTIC process=" $1 ":" $2 ":" $3 ":" $4 }'
          ps -eo pid=,ppid=,stat=,etime=,args= | awk '$0 ~ /docker pull/ { print "ECS_PULL_DIAGNOSTIC pull_process=" $0 }'

          if timeout 10 getent hosts ghcr.io; then
            report 'ghcr_dns' 'ok'
          else
            report 'ghcr_dns' "failed:$?"
          fi

          set +e
          registry_status="$(timeout 15 curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 15 https://ghcr.io/v2/)"
          registry_rc=$?
          set -e
          report 'ghcr_https' "curl_exit=${registry_rc} http=${registry_status:-none}"

          if timeout 15 docker image inspect "$image" >/dev/null 2>&1; then
            report 'requested_go_image' 'present'
          else
            report 'requested_go_image' "absent_or_daemon_unavailable:$?"
          fi

          report 'scope' 'read_only_no_pull_no_restart_no_cleanup'
          echo 'ECS_PULL_DIAGNOSTIC_OK'
          REMOTE
