name: V88 ECS Unused Image Cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PRUNE_UNUSED_IMAGES to remove only Docker images unused by all containers
        required: true
        type: string

permissions:
  contents: read

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root

jobs:
  cleanup:
    if: github.ref == 'refs/heads/v88'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require explicit unused-image cleanup confirmation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRM" = 'PRUNE_UNUSED_IMAGES'

      - name: Reclaim unused ECS images only
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/v88_ecs" "$HOME/.ssh/known_hosts"' EXIT
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          printf '%s\n' '115.190.156.223 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFdxABss1Y5GY5LXYWo48tsRIjPEeBMfKS74DDMNWFZz' > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk 'NR == 1 { print $2 }')" = 'SHA256:euxaJwTUQEE1WrK+WDS1AH37foGIv7JXo6vU9iKBrCI'
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          timeout 240 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s <<'REMOTE'
          set -uo pipefail
          summary() {
            printf 'ECS_UNUSED_IMAGE_CLEANUP %s\n' "$1"
            timeout 15 df -h / /var/lib/docker || true
            timeout 20 docker system df --format '{{.Type}} size={{.Size}} reclaimable={{.Reclaimable}}' || true
          }

          summary 'before'
          if timeout 120 docker image prune -a --force; then
            cleanup_status='ok'
          else
            cleanup_status="failed:$?"
          fi
          summary 'after'
          printf 'ECS_UNUSED_IMAGE_CLEANUP result=%s\n' "$cleanup_status"
          test "$cleanup_status" = 'ok'
          REMOTE
