name: V88 Direct Deploy Integration CI

on:
  push:
    branches:
      - feat/v88-direct-deploy-integration-20260907
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v88-direct-deploy-integration-ci
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: RED/GREEN direct deploy contracts
        run: node --test tests/v88-node-release-package.test.js tests/v88-build-info-release.test.js
