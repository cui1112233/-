name: V88 Local Executor Windows 1.0.3

on:
  push:
    branches:
      - v88
      - fix/v88-doubao-video-tab
      - feat/v88-local-executor-auto-update
      - integrate/v88-local-executor-auto-update
    paths:
      - 'local-executor/**'
      - 'branding/**'
      - '.github/workflows/v88-local-executor-windows.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel for the publication bundle
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

env:
  EXECUTOR_VERSION: 1.0.3

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: local-executor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Verify package version
        shell: pwsh
        run: |
          $actual = node -p "require('./package.json').version"
          if ($actual -ne $env:EXECUTOR_VERSION) { throw "package version $actual does not match $env:EXECUTOR_VERSION" }

      - name: Run executor tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build updater publication bundle
        shell: pwsh
        run: |
          $channel = "${{ github.event.inputs.channel }}"
          if ([string]::IsNullOrWhiteSpace($channel)) { $channel = "beta" }
          if ($channel -notin @("beta", "stable")) { throw "unsupported update channel: $channel" }

          $canonicalName = "yizhan-local-executor-v88-$env:EXECUTOR_VERSION-win-x64.exe"
          $target = Join-Path "dist" $canonicalName
          if (-not (Test-Path $target)) {
            $installer = Get-ChildItem -Path dist -Filter "*.exe" |
              Sort-Object Length -Descending |
              Select-Object -First 1
            if (-not $installer) { throw "Windows installer not found" }
            Copy-Item $installer.FullName $target -Force
          }

          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $target).Length
          "$hash  $canonicalName" | Set-Content -NoNewline "dist/$canonicalName.sha256"

          $feedDir = "dist/update-feed/$channel"
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
          Copy-Item $target (Join-Path $feedDir $canonicalName) -Force
          $manifest = [ordered]@{
            schemaVersion = 1
            channel = $channel
            version = $env:EXECUTOR_VERSION
            platform = "win32"
            arch = "x64"
            file = $canonicalName
            sha256 = $hash
            size = $size
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $feedDir "manifest.json")
          Write-Host "Channel: $channel"
          Write-Host "SHA256: $hash"
          Write-Host "Size: $size"

      - name: Upload Windows updater bundle
        uses: actions/upload-artifact@v4
        with:
          name: yizhan-local-executor-v88-1.0.3-win-x64-update-bundle
          path: |
            local-executor/dist/yizhan-local-executor-v88-1.0.3-win-x64.exe
            local-executor/dist/yizhan-local-executor-v88-1.0.3-win-x64.exe.sha256
            local-executor/dist/update-feed/**
          if-no-files-found: error
          retention-days: 21
          compression-level: 0

  publish-ecs:
    name: Publish Windows installer to V88 ECS
    needs: build-windows
    runs-on: ubuntu-24.04
    steps:
      - name: Download Windows updater bundle
        uses: actions/download-artifact@v4
        with:
          name: yizhan-local-executor-v88-1.0.3-win-x64-update-bundle
          path: release

      - name: Resolve publication channel
        shell: bash
        run: |
          set -Eeuo pipefail
          channel='${{ github.event.inputs.channel }}'
          if [ -z "$channel" ]; then channel=beta; fi
          case "$channel" in beta|stable) ;; *) echo "unsupported update channel: $channel" >&2; exit 1 ;; esac
          echo "UPDATE_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Prepare V88 ECS SSH
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$V88_ECS_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          : > "$HOME/.ssh/known_hosts"
          timeout 20 ssh-keyscan -H 115.190.156.223 >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Publish Windows installer to V88 ECS
        shell: bash
        run: |
          set -Eeuo pipefail
          installer="yizhan-local-executor-v88-${EXECUTOR_VERSION}-win-x64.exe"
          checksum="${installer}.sha256"
          install_root="/opt/qiantie/v88/data/downloads"
          update_root="${install_root}/local-executor-updates/${UPDATE_CHANNEL}"
          test -s "release/$installer"
          test -s "release/$checksum"
          test -s "release/update-feed/${UPDATE_CHANNEL}/manifest.json"
          test -s "release/update-feed/${UPDATE_CHANNEL}/$installer"

          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 root@115.190.156.223)
          scp_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20)

          ssh "${ssh_opts[@]}" "mkdir -p '$install_root' '$update_root'"
          scp "${scp_opts[@]}" "release/$installer" "release/$checksum" "root@115.190.156.223:$install_root/"
          scp "${scp_opts[@]}" "release/update-feed/${UPDATE_CHANNEL}/manifest.json" "release/update-feed/${UPDATE_CHANNEL}/$installer" "root@115.190.156.223:$update_root/"

          ssh "${ssh_opts[@]}" "cd '$install_root' && sha256sum -c '$checksum' && test -s '$update_root/manifest.json' && test -s '$update_root/$installer'"
          echo "Published $installer to V88 ECS downloads and $UPDATE_CHANNEL updater feed."
