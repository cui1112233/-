name: V88 Local Executor Windows

on:
  push:
    branches:
      - v88
      - 'fix/v88-doubao-executor-*'
      - fix/v88-doubao-video-tab
      - feat/v88-local-executor-auto-update
      - integrate/v88-local-executor-auto-update
    paths:
      - 'local-executor/**'
      - 'branding/**'
      - '.github/workflows/v88-local-executor-windows.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel for the publication bundle
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

env:
  MAX_INSTALLER_MIB: 90

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: local-executor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Read package metadata
        id: metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "package version is not strict semver: $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Executor version: $version"

      - name: Run executor tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build updater publication bundle
        shell: pwsh
        run: |
          $version = "${{ steps.metadata.outputs.version }}"
          $channel = "${{ github.event.inputs.channel }}"
          if ([string]::IsNullOrWhiteSpace($channel)) { $channel = "beta" }
          if ($channel -notin @("beta", "stable")) { throw "unsupported update channel: $channel" }

          $canonicalName = "yizhan-local-executor-v88-$version-win-x64.exe"
          $target = Join-Path "dist" $canonicalName
          $installer = Get-ChildItem -Path dist -Filter "*.exe" |
            Where-Object { $_.FullName -ne (Join-Path (Get-Location) $target) } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          Copy-Item $installer.FullName $target -Force

          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $target).Length
          $sizeMiB = [math]::Round($size / 1MB, 2)
          $maxSizeMiB = [double]$env:MAX_INSTALLER_MIB
          if ($size -gt ($maxSizeMiB * 1MB)) {
            throw "installer is too large: $sizeMiB MiB exceeds Phase 1 ceiling $maxSizeMiB MiB"
          }
          "$hash  $canonicalName" | Set-Content -NoNewline "dist/$canonicalName.sha256"

          $feedDir = "dist/update-feed/$channel"
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
          Copy-Item $target (Join-Path $feedDir $canonicalName) -Force
          $publishedAt = (Get-Date).ToUniversalTime().ToString("o")
          $manifest = [ordered]@{
            schemaVersion = 1
            channel = $channel
            version = $version
            platform = "win32"
            arch = "x64"
            file = $canonicalName
            sha256 = $hash
            size = $size
            publishedAt = $publishedAt
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $feedDir "manifest.json")

          $report = [ordered]@{
            version = $version
            channel = $channel
            platform = "win32"
            arch = "x64"
            file = $canonicalName
            sizeBytes = $size
            sizeMiB = $sizeMiB
            maxInstallerMiB = $maxSizeMiB
            sha256 = $hash
            builtAt = $publishedAt
            commit = "${{ github.sha }}"
          }
          $report | ConvertTo-Json | Set-Content -Encoding utf8 "dist/build-report.json"

          Write-Host "Channel: $channel"
          Write-Host "Version: $version"
          Write-Host "SHA256: $hash"
          Write-Host "Size: $size bytes ($sizeMiB MiB), ceiling: $maxSizeMiB MiB"

      - name: Verify Windows installer overwrite and protocol
        shell: pwsh
        run: |
          $version = "${{ steps.metadata.outputs.version }}"
          $installer = Join-Path "dist" "yizhan-local-executor-v88-$version-win-x64.exe"
          ./scripts/verify-windows-installer.ps1 -InstallerPath $installer

      - name: Upload Windows updater bundle
        uses: actions/upload-artifact@v4
        with:
          name: yizhan-local-executor-v88-${{ steps.metadata.outputs.version }}-win-x64-update-bundle
          path: |
            local-executor/dist/yizhan-local-executor-v88-${{ steps.metadata.outputs.version }}-win-x64.exe
            local-executor/dist/yizhan-local-executor-v88-${{ steps.metadata.outputs.version }}-win-x64.exe.sha256
            local-executor/dist/build-report.json
            local-executor/dist/update-feed/**
          if-no-files-found: error
