name: 01 Aurum Member Hub Check

on:
  push:
    branches:
      - 01-aurum-member-hub
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  member-tests:
    name: Member system tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Role, team and usage tests
        run: node --test tests/member-center.test.js tests/member-usage-runtime.test.js tests/dev-permissions.test.js

  regression-tests:
    name: Existing Node regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run pre-existing test suite
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for file in tests/*.test.js; do
            case "$file" in
              tests/member-center.test.js|tests/member-usage-runtime.test.js|tests/dev-permissions.test.js) ;;
              *) files+=("$file") ;;
            esac
          done
          node --test "${files[@]}"

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
