name: 01 Aurum Member Hub Check

on:
  push:
    branches:
      - 01-aurum-member-hub
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  member-tests:
    name: Member system tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node --test tests/member-center.test.js tests/member-usage-runtime.test.js tests/dev-permissions.test.js

  regression:
    name: Regression · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-admin
            files: >-
              tests/account-store.test.js tests/error-logging.test.js tests/governance-routes.test.js
              tests/model-connection-routes.test.js tests/persistent-session.test.js tests/preset-store.test.js
              tests/system-preset-catalog.test.js tests/upstream-proxy.test.js
          - name: novel-panel
            files: >-
              tests/novel-panel-asset-contract.test.js tests/novel-panel-primary-button-style.test.js
              tests/novel-panel-project-store.test.js tests/novel-panel-quality-gate.test.js
              tests/novel-panel-runtime.test.js tests/novel-panel-stability.test.js
              tests/novel-panel-theme-contract.test.js
          - name: script
            files: >-
              tests/chat-route-output.test.js tests/script-constraint-prompt-store.test.js
              tests/script-constraint-prompts-routes.test.js tests/script-constraints.test.js
              tests/script-draft-persistence-contract.test.js tests/script-empty-state-card-contract.test.js
              tests/script-entity-enrichment.test.js tests/script-entity-management.test.js
              tests/script-entity-ui-contract.test.js tests/script-extraction-preset-ui-contract.test.js
              tests/script-extraction-presets.test.js tests/script-protagonist-generation-contract.test.js
              tests/script-shot-output-ui-contract.test.js tests/script-shot-output.test.js
              tests/script-shot-prompt-contract.test.js tests/shotlist-required-header.test.js
          - name: shuihuo
            files: >-
              tests/platform-projects-contract.test.js tests/shuihuo-comic-production-contract.test.js
              tests/shuihuo-gateway.test.js tests/shuihuo-model-catalog-contract.test.js
              tests/shuihuo-production-ui-contract.test.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node --test ${{ matrix.files }}

  pinpoint:
    name: Contract · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: agent-route-contract, file: tests/agent-route-contract.test.js }
          - { name: agent-routes, file: tests/agent-routes.test.js }
          - { name: agent-skill-routes, file: tests/agent-skill-routes.test.js }
          - { name: agent-skill-store, file: tests/agent-skill-store.test.js }
          - { name: agent-skill-ui, file: tests/agent-skill-ui-contract.test.js }
          - { name: agent-store, file: tests/agent-store.test.js }
          - { name: cm-agent-ui, file: tests/cm-agent-ui-contract.test.js }
          - { name: account-image-settings-ui, file: tests/account-image-settings-ui-contract.test.js }
          - { name: cm-pet-ui, file: tests/cm-pet-companion-ui-contract.test.js }
          - { name: home-gradient, file: tests/home-gradient-button-style.test.js }
          - { name: home-splash, file: tests/home-splash-cursor.test.js }
          - { name: theme-readability, file: tests/theme-readability-contract.test.js }
          - { name: tts-preferences, file: tests/tts-preferences-contract.test.js }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node --test ${{ matrix.file }}

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
