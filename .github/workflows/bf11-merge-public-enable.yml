name: BF11 Merge Public Enable

on:
  push:
    branches: [v88]
    paths:
      - 'deploy/v88-public/MERGE-ENABLE-REQUEST'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bf11-merge-public-enable
  cancel-in-progress: false

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root
  V88_ROOT: /opt/qiantie/v88

jobs:
  enable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare ECS SSH
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          timeout 15 ssh-keyscan -H "$ECS_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Guard staged worker and production config
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15)
          timeout 60 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$V88_ROOT" <<'REMOTE'
          set -Eeuo pipefail
          root="$1"
          dir="$root/deploy/v88-public"
          envf="$dir/merge.env"
          test -s "$dir/docker-compose.yml"
          test -s "$dir/docker-compose.merge.yml" || { echo 'STATUS=BLOCKED merge stage overlay missing'; exit 42; }
          test -s "$envf" || { echo 'STATUS=BLOCKED merge.env missing'; exit 42; }
          for key in QIANTIE_MERGE_WORKER_SECRET QIANTIE_MERGE_REDIS_URL QIANTIE_MERGE_TOS_ENDPOINT QIANTIE_MERGE_TOS_REGION QIANTIE_MERGE_TOS_BUCKET QIANTIE_MERGE_TOS_ACCESS_KEY QIANTIE_MERGE_TOS_SECRET_KEY QIANTIE_MERGE_TOS_PUBLIC_BASE_URL; do
            value="$(sed -n "s/^${key}=//p" "$envf" | tail -n1 | tr -d '\r')"
            test -n "$value" || { echo "STATUS=BLOCKED missing key:$key"; exit 42; }
          done
          redis_health="$(docker inspect -f '{{.State.Health.Status}}' v88-public-merge-redis-1 2>/dev/null || true)"
          worker_running="$(docker inspect -f '{{.State.Running}}' v88-public-merge-worker-1 2>/dev/null || true)"
          [ "$redis_health" = healthy ] || { echo 'STATUS=BLOCKED merge-redis not healthy'; exit 42; }
          [ "$worker_running" = true ] || { echo 'STATUS=BLOCKED merge-worker not running'; exit 42; }
          echo 'STATUS=READY staged merge infrastructure healthy'
          REMOTE

      - name: Build current linux amd64 Go API image
        shell: bash
        run: |
          set -Eeuo pipefail
          short="${GITHUB_SHA:0:12}"
          image="qiantie-go-api:public-v88-merge-${short}-amd64"
          docker build --platform linux/amd64 -f backend/Dockerfile -t "$image" backend
          docker save "$image" | gzip -1 > /tmp/go-api-merge-image.tar.gz
          printf '%s' "$image" > /tmp/go-api-merge-image.txt

      - name: Activate Slice 5 with automatic rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15)
          scp_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15)
          timeout 240 scp "${scp_opts[@]}" /tmp/go-api-merge-image.tar.gz "$ECS_USER@$ECS_HOST:/tmp/v88-go-api-merge-image.tar.gz"
          timeout 60 scp "${scp_opts[@]}" deploy/v88-public/docker-compose.merge-enable.yml "$ECS_USER@$ECS_HOST:/tmp/docker-compose.merge-enable.yml"
          image="$(cat /tmp/go-api-merge-image.txt)"
          timeout 240 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$V88_ROOT" "$image" <<'REMOTE'
          set -Eeuo pipefail
          root="$1"
          image="$2"
          dir="$root/deploy/v88-public"
          envf="$dir/merge.env"
          install -m 0644 /tmp/docker-compose.merge-enable.yml "$dir/docker-compose.merge-enable.yml"
          gzip -dc /tmp/v88-go-api-merge-image.tar.gz | docker load >/dev/null
          merge_secret="$(sed -n 's/^QIANTIE_MERGE_WORKER_SECRET=//p' "$envf" | tail -n1 | tr -d '\r')"
          test -n "$merge_secret"
          export QIANTIE_MERGE_WORKER_SECRET="$merge_secret"
          export QIANTIE_GO_API_IMAGE="$image"
          cd "$dir"

          rollback() {
            echo 'STATUS=ROLLBACK restoring base Go API / Slice configuration'
            unset QIANTIE_GO_API_IMAGE QIANTIE_MERGE_WORKER_SECRET
            docker compose -f docker-compose.yml -f docker-compose.merge.yml up -d --no-deps --force-recreate go-api || true
          }
          trap rollback ERR

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.merge.yml \
            -f docker-compose.merge-enable.yml \
            config >/tmp/v88-merge-enabled.config.yml
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.merge.yml \
            -f docker-compose.merge-enable.yml \
            up -d --no-deps --force-recreate go-api

          for i in $(seq 1 40); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' v88-public-go-api-1 2>/dev/null || true)"
            [ "$health" = healthy ] && break
            [ "$health" = exited ] && { echo 'go-api exited during activation'; false; }
            [ "$i" -eq 40 ] && { echo "go-api health timeout: $health"; false; }
            sleep 2
          done

          trap - ERR
          echo "STATUS=ENABLED go-api-image=$image slice=5 merge_enabled=true"
          rm -f /tmp/v88-go-api-merge-image.tar.gz /tmp/docker-compose.merge-enable.yml
          REMOTE
