name: V78 Go Integrated Novel Fetch + Doubao

on:
  push:
    branches:
      - feat/v78-go-integrated-novel-fetch-doubao
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum
      - name: Gofmt check
        run: |
          bad=$(gofmt -l internal/app/app.go internal/httpapi/router.go internal/httpapi/integrated_router_test.go internal/httpapi/novel_fetch_workshop.go internal/httpapi/novel_fetch_workshop_test.go internal/novelfetchworkshop internal/storage/novel_fetch_workshop_schema.go internal/storage/novel_fetch_workshop_schema_test.go)
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Integrated backend tests
        run: go test ./internal/config ./internal/httpapi ./internal/localartifact ./internal/localexecutor ./internal/novelfetchworkshop ./internal/storage
      - name: Build production Go service
        run: go build ./cmd/qiantie
      - name: Create offline bundle
        working-directory: .
        run: |
          git bundle create v78-go-integrated-20260902.bundle HEAD
          git bundle verify v78-go-integrated-20260902.bundle
      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: v78-go-integrated-20260902-bundle
          path: v78-go-integrated-20260902.bundle
          if-no-files-found: error
