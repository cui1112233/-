name: V88 API Config Recovery Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare ECS SSH
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          ssh-keyscan -H 115.190.156.223 > "$HOME/.ssh/known_hosts"

      - name: Inspect persisted API configuration metadata only
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" root@115.190.156.223 bash -s <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/qiantie/v88/deploy/v88-public
          node_id="$(docker compose -f docker-compose.yml ps -q v88-node)"
          test -n "$node_id"
          docker exec "$node_id" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = '/app/data/users';
          let files = [];
          try { files = fs.readdirSync(root, { withFileTypes: true })
            .filter(entry => entry.isDirectory())
            .map(entry => path.join(root, entry.name, 'api-config.json'))
            .filter(fs.existsSync); } catch (_) {}
          const summary = files.map(file => {
            try {
              const value = JSON.parse(fs.readFileSync(file, 'utf8'));
              const catalog = Array.isArray(value.modelCatalog) ? value.modelCatalog : [];
              return {
                hasApiKey: Boolean(String(value.apiKey || '').trim()),
                hasImageKey: Boolean(String(value.image?.apiKey || '').trim()),
                hasVideoKey: Boolean(String(value.video?.apiKey || '').trim()),
                modelCount: catalog.length,
                enabledModelCount: catalog.filter(model => model && model.enabled !== false).length
              };
            } catch (_) { return { unreadable: true }; }
          });
          console.log(JSON.stringify({ configFileCount: files.length, records: summary }, null, 2));
          NODE
          REMOTE
