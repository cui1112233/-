name: V78 Linux AMD64 Image Release

on:
  push:
    branches:
      - ops/v78-public-115.190.156.223-amd64-release
      - ops/v78-public-deploy-v2
  workflow_dispatch:

permissions:
  contents: read

env:
  V78_SHA: cb9decd1054ca6c9e6931f6fb24627d6ae6f280c
  GO_SHA: 13e40da4092046846ad13c5c0bbb15918216465a
  IMAGE_PLATFORM: linux/amd64
  COMPOSE_PROJECT_NAME: qiantie-v78-amd64-${{ github.run_id }}

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Assert Linux AMD64 runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.OSType}}')" = linux
          test "$(docker info --format '{{.Architecture}}')" = x86_64

      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          path: deploy-src
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout locked V78 source
        uses: actions/checkout@v4
        with:
          ref: cb9decd1054ca6c9e6931f6fb24627d6ae6f280c
          path: v78
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout locked Go bridge source
        uses: actions/checkout@v4
        with:
          ref: 13e40da4092046846ad13c5c0bbb15918216465a
          path: go
          fetch-depth: 1
          persist-credentials: false

      - name: Validate locked sources and clean trees
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C deploy-src rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C v78 rev-parse HEAD)" = "$V78_SHA"
          test "$(git -C go rev-parse HEAD)" = "$GO_SHA"
          test -z "$(git -C deploy-src status --porcelain=v1)"
          test -z "$(git -C v78 status --porcelain=v1)"
          test -z "$(git -C go status --porcelain=v1)"
          test -f deploy-src/deploy/v78-public/docker-compose.yml
          test -f v78/Dockerfile
          test -f go/backend/Dockerfile

      - name: Run Deploy V2 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash deploy-src/deploy/v78-public/tests/deploy-v2-contract.sh
          bash -n deploy-src/deploy/v78-public/offline-deploy.sh
          bash -n deploy-src/deploy/v78-public/release-snapshot.sh
          bash -n deploy-src/deploy/v78-public/rollback.sh
          bash -n deploy-src/deploy/v78-public/backup.sh
          bash -n deploy-src/deploy/v78-public/verify.sh
          bash -n deploy-src/deploy/v78-public/deploy.sh

      - name: Sync reviewed deployment files into locked V78 tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf v78/deploy/v78-public
          mkdir -p v78/deploy
          cp -a deploy-src/deploy/v78-public v78/deploy/v78-public

      - name: Prepare ephemeral smoke environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cd v78/deploy/v78-public
          umask 077
          cp .env.example .env
          sed -i 's/^PUBLIC_PORT=3000$/PUBLIC_PORT=18080/' .env
          sed -i "s|QIANTIE_GO_SOURCE_DIR=/opt/qiantie/go|QIANTIE_GO_SOURCE_DIR=${GITHUB_WORKSPACE}/go|" .env
          sed -i "s|CHANGE_ME_MYSQL_PASSWORD|$(openssl rand -hex 32)|" .env
          sed -i "s|CHANGE_ME_MYSQL_ROOT_PASSWORD|$(openssl rand -hex 32)|" .env
          sed -i "s|CHANGE_ME_LONG_RANDOM_BRIDGE_SECRET|$(openssl rand -hex 32)|" .env
          sed -i "s|CHANGE_ME_LONG_RANDOM_WORKER_SECRET|$(openssl rand -hex 32)|" .env
          sed -i "s|CHANGE_ME_LONG_RANDOM_CREDENTIAL_SECRET|$(openssl rand -hex 32)|" .env
          ! grep -q 'CHANGE_ME_' .env
          grep -Fxq 'PUBLIC_PORT=18080' .env
          ! git -C ../.. ls-files --error-unmatch deploy/v78-public/.env >/dev/null 2>&1

      - name: Validate Compose model
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose --env-file v78/deploy/v78-public/.env \
            -f v78/deploy/v78-public/docker-compose.yml \
            --project-name "$COMPOSE_PROJECT_NAME" config -q
          rendered="$(docker compose --env-file v78/deploy/v78-public/.env -f v78/deploy/v78-public/docker-compose.yml --project-name "$COMPOSE_PROJECT_NAME" config)"
          printf '%s\n' "$rendered" | grep -q 'published: "18080"'
          ! printf '%s\n' "$rendered" | grep -Eq 'published: "(3000|3306|4000|8787)"'

      - name: Prepare pinned AMD64 base images
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull --platform "$IMAGE_PLATFORM" mysql:8.4
          docker pull --platform "$IMAGE_PLATFORM" nginx:1.27-alpine
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' mysql:8.4)" = "$IMAGE_PLATFORM"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' nginx:1.27-alpine)" = "$IMAGE_PLATFORM"

      - name: Build locked application images for AMD64
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose --env-file v78/deploy/v78-public/.env \
            -f v78/deploy/v78-public/docker-compose.yml \
            --project-name "$COMPOSE_PROJECT_NAME" \
            build --pull go-api browser-worker v78-node

      - name: Validate all runtime image architectures
        shell: bash
        run: |
          set -Eeuo pipefail
          images=(
            mysql:8.4
            nginx:1.27-alpine
            qiantie-v78-node:public-v78
            qiantie-go-api:public-v78
            qiantie-121-browser-worker:public-v78
          )
          for image in "${images[@]}"; do
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "$IMAGE_PLATFORM"
          done

      - name: Start candidate without registry pulls
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose --env-file v78/deploy/v78-public/.env \
            -f v78/deploy/v78-public/docker-compose.yml \
            --project-name "$COMPOSE_PROJECT_NAME" \
            up --no-build --pull never -d mysql go-api browser-worker v78-node

      - name: Run internal candidate smoke checks
        shell: bash
        run: |
          set -Eeuo pipefail
          compose=(docker compose --env-file v78/deploy/v78-public/.env -f v78/deploy/v78-public/docker-compose.yml --project-name "$COMPOSE_PROJECT_NAME")

          wait_healthy() {
            local service="$1"
            for attempt in $(seq 1 60); do
              cid="$("${compose[@]}" ps -q "$service")"
              if [[ -n "$cid" ]] && [[ "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")" = healthy ]]; then
                return 0
              fi
              sleep 2
            done
            echo "Candidate did not become healthy: $service" >&2
            return 1
          }

          wait_healthy mysql
          wait_healthy browser-worker
          wait_healthy v78-node

          "${compose[@]}" exec -T v78-node node -e "fetch('http://127.0.0.1:3000/api/build-info').then(async r=>{if(!r.ok)throw new Error('node '+r.status);const b=await r.json();if(!b.app_version)throw new Error('missing app_version');console.log('V78 Node OK',JSON.stringify(b))}).catch(e=>{console.error(e);process.exit(1)})"
          "${compose[@]}" exec -T v78-node node -e "fetch('http://go-api:4000/health').then(async r=>{if(!r.ok)throw new Error('go '+r.status);console.log('Go API OK',await r.text())}).catch(e=>{console.error(e);process.exit(1)})"
          "${compose[@]}" exec -T v78-node node -e "fetch('http://browser-worker:8787/healthz',{headers:{'x-qiantie-internal-secret':process.env.QIANTIE_121_WORKER_SECRET}}).then(async r=>{if(!r.ok)throw new Error('worker '+r.status);console.log('121 Worker OK',await r.text())}).catch(e=>{console.error(e);process.exit(1)})"

      - name: Smoke test Nginx public entry
        shell: bash
        run: |
          set -Eeuo pipefail
          compose=(docker compose --env-file v78/deploy/v78-public/.env -f v78/deploy/v78-public/docker-compose.yml --project-name "$COMPOSE_PROJECT_NAME")
          "${compose[@]}" up --no-build --pull never -d nginx
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 http://127.0.0.1:18080/api/build-info; then
              break
            fi
            if [[ "$attempt" = 30 ]]; then
              echo "Nginx public entry did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          (
            cd v78/deploy/v78-public
            bash ./verify.sh
          )

      - name: Save formal AMD64 deployment images
        shell: bash
        run: |
          set -Eeuo pipefail
          release_dir="$GITHUB_WORKSPACE/release"
          mkdir -p "$release_dir"
          docker save mysql:8.4 nginx:1.27-alpine | gzip -1 > "$release_dir/qiantie-v78-linux-amd64-base.tar.gz"
          docker save qiantie-v78-node:public-v78 | gzip -1 > "$release_dir/qiantie-v78-linux-amd64-node.tar.gz"
          docker save qiantie-go-api:public-v78 | gzip -1 > "$release_dir/qiantie-v78-linux-amd64-go.tar.gz"
          docker save qiantie-121-browser-worker:public-v78 | gzip -1 > "$release_dir/qiantie-v78-linux-amd64-browser-worker.tar.gz"
          (
            cd "$release_dir"
            sha256sum *.tar.gz > SHA256SUMS
          )

      - name: Package exact deployment files
        shell: bash
        run: |
          set -Eeuo pipefail
          release_dir="$GITHUB_WORKSPACE/release"
          package_dir="$release_dir/deployment"
          mkdir -p "$package_dir/tests"

          cp deploy-src/deploy/v78-public/.env.example "$package_dir/.env.example"
          cp deploy-src/deploy/v78-public/CODEX_RUNBOOK.md "$package_dir/CODEX_RUNBOOK.md"
          cp deploy-src/deploy/v78-public/backup.sh "$package_dir/backup.sh"
          cp deploy-src/deploy/v78-public/deploy.sh "$package_dir/deploy.sh"
          cp deploy-src/deploy/v78-public/docker-compose.yml "$package_dir/docker-compose.yml"
          cp deploy-src/deploy/v78-public/nginx.conf "$package_dir/nginx.conf"
          cp deploy-src/deploy/v78-public/offline-deploy.sh "$package_dir/offline-deploy.sh"
          cp deploy-src/deploy/v78-public/release-snapshot.sh "$package_dir/release-snapshot.sh"
          cp deploy-src/deploy/v78-public/rollback.sh "$package_dir/rollback.sh"
          cp deploy-src/deploy/v78-public/verify.sh "$package_dir/verify.sh"
          cp deploy-src/deploy/v78-public/tests/deploy-v2-contract.sh "$package_dir/tests/deploy-v2-contract.sh"

          chmod 755 "$package_dir"/*.sh "$package_dir/tests/deploy-v2-contract.sh"

          {
            echo "architecture=linux/amd64"
            echo "V78_SHA=$V78_SHA"
            echo "Go_SHA=$GO_SHA"
            echo "DEPLOY_SHA=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "smoke=passed"
            docker image inspect --format='image=mysql:8.4 architecture={{.Os}}/{{.Architecture}}' mysql:8.4
            docker image inspect --format='image=nginx:1.27-alpine architecture={{.Os}}/{{.Architecture}}' nginx:1.27-alpine
            docker image inspect --format='image=qiantie-v78-node:public-v78 architecture={{.Os}}/{{.Architecture}}' qiantie-v78-node:public-v78
            docker image inspect --format='image=qiantie-go-api:public-v78 architecture={{.Os}}/{{.Architecture}}' qiantie-go-api:public-v78
            docker image inspect --format='image=qiantie-121-browser-worker:public-v78 architecture={{.Os}}/{{.Architecture}}' qiantie-121-browser-worker:public-v78
          } > "$release_dir/RELEASE-METADATA.txt"

          (
            cd "$package_dir"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$release_dir/DEPLOYMENT-SHA256SUMS"

      - name: Verify release artifact secret exclusion
        shell: bash
        run: |
          set -Eeuo pipefail
          release_dir="$GITHUB_WORKSPACE/release"
          ! find "$release_dir" -type f -name '.env' -print -quit | grep -q .
          ! grep -R -E --exclude='.env.example' 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' "$release_dir/deployment"
          ! grep -R -E --exclude='.env.example' '(ghp_|github_pat_)' "$release_dir/deployment"
          for archive in "$release_dir"/*.tar.gz; do
            archive_listing="$(tar -tzf "$archive")"
            if printf '%s\n' "$archive_listing" | grep -Eq '(^|/)\.env($|/)'; then
              echo "Refusing to package an archive containing .env: $archive" >&2
              exit 1
            fi
          done
          grep -Fxq 'architecture=linux/amd64' "$release_dir/RELEASE-METADATA.txt"
          grep -Fxq "V78_SHA=$V78_SHA" "$release_dir/RELEASE-METADATA.txt"
          grep -Fxq "Go_SHA=$GO_SHA" "$release_dir/RELEASE-METADATA.txt"
          grep -Fxq "DEPLOY_SHA=$GITHUB_SHA" "$release_dir/RELEASE-METADATA.txt"
          grep -Fxq "workflow_run_id=$GITHUB_RUN_ID" "$release_dir/RELEASE-METADATA.txt"
          grep -Fxq 'smoke=passed' "$release_dir/RELEASE-METADATA.txt"
          cat "$release_dir/RELEASE-METADATA.txt"
          cat "$release_dir/SHA256SUMS"
          cat "$release_dir/DEPLOYMENT-SHA256SUMS"
          du -h "$release_dir"/*

      - name: Upload AMD64 deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qiantie-v78-deploy-v2-linux-amd64-${{ github.run_id }}
          path: |
            release/*.tar.gz
            release/SHA256SUMS
            release/DEPLOYMENT-SHA256SUMS
            release/RELEASE-METADATA.txt
            release/deployment/**
            release/deployment/.env.example
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Show candidate diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [[ -f v78/deploy/v78-public/.env ]]; then
            docker compose --env-file v78/deploy/v78-public/.env \
              -f v78/deploy/v78-public/docker-compose.yml \
              --project-name "$COMPOSE_PROJECT_NAME" ps -a
            docker compose --env-file v78/deploy/v78-public/.env \
              -f v78/deploy/v78-public/docker-compose.yml \
              --project-name "$COMPOSE_PROJECT_NAME" logs --tail=200
          fi

      - name: Cleanup ephemeral candidate
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f v78/deploy/v78-public/.env ]]; then
            docker compose --env-file v78/deploy/v78-public/.env \
              -f v78/deploy/v78-public/docker-compose.yml \
              --project-name "$COMPOSE_PROJECT_NAME" down --remove-orphans
          fi
