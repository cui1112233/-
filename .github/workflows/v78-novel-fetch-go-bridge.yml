name: V78 Novel Fetch Go Bridge

on:
  push:
    branches:
      - feat/v78-novel-fetch-go-bridge
      - feat/v78-novel-fetch-local-first-s1-go
      - feat/v78-novel-fetch-local-first-s2-go
  workflow_dispatch:

jobs:
  go-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum
      - name: Gofmt check
        run: |
          bad=$(gofmt -l internal/novelfetchworkshop internal/localexecutor internal/localartifact internal/httpapi/novel_fetch_workshop.go internal/httpapi/novel_fetch_workshop_test.go internal/httpapi/local_executor.go internal/httpapi/local_executor_jobs.go internal/httpapi/local_executor_artifacts.go internal/httpapi/s2_local_executor_integration_test.go internal/storage/novel_fetch_workshop_schema.go internal/storage/novel_fetch_workshop_schema_test.go internal/storage/local_executor_schema.go internal/storage/local_executor_schema_test.go internal/app/app.go internal/config/config.go)
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Focused tests
        run: go test ./internal/novelfetchworkshop ./internal/localexecutor ./internal/localartifact ./internal/httpapi ./internal/storage ./internal/app ./internal/config
      - name: Build Go service
        run: go build ./cmd/qiantie
