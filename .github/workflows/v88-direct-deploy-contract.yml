name: V88 Direct Deploy Contract

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v88
  push:
    branches:
      - v88

permissions:
  contents: read

concurrency:
  group: v88-direct-deploy-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify V88 Git-direct release contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test \
            tests/v88-node-release-package.test.js \
            tests/v88-build-info-release.test.js \
            tests/v88-node-stage-contract.test.js \
            tests/v88-direct-public-cutover.test.js \
            tests/v88-release-preserves-base-env.test.js \
            tests/v88-release-registry-resilience.test.js \
            tests/novel-panel-v783031-ecs-deploy.test.js \
            tests/v88-public-browser-worker-deploy.test.js \
            tests/novel-fetch-version-config-mainline.test.js \
            tests/novel-fetch-rewrite-sparse-mainline.test.js
