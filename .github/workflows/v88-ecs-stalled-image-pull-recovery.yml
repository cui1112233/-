name: V88 ECS Stalled Image Pull Recovery

on:
  workflow_dispatch:
    inputs:
      stale_release_sha:
        description: Exact 40-character release SHA whose stuck Node or Go image pull may be stopped
        required: true
        type: string
      confirm:
        description: Type STOP_STALLED_PULL_ONLY to terminate only matching docker pull client processes
        required: true
        type: string

permissions:
  contents: read

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root

jobs:
  recover:
    if: github.ref == 'refs/heads/v88'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exact stalled-pull recovery confirmation
        shell: bash
        run: |
          set -Eeuo pipefail
          stale_release_sha='${{ inputs.stale_release_sha }}'
          test '${{ inputs.confirm }}' = 'STOP_STALLED_PULL_ONLY'
          [[ "$stale_release_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'STALE_RELEASE_SHA=%s\n' "$stale_release_sha" >> "$GITHUB_ENV"

      - name: Stop only matching stalled Docker pull clients on ECS
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/v88_ecs" "$HOME/.ssh/known_hosts"' EXIT
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          printf '%s\n' '115.190.156.223 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFdxABss1Y5GY5LXYWo48tsRIjPEeBMfKS74DDMNWFZz' > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk 'NR == 1 { print $2 }')" = 'SHA256:euxaJwTUQEE1WrK+WDS1AH37foGIv7JXo6vU9iKBrCI'
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          timeout 120 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$STALE_RELEASE_SHA" <<'REMOTE'
          set -Eeuo pipefail
          stale_release_sha="$1"
          go_image="ghcr.io/cui1112233/qiantie-go-api:${stale_release_sha}"
          node_image="ghcr.io/cui1112233/qiantie-v88-node:${stale_release_sha}"
          matches=()

          for pid in $(pgrep -x docker || true); do
            command="$(tr '\0' ' ' < "/proc/${pid}/cmdline" 2>/dev/null || true)"
            if [[ "$command" == "docker pull ${go_image}"* || "$command" == "docker pull ${node_image}"* ]]; then
              printf 'ECS_STALLED_PULL_RECOVERY matched_pid=%s command=%s\n' "$pid" "$command"
              matches+=("$pid")
            fi
          done

          if [ "${#matches[@]}" -eq 0 ]; then
            echo 'ECS_STALLED_PULL_RECOVERY no_matching_pull=true'
            echo 'ECS_STALLED_PULL_RECOVERY_OK'
            exit 0
          fi

          kill -TERM "${matches[@]}"
          for attempt in 1 2 3 4 5; do
            remaining=()
            for pid in "${matches[@]}"; do
              if kill -0 "$pid" 2>/dev/null; then
                remaining+=("$pid")
              fi
            done
            [ "${#remaining[@]}" -eq 0 ] && break
            sleep 1
          done

          if [ "${#remaining[@]}" -gt 0 ]; then
            kill -KILL "${remaining[@]}"
          fi

          for pid in "${matches[@]}"; do
            if kill -0 "$pid" 2>/dev/null; then
              echo "ECS_STALLED_PULL_RECOVERY still_running_pid=${pid}" >&2
              exit 1
            fi
          done

          echo 'ECS_STALLED_PULL_RECOVERY_OK'
          REMOTE
