name: V88 Exact Release Image Patch Once

on:
  push:
    branches:
      - v88
    paths:
      - '.github/workflows/v88-exact-release-image-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout v88
        uses: actions/checkout@v4
        with:
          ref: v88
          fetch-depth: 1

      - name: Patch exact release image deployment
        run: python scripts/patch-v88-release-exact-images-v2.py

      - name: Verify focused release regression
        run: node --test tests/v88-release-registry-resilience.test.js

      - name: Commit durable release fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v88-linux-amd64-image-release.yml
          if git diff --cached --quiet; then
            echo 'No release patch required.'
            exit 0
          fi
          git commit -m 'fix(v88): deploy exact public release images'
          git push origin HEAD:v88

