name: V88 ECS Direct Deploy

on:
  push:
    branches:
      - v88
    paths:
      - 'app.js'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/**'
      - 'pets/**'
      - 'public/**'
      - 'routes/**'
      - 'lib/**'
      - 'middleware/**'
      - 'prompts/**'
      - 'backend/**'
      - 'services/121-browser-worker/**'
      - 'deploy/v88-direct/**'
      - '.github/workflows/v88-ecs-direct-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root
  RELEASE_ROOT: /opt/qiantie/releases/v88

concurrency:
  group: v88-public-direct-deploy
  cancel-in-progress: true

jobs:
  direct-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact V88 SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Assert exact source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify direct deploy contract
        run: node --test tests/v88-direct-deploy-contract.test.js

      - name: Prepare source release archive
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='services/121-browser-worker/node_modules' \
            --exclude='data' \
            --exclude='outputs' \
            -czf "release/v88-${GITHUB_SHA}.tar.gz" .
          test -s "release/v88-${GITHUB_SHA}.tar.gz"

      - name: Prepare ECS SSH
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          ssh-keyscan -H "$ECS_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact SHA to ECS
        shell: bash
        run: |
          set -Eeuo pipefail
          release_dir="${RELEASE_ROOT}/${GITHUB_SHA}"
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20)
          ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" "mkdir -p '$release_dir'"
          scp "${ssh_opts[@]}" "release/v88-${GITHUB_SHA}.tar.gz" "$ECS_USER@$ECS_HOST:$release_dir/source.tar.gz"
          ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$release_dir" "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          release_dir="$1"
          sha="$2"
          cd "$release_dir"
          tar -xzf source.tar.gz
          bash deploy/v88-direct/deploy.sh "$release_dir" "$sha"
          REMOTE
