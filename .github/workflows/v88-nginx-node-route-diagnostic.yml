name: V88 Nginx Node Route Diagnostic
# run: public-node-route-20260909-a

on:
  push:
    branches:
      - v88
    paths:
      - '.github/workflows/v88-nginx-node-route-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root
  NETWORK: v88-public_qiantie_internal

jobs:
  inspect-node-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare ECS SSH
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          timeout 15 ssh-keyscan -H "$ECS_HOST" > "$HOME/.ssh/known_hosts"

      - name: Inspect current Node route without secrets or mutations
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15)
          timeout 90 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$NETWORK" "$ECS_HOST" <<'REMOTE'
          set -Eeuo pipefail
          NETWORK="$1"
          ECS_PUBLIC_HOST="$2"

          node_id="$(docker ps --filter 'name=v88-public-v88-node' --format '{{.ID}}' | head -n1)"
          nginx_id="$(docker ps --filter 'name=v88-public-nginx' --format '{{.ID}}' | head -n1)"
          test -n "$node_id"
          test -n "$nginx_id"

          node_name="$(docker inspect -f '{{.Name}}' "$node_id" | sed 's#^/##')"
          node_ip="$(docker inspect -f "{{with index .NetworkSettings.Networks \"$NETWORK\"}}{{.IPAddress}}{{end}}" "$node_id")"
          gateway="$(docker network inspect "$NETWORK" --format '{{(index .IPAM.Config 0).Gateway}}')"
          nginx_name="$(docker inspect -f '{{.Name}}' "$nginx_id" | sed 's#^/##')"
          echo "node_name=$node_name"
          echo "node_ip=$node_ip"
          echo "network_gateway=$gateway"
          echo "nginx_name=$nginx_name"
          docker inspect -f 'nginx_image={{.Config.Image}} nginx_ports={{json .NetworkSettings.Ports}}' "$nginx_id"
          docker network inspect "$NETWORK" --format '{{range $id, $c := .Containers}}network_container={{$c.Name}} network_ipv4={{$c.IPv4Address}}{{println}}{{end}}'
          for container_id in $(docker ps -aq --filter "network=$NETWORK"); do
            docker inspect -f "{{.Name}} image={{.Config.Image}} status={{.State.Status}} aliases={{with index .NetworkSettings.Networks \"$NETWORK\"}}{{json .Aliases}}{{end}} ip={{with index .NetworkSettings.Networks \"$NETWORK\"}}{{.IPAddress}}{{end}}" "$container_id"
          done
          docker inspect -f "{{with index .NetworkSettings.Networks \"$NETWORK\"}}{{range .Aliases}}{{println .}}{{end}}{{end}}" "$node_id" \
            | sed '/^$/d;s/^/node_alias=/'

          config_source="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d/default.conf"}}{{.Source}}{{end}}{{end}}' "$nginx_id")"
          test -n "$config_source"
          test -f "$config_source"
          echo "nginx_config_source=$config_source"
          grep -E '^[[:space:]]*(upstream|proxy_pass)' "$config_source" | sed 's/^/nginx_route=/'
          for backup in /opt/qiantie/v88/deploy/v88-public/nginx.conf.pre-unified-*; do
            [ -f "$backup" ] || continue
            echo "nginx_backup=$(basename "$backup")"
            grep -E '^[[:space:]]*(upstream|proxy_pass)' "$backup" | sed 's/^/nginx_backup_route=/' || true
          done
          for backup in /opt/qiantie/v88/deploy/v88-public/.env.pre-unified-*; do
            [ -f "$backup" ] || continue
            echo "env_backup=$(basename "$backup")"
            grep -E '^QIANTIE_(NODE_IMAGE|GO_IMAGE|RELEASE_SHA)=' "$backup" | sed 's/^/env_backup_release=/' || true
          done
          docker exec "$nginx_id" getent hosts v88-node | sed 's/^/nginx_dns_v88_node=/' || true
          grep -E '^QIANTIE_(NODE_IMAGE|GO_IMAGE|RELEASE_SHA)=' /opt/qiantie/v88/deploy/v88-public/.env | sed 's/^/compose_release=/' || true

          ss -ltnp '( sport = :3000 )' 2>/dev/null | sed 's/^/host_listen_3000=/' || true

          docker exec "$node_id" node -e 'fetch("http://127.0.0.1:3000/api/build-info",{signal:AbortSignal.timeout(3000)}).then(r=>r.text()).then(t=>console.log("node_container_build="+t)).catch(e=>console.log("node_container_build_error="+e.message))'
          docker exec "$node_id" node -e 'fetch("http://v88-node:3000/api/build-info",{signal:AbortSignal.timeout(3000)}).then(r=>r.text()).then(t=>console.log("node_service_build="+t)).catch(e=>console.log("node_service_build_error="+e.message))'
          docker exec "$nginx_id" sh -c 'nginx -T 2>&1 | grep -E "^[[:space:]]*(listen|server_name|proxy_pass|upstream|resolver)" | sed "s/^/nginx_runtime_route=/"'
          docker exec "$nginx_id" sh -c 'wget -qO- -T 3 http://v88-node:3000/api/build-info' | sed 's/^/nginx_direct_node_build=/' || true
          docker exec "$node_id" node -e 'fetch("http://nginx:80/api/build-info",{signal:AbortSignal.timeout(3000)}).then(r=>r.text()).then(t=>console.log("nginx_service_build="+t)).catch(e=>console.log("nginx_service_build_error="+e.message))'

          python3 - "$config_source" <<'PY'
          import re, sys
          text = open(sys.argv[1], 'r', encoding='utf-8', errors='replace').read()
          endpoints = sorted(set(re.findall(r'(?<![A-Za-z0-9._-])([A-Za-z0-9._-]+:3000)\b', text)))
          for endpoint in endpoints:
              print(f'nginx_3000_endpoint={endpoint}')
          print(f'nginx_3000_endpoint_count={len(endpoints)}')
          PY

          curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:3000/api/build-info \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("public_git_sha="+str(d.get("git_sha") or "")); print("public_deploy_mode="+str(d.get("deploy_mode") or ""))'
          curl -fsS --connect-timeout 2 --max-time 5 "http://${ECS_PUBLIC_HOST}:3000/api/build-info" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ecs_public_ip_git_sha="+str(d.get("git_sha") or "")); print("ecs_public_ip_deploy_mode="+str(d.get("deploy_mode") or ""))' \
            || echo 'ecs_public_ip_build_probe=unavailable'
          REMOTE
