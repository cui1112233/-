name: V88 Nginx Node Route Diagnostic

on:
  push:
    branches:
      - v88
    paths:
      - '.github/workflows/v88-nginx-node-route-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root
  NETWORK: v88-public_qiantie_internal

jobs:
  inspect-node-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare ECS SSH
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          timeout 15 ssh-keyscan -H "$ECS_HOST" > "$HOME/.ssh/known_hosts"

      - name: Inspect current Node route without secrets or mutations
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15)
          timeout 90 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$NETWORK" <<'REMOTE'
          set -Eeuo pipefail
          NETWORK="$1"

          node_id="$(docker ps --filter 'name=v88-public-v88-node' --format '{{.ID}}' | head -n1)"
          nginx_id="$(docker ps --filter 'name=v88-public-nginx' --format '{{.ID}}' | head -n1)"
          test -n "$node_id"
          test -n "$nginx_id"

          node_name="$(docker inspect -f '{{.Name}}' "$node_id" | sed 's#^/##')"
          node_ip="$(docker inspect -f "{{with index .NetworkSettings.Networks \"$NETWORK\"}}{{.IPAddress}}{{end}}" "$node_id")"
          gateway="$(docker network inspect "$NETWORK" --format '{{(index .IPAM.Config 0).Gateway}}')"
          echo "node_name=$node_name"
          echo "node_ip=$node_ip"
          echo "network_gateway=$gateway"
          docker inspect -f "{{with index .NetworkSettings.Networks \"$NETWORK\"}}{{range .Aliases}}{{println .}}{{end}}{{end}}" "$node_id" \
            | sed '/^$/d;s/^/node_alias=/'

          config_source="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d/default.conf"}}{{.Source}}{{end}}{{end}}' "$nginx_id")"
          test -n "$config_source"
          test -f "$config_source"

          python3 - "$config_source" <<'PY'
          import re, sys
          text = open(sys.argv[1], 'r', encoding='utf-8', errors='replace').read()
          endpoints = sorted(set(re.findall(r'(?<![A-Za-z0-9._-])([A-Za-z0-9._-]+:3000)\b', text)))
          for endpoint in endpoints:
              print(f'nginx_3000_endpoint={endpoint}')
          print(f'nginx_3000_endpoint_count={len(endpoints)}')
          PY

          curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:3000/api/build-info \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("public_git_sha="+str(d.get("git_sha") or "")); print("public_deploy_mode="+str(d.get("deploy_mode") or ""))'
          REMOTE
