name: V88 Linux AMD64 Public Image Release

on:
  push:
    branches:
      - v88
      - ops/v88-public-amd64-release-20260903
    paths:
      - 'Dockerfile'
      - 'app.js'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/**'
      - 'pets/**'
      - 'public/**'
      - 'routes/**'
      - 'lib/**'
      - 'middleware/**'
      - 'prompts/**'
      - 'services/121-browser-worker/**'
      - 'deploy/v88-public/docker-compose.browser-worker.yml'
      - 'scripts/verify-v88-cm-release.js'
      - '.github/workflows/v88-linux-amd64-image-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  packages: write

env:
  IMAGE_PLATFORM: linux/amd64
  ECS_HOST: 115.190.156.223
  ECS_USER: root

concurrency:
  group: v88-public-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout V88 release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Assert Linux AMD64 runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.OSType}}')" = linux
          docker_arch="$(docker info --format '{{.Architecture}}')"
          case "$docker_arch" in
            amd64|x86_64) ;;
            *) echo "Unexpected Docker architecture: $docker_arch" >&2; exit 1 ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run build

      - name: Verify V88 pet release contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/verify-v88-cm-release.js

      - name: Build V88 AMD64 Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          short_sha="${GITHUB_SHA::12}"
          image="qiantie-v88:public-${short_sha}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ghcr_image="ghcr.io/${owner}/qiantie-v88:public-${short_sha}"
          docker build --platform "$IMAGE_PLATFORM" -t "$image" .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "$IMAGE_PLATFORM"
          docker run --rm --entrypoint sh "$image" -c '
            test -s /app/frontend/dist/index.html &&
            test -s /app/frontend/dist/batch-rewrite/interaction-feedback.js &&
            test -s /app/frontend/dist/batch-rewrite/task-visibility-hotfix.js &&
            grep -q "interaction-feedback.js" /app/frontend/dist/batch-rewrite/index.html &&
            grep -q "task-visibility-hotfix.js" /app/frontend/dist/batch-rewrite/index.html &&
            test -s /app/pets/stacky/spritesheet.webp &&
            test -s /app/pets/pixiu/spritesheet.webp &&
            grep -R -q ".cm-penguin-shell" /app/frontend/dist/assets/*.css
          '
          docker tag "$image" "$ghcr_image"
          echo "IMAGE_NAME=$image" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=$ghcr_image" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"

      - name: Build Novel Fetch 121 Browser Worker AMD64 image
        shell: bash
        run: |
          set -Eeuo pipefail
          worker_image="qiantie-v88-121-browser-worker:public-${SHORT_SHA}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          worker_ghcr_image="ghcr.io/${owner}/qiantie-v88-121-browser-worker:public-${SHORT_SHA}"
          docker build --platform "$IMAGE_PLATFORM" -t "$worker_image" ./services/121-browser-worker
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$worker_image")" = "$IMAGE_PLATFORM"
          docker tag "$worker_image" "$worker_ghcr_image"
          echo "WORKER_IMAGE_NAME=$worker_image" >> "$GITHUB_ENV"
          echo "WORKER_GHCR_IMAGE=$worker_ghcr_image" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push V88 AMD64 image to GHCR
        shell: bash
        run: |
          set -Eeuo pipefail
          docker push "$GHCR_IMAGE"
          docker push "$WORKER_GHCR_IMAGE"
          docker image inspect "$GHCR_IMAGE" >/dev/null
          docker image inspect "$WORKER_GHCR_IMAGE" >/dev/null
          echo "Published durable image: $GHCR_IMAGE"
          echo "Published durable Browser Worker image: $WORKER_GHCR_IMAGE"

      - name: Save release package
        shell: bash
        run: |
          set -Eeuo pipefail
          release_dir="$GITHUB_WORKSPACE/release"
          mkdir -p "$release_dir"
          archive="qiantie-v88-linux-amd64-${SHORT_SHA}.tar.gz"
          docker save "$IMAGE_NAME" | gzip -1 > "$release_dir/$archive"
          cp deploy/v88-public/docker-compose.browser-worker.yml "$release_dir/docker-compose.browser-worker.yml"
          (
            cd "$release_dir"
            sha256sum "$archive" > SHA256SUMS
          )
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "architecture=${IMAGE_PLATFORM}"
            echo "image=${IMAGE_NAME}"
            echo "registry_image=${GHCR_IMAGE}"
            echo "browser_worker_image=${WORKER_IMAGE_NAME}"
            echo "browser_worker_registry_image=${WORKER_GHCR_IMAGE}"
            echo "browser_worker_distribution=ghcr-pull"
            echo "cm_release_guard=passed"
          } > "$release_dir/RELEASE-METADATA.txt"
          cat > "$release_dir/ECS-STORAGE.txt" <<EOF
          Recommended ECS release directory:
          /opt/qiantie/releases/v88/${SHORT_SHA}/

          Primary V88 distribution:
          ${GHCR_IMAGE}

          Novel Fetch 121 Browser Worker distribution:
          Built from this commit, pushed to GHCR, and pulled by ECS during guarded deployment.

          Main image tar fallback (uploaded only when ECS GHCR pull fails):
          cd /opt/qiantie/releases/v88/${SHORT_SHA}
          sha256sum -c SHA256SUMS
          docker load -i ${archive}
          docker image inspect ${IMAGE_NAME} --format '{{.Id}} {{.Os}}/{{.Architecture}}'
          EOF
          cat "$release_dir/RELEASE-METADATA.txt"
          cat "$release_dir/SHA256SUMS"
          du -h "$release_dir"/*

      - name: Prepare V88 ECS SSH
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          if [ -z "${V88_ECS_SSH_PRIVATE_KEY:-}" ]; then
            echo "ECS_DEPLOY_READY=false" >> "$GITHUB_ENV"
            echo "::notice::V88_ECS_SSH_PRIVATE_KEY is not configured; ECS deployment will be skipped."
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          : > "$HOME/.ssh/known_hosts"
          timeout 15 ssh-keyscan -H "$ECS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15 "$ECS_USER@$ECS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          compose_file="/opt/qiantie/v88/deploy/v88-public/docker-compose.yml"
          test -f "$compose_file"
          test "$(id -u)" = 0
          command -v docker >/dev/null 2>&1
          docker version >/dev/null 2>&1
          docker compose version >/dev/null 2>&1
          docker compose -f "$compose_file" config >/dev/null
          docker compose -f "$compose_file" config --services
          docker compose -f "$compose_file" ps --all
          REMOTE
          echo "ECS_COMPOSE_DIR=/opt/qiantie/v88/deploy/v88-public" >> "$GITHUB_ENV"
          echo "ECS_COMPOSE_FILE=/opt/qiantie/v88/deploy/v88-public/docker-compose.yml" >> "$GITHUB_ENV"
          echo "ECS_DEPLOY_READY=true" >> "$GITHUB_ENV"
          echo "V88 ECS SSH preflight passed."

      - name: Deploy verified images to V88 ECS
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ "$ECS_DEPLOY_READY" != "true" ]; then
            echo "::notice::ECS deployment skipped because V88_ECS_SSH_PRIVATE_KEY is unavailable."
            exit 0
          fi

          ssh_cmd=(ssh -i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$ECS_USER@$ECS_HOST")
          scp_cmd=(scp -i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          remote_compose_dir="$ECS_COMPOSE_DIR"
          remote_release_dir="/opt/qiantie/releases/v88/${SHORT_SHA}"
          main_image_tar="$GITHUB_WORKSPACE/release/qiantie-v88-linux-amd64-${SHORT_SHA}.tar.gz"
          main_image_sha="$GITHUB_WORKSPACE/release/SHA256SUMS"
          remote_main_image_tar="${remote_release_dir}/qiantie-v88-linux-amd64-${SHORT_SHA}.tar.gz"
          remote_main_image_sha="${remote_release_dir}/SHA256SUMS"
          test -s "$main_image_tar"
          test -s "$main_image_sha"

          timeout 120 "${ssh_cmd[@]}" "mkdir -p '${remote_release_dir}'"
          timeout 120 "${scp_cmd[@]}" deploy/v88-public/docker-compose.browser-worker.yml "$ECS_USER@$ECS_HOST:${remote_compose_dir}/docker-compose.browser-worker.yml"
          printf '%s' "$GHCR_TOKEN" | timeout 120 ssh -i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$ECS_USER@$ECS_HOST" "docker login ghcr.io --username '${GITHUB_REPOSITORY_OWNER,,}' --password-stdin"

          # Pull first. The 68MB tar fallback is transferred only when the main
          # registry image cannot be pulled after bounded attempts.
          set +e
          timeout 600 "${ssh_cmd[@]}" bash -s -- "$GHCR_IMAGE" <<'REMOTE'
          set -Eeuo pipefail
          ghcr_image="$1"
          pull_with_retry() {
            image="$1"
            max_attempts="${2:-4}"
            attempt=1
            delay=5
            while [ "$attempt" -le "$max_attempts" ]; do
              if timeout 120 docker pull "$image"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "Registry pull failed for ${image} (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              if [ "$delay" -lt 30 ]; then
                delay=$((delay * 2))
                if [ "$delay" -gt 30 ]; then delay=30; fi
              fi
            done
            return 1
          }
          pull_with_retry "$ghcr_image" 4
          REMOTE
          main_pull_status=$?
          set -e

          if [ "$main_pull_status" -ne 0 ]; then
            echo "Main GHCR pull failed after bounded retries; uploading verified release tar fallback." >&2
            timeout 1500 "${scp_cmd[@]}" "$main_image_tar" "$main_image_sha" "$ECS_USER@$ECS_HOST:${remote_release_dir}/"
            timeout 300 "${ssh_cmd[@]}" bash -s -- "$GHCR_IMAGE" "$SHORT_SHA" "$remote_main_image_tar" "$remote_main_image_sha" <<'REMOTE'
            set -Eeuo pipefail
            ghcr_image="$1"
            short_sha="$2"
            main_image_tar="$3"
            main_image_sha="$4"
            test -s "$main_image_tar"
            test -s "$main_image_sha"
            release_dir="$(dirname "$main_image_tar")"
            (
              cd "$release_dir"
              sha256sum -c "$(basename "$main_image_sha")"
            )
            docker load -i "$main_image_tar"
            fallback_image="qiantie-v88:public-${short_sha}"
            docker image inspect "$fallback_image" --format '{{.Os}}/{{.Architecture}}' | grep -qx 'linux/amd64'
            docker tag "$fallback_image" "$ghcr_image"
            REMOTE
          fi

          timeout 900 "${ssh_cmd[@]}" bash -s -- "$WORKER_GHCR_IMAGE" <<'REMOTE'
          set -Eeuo pipefail
          worker_ghcr_image="$1"
          pull_with_retry() {
            image="$1"
            max_attempts="${2:-6}"
            attempt=1
            delay=5
            while [ "$attempt" -le "$max_attempts" ]; do
              if timeout 120 docker pull "$image"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "Registry pull failed for ${image} (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              if [ "$delay" -lt 30 ]; then
                delay=$((delay * 2))
                if [ "$delay" -gt 30 ]; then delay=30; fi
              fi
            done
            return 1
          }
          pull_with_retry "$worker_ghcr_image" 6
          REMOTE

          timeout 300 "${ssh_cmd[@]}" bash -s -- "$GHCR_IMAGE" "$WORKER_GHCR_IMAGE" "$SHORT_SHA" "$ECS_COMPOSE_FILE" <<'REMOTE'
          set -Eeuo pipefail
          ghcr_image="$1"
          worker_ghcr_image="$2"
          short_sha="$3"
          compose_file="$4"
          compose_dir="$(dirname "$compose_file")"
          test -f "$compose_file"
          cd "$compose_dir"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          random_hex() {
            od -An -N32 -tx1 /dev/urandom | tr -d ' \n'
          }
          ensure_secret() {
            key="$1"
            if ! grep -q "^${key}=" novel-fetch-121.env 2>/dev/null; then
              printf '%s=%s\n' "$key" "$(random_hex)" >> novel-fetch-121.env
            fi
          }

          touch novel-fetch-121.env
          chmod 600 novel-fetch-121.env
          ensure_secret QIANTIE_121_WORKER_SECRET
          ensure_secret QIANTIE_121_CREDENTIAL_SECRET
          ensure_secret QIANTIE_121_STORAGE_STATE_SECRET

          compose=(docker compose -f "$compose_file" -f "$compose_dir/docker-compose.browser-worker.yml")
          "${compose[@]}" config >/dev/null

          container_id="$(${compose[@]} ps -q v88-node)"
          test -n "$container_id"
          service_image="$(docker inspect "$container_id" --format '{{.Config.Image}}')"
          test -n "$service_image"
          docker image inspect "$service_image" >/dev/null
          rollback_image="v88-public-v88-node:rollback-${short_sha}-$(date +%Y%m%d%H%M%S)"
          docker tag "$service_image" "$rollback_image"
          printf '%s\n' "$rollback_image" > /tmp/v88-last-rollback-image
          printf '%s\n' "$service_image" > /tmp/v88-last-service-image

          worker_service_image='v88-public-novel-fetch-121-worker:v88-latest'
          worker_container_id="$(${compose[@]} ps -q novel-fetch-121-worker || true)"
          : > /tmp/v88-last-rollback-worker-image
          printf '%s\n' "$worker_service_image" > /tmp/v88-last-worker-service-image
          if [ -n "$worker_container_id" ]; then
            previous_worker_image="$(docker inspect "$worker_container_id" --format '{{.Config.Image}}')"
            test -n "$previous_worker_image"
            docker image inspect "$previous_worker_image" >/dev/null
            rollback_worker_image="v88-public-novel-fetch-121-worker:rollback-${short_sha}-$(date +%Y%m%d%H%M%S)"
            docker tag "$previous_worker_image" "$rollback_worker_image"
            printf '%s\n' "$rollback_worker_image" > /tmp/v88-last-rollback-worker-image
          fi

          docker image inspect "$ghcr_image" --format '{{.Os}}/{{.Architecture}}' | grep -qx 'linux/amd64'
          docker image inspect "$worker_ghcr_image" --format '{{.Os}}/{{.Architecture}}' | grep -qx 'linux/amd64'
          docker tag "$ghcr_image" "$service_image"
          docker tag "$worker_ghcr_image" "$worker_service_image"
          "${compose[@]}" up -d --no-deps --force-recreate --pull never novel-fetch-121-worker
          "${compose[@]}" up -d --no-deps --force-recreate --pull never v88-node
          "${compose[@]}" ps novel-fetch-121-worker v88-node
          REMOTE

      - name: Verify V88 ECS deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$ECS_DEPLOY_READY" != "true" ]; then
            echo "::notice::ECS verification skipped because deployment was not attempted."
            exit 0
          fi
          ssh_cmd=(ssh -i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 "$ECS_USER@$ECS_HOST")
          "${ssh_cmd[@]}" bash -s -- "$ECS_COMPOSE_FILE" <<'REMOTE'
          set -Eeuo pipefail
          compose_file="$1"
          compose_dir="$(dirname "$compose_file")"
          cd "$compose_dir"
          compose=(docker compose -f "$compose_file" -f "$compose_dir/docker-compose.browser-worker.yml")
          "${compose[@]}" ps novel-fetch-121-worker v88-node

          worker_id="$(${compose[@]} ps -q novel-fetch-121-worker)"
          test -n "$worker_id"
          for attempt in $(seq 1 30); do
            worker_health="$(docker inspect -f '{{.State.Health.Status}}' "$worker_id" 2>/dev/null || true)"
            if [ "$worker_health" = healthy ]; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "Novel Fetch 121 Browser Worker did not become healthy" >&2
              exit 1
            fi
            sleep 2
          done

          "${compose[@]}" exec -T v88-node node - <<'NODE'
          (async () => {
            const required = ['QIANTIE_121_BROWSER_WORKER_URL', 'QIANTIE_121_WORKER_SECRET', 'QIANTIE_121_CREDENTIAL_SECRET'];
            for (const key of required) {
              if (!String(process.env[key] || '').trim()) throw new Error(`${key} missing inside v88-node`);
            }
            const response = await fetch(`${process.env.QIANTIE_121_BROWSER_WORKER_URL}/healthz`, {
              headers: { 'x-qiantie-internal-secret': process.env.QIANTIE_121_WORKER_SECRET }
            });
            if (!response.ok) throw new Error(`121 Browser Worker health request failed: ${response.status}`);
            const body = await response.json();
            if (body.ok !== true) throw new Error('121 Browser Worker health response is not ok');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          for attempt in $(seq 1 30); do
            body="$(curl -fsS http://127.0.0.1:3000/api/novel-panel/build-info || true)"
            if printf '%s' "$body" | grep -q '\"app_version\":\"v78.3.0.31\"' && printf '%s' "$body" | grep -q '\"release_version\":\"v78.3.0.31\"'; then
              feedback_html="$(curl -fsS http://127.0.0.1:3000/batch-rewrite/ || true)"
              feedback_js="$(curl -fsS http://127.0.0.1:3000/batch-rewrite/interaction-feedback.js || true)"
              task_visibility_js="$(curl -fsS http://127.0.0.1:3000/batch-rewrite/task-visibility-hotfix.js || true)"
              printf '%s' "$feedback_html" | grep -q 'interaction-feedback.js'
              printf '%s' "$feedback_html" | grep -q 'task-visibility-hotfix.js'
              printf '%s' "$feedback_js" | grep -q 'processBtn'
              printf '%s' "$task_visibility_js" | grep -q 'latestTaskDate'
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 2
          done
          echo 'Local ECS V31 build-info or Novel Fetch feedback verification failed.' >&2
          exit 1
          REMOTE

          for attempt in $(seq 1 20); do
            public_body="$(curl -fsS --connect-timeout 5 "http://${ECS_HOST}:3000/api/novel-panel/build-info" || true)"
            if printf '%s' "$public_body" | grep -q '\"app_version\":\"v78.3.0.31\"' && printf '%s' "$public_body" | grep -q '\"release_version\":\"v78.3.0.31\"'; then
              public_feedback_html="$(curl -fsS --connect-timeout 5 "http://${ECS_HOST}:3000/batch-rewrite/" || true)"
              public_feedback_js="$(curl -fsS --connect-timeout 5 "http://${ECS_HOST}:3000/batch-rewrite/interaction-feedback.js" || true)"
              public_task_visibility_js="$(curl -fsS --connect-timeout 5 "http://${ECS_HOST}:3000/batch-rewrite/task-visibility-hotfix.js" || true)"
              printf '%s' "$public_feedback_html" | grep -q 'interaction-feedback.js'
              printf '%s' "$public_feedback_html" | grep -q 'task-visibility-hotfix.js'
              printf '%s' "$public_feedback_js" | grep -q 'processBtn'
              printf '%s' "$public_task_visibility_js" | grep -q 'latestTaskDate'
              printf '%s\n' "$public_body"
              curl -fsS --connect-timeout 5 "http://${ECS_HOST}:3000/novel-panel" >/dev/null
              echo "Public V88 Novel Fetch visible-feedback and task-visibility verification passed."
              exit 0
            fi
            sleep 2
          done
          echo 'Public V31 build-info or Novel Fetch task visibility verification failed.' >&2
          exit 1

      - name: Rollback V88 ECS on failed verification
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${ECS_DEPLOY_READY:-false}" != "true" ]; then
            echo "::notice::Rollback skipped because no ECS deployment was attempted."
            exit 0
          fi
          ssh_options=(ssh -i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20)
          "${ssh_options[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$ECS_COMPOSE_FILE" <<'REMOTE'
          set -Eeuo pipefail
          compose_file="$1"
          compose_dir="$(dirname "$compose_file")"
          cd "$compose_dir"
          compose=(docker compose -f "$compose_file" -f "$compose_dir/docker-compose.browser-worker.yml")
          test -s /tmp/v88-last-rollback-image
          test -s /tmp/v88-last-service-image
          rollback_image="$(cat /tmp/v88-last-rollback-image)"
          service_image="$(cat /tmp/v88-last-service-image)"
          docker image inspect "$rollback_image" >/dev/null
          docker image inspect "$service_image" >/dev/null
          docker tag "$rollback_image" "$service_image"

          if [ -s /tmp/v88-last-rollback-worker-image ]; then
            test -s /tmp/v88-last-worker-service-image
            rollback_worker_image="$(cat /tmp/v88-last-rollback-worker-image)"
            worker_service_image="$(cat /tmp/v88-last-worker-service-image)"
            docker image inspect "$rollback_worker_image" >/dev/null
            docker tag "$rollback_worker_image" "$worker_service_image"
            "${compose[@]}" up -d --no-deps --force-recreate --pull never novel-fetch-121-worker
            "${compose[@]}" up -d --no-deps --force-recreate --pull never v88-node
            "${compose[@]}" ps novel-fetch-121-worker v88-node
          else
            "${compose[@]}" stop novel-fetch-121-worker || true
            "${compose[@]}" rm -f novel-fetch-121-worker || true
            docker compose -f "$compose_file" up -d --no-deps --force-recreate --pull never v88-node
            docker compose -f "$compose_file" ps v88-node
          fi
          echo "Rolled back V88 ECS to $service_image"
          REMOTE

      - name: Prune old V88 AMD64 release artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = 'qiantie-v88-linux-amd64-';
            const keepLatest = 2;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const releaseArtifacts = artifacts
              .filter((artifact) => artifact.name.startsWith(prefix))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const obsolete = releaseArtifacts.slice(keepLatest);
            core.info(`Found ${releaseArtifacts.length} V88 AMD64 release artifacts; pruning ${obsolete.length}.`);
            for (const artifact of obsolete) {
              core.info(`Deleting old artifact ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

      - name: Upload V88 AMD64 release artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qiantie-v88-linux-amd64-${{ env.SHORT_SHA }}
          path: release/*
          if-no-files-found: error
          retention-days: 14