name: V88 Manual Docker Recovery Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PLATFORM: linux/amd64

jobs:
  recovery-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout selected V88 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          npm ci
          npm run build

      - name: Build recovery images
        shell: bash
        run: |
          set -Eeuo pipefail
          short_sha="${GITHUB_SHA::12}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          main="ghcr.io/${owner}/qiantie-v88:recovery-${short_sha}"
          worker="ghcr.io/${owner}/qiantie-v88-121-browser-worker:recovery-${short_sha}"
          docker build --platform "$IMAGE_PLATFORM" -t "$main" .
          docker build --platform "$IMAGE_PLATFORM" -t "$worker" ./services/121-browser-worker
          echo "MAIN_IMAGE=$main" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=$worker" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish recovery images
        run: |
          set -Eeuo pipefail
          docker push "$MAIN_IMAGE"
          docker push "$WORKER_IMAGE"
          echo "Manual recovery images published for $GITHUB_SHA"

      - name: Recovery note
        run: |
          echo "This workflow is manual-only. Routine V88 deployment uses v88-ecs-direct-deploy.yml."
          echo "Historical pre-direct-deploy workflow is archived under .github/manual-workflows/."
