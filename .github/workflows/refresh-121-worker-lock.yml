name: Refresh 121 Worker Lock

on:
  push:
    branches:
      - integration/v78-novel-fetch-v2-final-20260902
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate deterministic Worker lockfile
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 2000
          npm config set fetch-retry-maxtimeout 20000
          npm --prefix services/121-browser-worker install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit Worker lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/121-browser-worker/package-lock.json
          if git diff --cached --quiet; then
            echo "Worker lockfile already current"
            exit 0
          fi
          git commit -m "chore(v78): lock 121 Browser Worker dependencies"
          git push
