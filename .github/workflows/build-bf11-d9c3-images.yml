name: Build Batch Factory V11 Docker Images

on:
  push:
    branches:
      - ci/build-bf11-d9c3-fix-memory-store-20260904

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
      NODE_IMAGE: qiantie-v88-node-public-v88:${{ github.sha }}
      GO_IMAGE: qiantie-go-api:public-v88-bf11-${{ github.sha }}
      RELEASE_TAG: bf11-v11-${{ github.sha }}
    steps:
      - name: Checkout pushed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        working-directory: backend
        run: go test ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Node image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "$NODE_IMAGE" \
            --label org.opencontainers.image.revision="$SOURCE_SHA" \
            --load .

      - name: Build Go API image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "$GO_IMAGE" \
            --label org.opencontainers.image.revision="$SOURCE_SHA" \
            --load backend

      - name: Export images
        run: |
          mkdir -p artifact
          docker save "$NODE_IMAGE" "$GO_IMAGE" | gzip -c > "artifact/batch-factory-v11-$SOURCE_SHA-linux-amd64.tar.gz"
          sha256sum "artifact/batch-factory-v11-$SOURCE_SHA-linux-amd64.tar.gz" > artifact/SHA256SUMS
          docker image inspect "$NODE_IMAGE" "$GO_IMAGE" > artifact/image-inspect.json

      - name: Publish Docker image bundle as GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            artifact/batch-factory-v11-"$SOURCE_SHA"-linux-amd64.tar.gz \
            artifact/SHA256SUMS \
            artifact/image-inspect.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Batch Factory V11 images $SOURCE_SHA" \
            --notes "Built from CI fix branch, based on Batch Factory V11 source d9c3a164053473c55704fa0ba904041366564b61." \
            --prerelease
