name: V88 Trigger Node Emergency Once

on:
  push:
    branches:
      - v88
    paths:
      - '.github/workflows/v88-trigger-node-emergency-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout v88
        uses: actions/checkout@v4
        with:
          ref: v88
          fetch-depth: 1

      - name: Dispatch existing Node emergency workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run v88-node-emergency-redeploy.yml --ref v88

      - name: Remove one-shot trigger
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/v88-trigger-node-emergency-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/v88-trigger-node-emergency-once.yml
          git commit -m 'ci(v88): remove one-shot Node emergency trigger'
          git push origin HEAD:v88
