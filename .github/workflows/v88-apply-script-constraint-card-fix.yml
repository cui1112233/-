name: V88 Apply Script Constraint Card Fix

on:
  push:
    branches:
      - v88
    paths:
      - .github/workflows/v88-apply-script-constraint-card-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V88
        uses: actions/checkout@v4
        with:
          ref: v88
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore constraint assembly fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/user/pages/ScriptPage.jsx')
          source = path.read_text(encoding='utf-8')
          old = """  const rawShotCards = useMemo(() => {\n    return getShotCardsWithinDuration(selectedFormat, output, selectedDuration);\n  }, [selectedFormat, selectedDuration, output]);\n  const shotCards = useMemo(() => rawShotCards.map((card, index) => buildFinalSegmentCard(card, {\n    extractInfo,\n    constraints: constraintsForFormat(outputConstraints, selectedFormat, extractInfo),\n    index,\n    duration: selectedDuration\n  })), [rawShotCards, extractInfo, outputConstraints, selectedFormat, selectedDuration]);\n"""
          new = """  const rawShotCards = useMemo(() => {\n    const parsed = getShotCardsWithinDuration(selectedFormat, output, selectedDuration);\n    if (parsed.length) return parsed;\n    // 统一 ### 分镜N 协议仍是首选边界；但模型偶发未按协议输出标题时，\n    // 仍需把现有输出作为一张展示卡送入最终组装，否则基础设定和已开启约束会全部不可见。\n    return output ? [output] : [];\n  }, [selectedFormat, selectedDuration, output]);\n  const shotCards = useMemo(() => rawShotCards.map((card, index) => buildFinalSegmentCard(card, {\n    extractInfo,\n    constraints: constraintsForFormat(constraints, selectedFormat, extractInfo),\n    index,\n    duration: selectedDuration\n  })), [rawShotCards, extractInfo, constraints, selectedFormat, selectedDuration]);\n"""
          if old not in source:
              raise SystemExit('ScriptPage target block changed; refusing to patch stale source')
          if source.count(old) != 1:
              raise SystemExit('ScriptPage target block is not unique; refusing unsafe patch')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify focused regression
        run: |
          set -Eeuo pipefail
          node --test tests/script-constraint-card-visibility.test.js frontend/src/user/pages/scriptFinalSegment.test.js
          git diff --check

      - name: Commit approved fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Novel2Script Dev'
          git config user.email 'dev@novel2script.local'
          git add frontend/src/user/pages/ScriptPage.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(v88): restore constraints in storyboard cards'
          git push origin HEAD:v88
