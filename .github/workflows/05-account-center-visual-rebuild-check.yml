name: 05 Account Center Visual Rebuild Check

on:
  push:
    branches:
      - 05-account-center-visual-rebuild
  pull_request:
    branches:
      - 04-account-recovery-advanced-auth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-and-account-tests:
    name: Visual contract and account regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: >-
          node --test
          tests/account-center-visual-contract.test.js
          tests/account-recovery-advanced-auth.test.js
          tests/identity-team-collaboration.test.js
          tests/team-governance-control.test.js
          tests/team-governance-zero-quota.test.js
          tests/account-center-acceptance.test.js
          tests/member-center.test.js
          tests/member-usage-runtime.test.js
          tests/dev-permissions.test.js
          tests/persistent-session.test.js
          tests/tts-preferences-contract.test.js
          tests/agent-routes.test.js
          tests/agent-skill-routes.test.js

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build

  runtime-smoke:
    name: Clean-start account center runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - name: Start from clean checkout and exercise account center
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/dist frontend/node_modules
          node server.js > /tmp/qiantie-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/api/build-info > /tmp/build-info.json; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/qiantie-server.log
            exit 1
          fi

          test -f frontend/dist/index.html
          test -f frontend/dist/.qiantie-source-fingerprint
          grep -q '未找到可用 dist，正在首次构建前端' /tmp/qiantie-server.log

          curl -fsS http://127.0.0.1:3000/member > /tmp/member.html
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/member.html', 'utf8');
          const cssPaths = [...html.matchAll(/href=["']([^"']+\.css)["']/g)].map(match => match[1]);
          if (!cssPaths.length) throw new Error('built member page has no CSS bundle');
          fs.writeFileSync('/tmp/css-paths.json', JSON.stringify(cssPaths));
          NODE
          node - <<'NODE'
          const fs = require('node:fs');
          const paths = JSON.parse(fs.readFileSync('/tmp/css-paths.json', 'utf8'));
          const http = require('node:http');
          Promise.all(paths.map(path => new Promise((resolve, reject) => {
            http.get(`http://127.0.0.1:3000${path}`, response => {
              let body = '';
              response.setEncoding('utf8');
              response.on('data', chunk => { body += chunk; });
              response.on('end', () => resolve(body));
            }).on('error', reject);
          }))).then(parts => {
            const css = parts.join('\n');
            for (const marker of ['account-center-stage', 'account-center-subnav', 'legacy-account-entry']) {
              if (!css.includes(marker)) throw new Error(`latest personal-center CSS missing: ${marker}`);
            }
          }).catch(error => { console.error(error); process.exit(1); });
          NODE

          for path in /member /team /api-config /usage /profile /security /advanced-team-admin '/recover?reset=smoke' /invite/smoke; do
            status=$(curl -sS -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:3000${path}")
            if [ "$status" != "200" ]; then
              echo "page failed: ${path} -> ${status}"
              cat /tmp/qiantie-server.log
              exit 1
            fi
          done

          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"username":"choushiyiguai","password":"123456","remember":false}' \
            http://127.0.0.1:3000/api/login > /tmp/login.json
          TOKEN=$(node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/login.json', 'utf8'));
          if (!payload.token || payload.role !== 'dev') throw new Error('owner runtime login failed');
          process.stdout.write(payload.token);
          NODE
          )

          for endpoint in \
            /api/login/session \
            /api/member/me \
            /api/member/security \
            /api/member/team \
            /api/member/team/meta \
            /api/account-recovery/email/status \
            /api/team-admin/teams; do
            curl -fsS -H "Authorization: Bearer ${TOKEN}" "http://127.0.0.1:3000${endpoint}" > /dev/null
          done

          echo 'clean-start personal center runtime smoke passed'
