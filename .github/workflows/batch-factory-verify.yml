name: Verify batch factory unified settings

on:
  push:
    branches:
      - 08-batch-factory-unified-settings-version-sync
      - 09-batch-factory-video-model-selector

permissions:
  contents: read

concurrency:
  group: batch-factory-unified-settings-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm ci

      - name: Test config version snapshots
        run: node --test test/batch-factory-config-version.test.js

      - name: Test sparse overrides
        run: node --test test/batch-factory-overrides.test.js

      - name: Test settings inheritance
        run: node --test test/batch-factory-settings-inheritance.test.js

      - name: Test existing batch factory regression suite
        run: node --test test/batch-factory.test.js

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build
