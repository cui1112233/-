name: V78 Go Integrated ARM64 Image

on:
  push:
    branches:
      - feat/v78-go-integrated-novel-fetch-doubao
  workflow_dispatch:

jobs:
  image-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 Go image tar
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag qiantie-go-api:public-v78 \
            --provenance=false \
            --output type=docker,dest=/tmp/qiantie-go-api-public-v78-arm64.tar \
            ./backend
          sha256sum /tmp/qiantie-go-api-public-v78-arm64.tar | tee /tmp/qiantie-go-api-public-v78-arm64.tar.sha256
      - name: Upload ARM64 image tar
        uses: actions/upload-artifact@v4
        with:
          name: qiantie-go-api-public-v78-arm64
          path: |
            /tmp/qiantie-go-api-public-v78-arm64.tar
            /tmp/qiantie-go-api-public-v78-arm64.tar.sha256
          if-no-files-found: error
