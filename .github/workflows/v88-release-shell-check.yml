name: V88 Release Shell Check

on:
  push:
    branches:
      - fix/v88-release-heredoc-20260907

permissions:
  contents: write

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v88-release-heredoc-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic heredoc fix
        run: node scripts/fix-v88-release-heredoc.js
      - name: Verify V88 public deploy shell syntax
        run: node --test tests/v88-public-release-shell-syntax.test.js
      - name: Commit release workflow fix
        run: |
          if git diff --quiet -- .github/workflows/v88-linux-amd64-image-release.yml; then
            echo 'No release workflow changes remain to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v88-linux-amd64-image-release.yml
          git commit -m 'fix(release): correct V88 deploy heredoc termination'
          git push origin HEAD:fix/v88-release-heredoc-20260907
