name: V88 Runner Image Transport Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact V88 source SHA to build and deploy
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: v88-public-release
  cancel-in-progress: false

env:
  ECS_HOST: 115.190.156.223
  ECS_USER: root

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate requested release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Build exact release images on the runner
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          npm ci --omit=dev
          npm --prefix frontend ci
          npm --prefix frontend run build
          docker build --platform linux/amd64 --build-arg "QIANTIE_RELEASE_SHA=$RELEASE_SHA" -t "qiantie-v88-node:$RELEASE_SHA" .
          docker build --platform linux/amd64 --build-arg "QIANTIE_RELEASE_SHA=$RELEASE_SHA" -t "qiantie-go-api:$RELEASE_SHA" backend
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "qiantie-v88-node:$RELEASE_SHA")" = 'linux/amd64'
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "qiantie-go-api:$RELEASE_SHA")" = 'linux/amd64'

      - name: Archive exact release images
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          docker save "qiantie-go-api:$RELEASE_SHA" "qiantie-v88-node:$RELEASE_SHA" | gzip -1 > /tmp/v88-images.tar.gz
          test -s /tmp/v88-images.tar.gz

      - name: Upload private image transport artifact
        id: image_archive
        uses: actions/upload-artifact@v4
        with:
          name: v88-images-${{ inputs.release_sha }}
          path: /tmp/v88-images.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Prepare ECS SSH
        shell: bash
        env:
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          ssh-keyscan -H "$ECS_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy runtime contracts and import private image artifact on ECS
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ARTIFACT_ID: ${{ steps.image_archive.outputs.artifact-id }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ACTIONS_TOKEN"
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          timeout 60 scp "${ssh_opts[@]}" deploy/v88-public/nginx.conf "$ECS_USER@$ECS_HOST:/tmp/v88-public-nginx-${RELEASE_SHA}.conf"
          timeout 60 scp "${ssh_opts[@]}" deploy/v88-public/docker-compose.yml "$ECS_USER@$ECS_HOST:/tmp/v88-public-compose-${RELEASE_SHA}.yml"
          printf '%s' "$ACTIONS_TOKEN" | timeout 30 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" "umask 077; cat > /tmp/v88-artifact-token-${RELEASE_SHA}"
          timeout 1200 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$RELEASE_SHA" "$ARTIFACT_ID" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          artifact_id="$2"
          token_file="/tmp/v88-artifact-token-${expected_sha}"
          archive_file="/tmp/v88-images-${expected_sha}.zip"
          cleanup() { rm -f "$token_file" "$archive_file"; }
          trap cleanup EXIT
          token="$(cat "$token_file")"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 900 \
            -H "Authorization: Bearer ${token}" \
            -o "$archive_file" \
            "https://api.github.com/repos/cui1112233/-/actions/artifacts/${artifact_id}/zip"
          unset token
          unzip -p "$archive_file" v88-images.tar.gz | gzip -d | docker load
          node_local="qiantie-v88-node:${expected_sha}"
          go_local="qiantie-go-api:${expected_sha}"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$node_local")" = linux/amd64
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$go_local")" = linux/amd64
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$node_local")" = "$expected_sha"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$go_local")" = "$expected_sha"
          docker tag "$node_local" "ghcr.io/cui1112233/qiantie-v88-node:${expected_sha}"
          docker tag "$go_local" "ghcr.io/cui1112233/qiantie-go-api:${expected_sha}"
          REMOTE

      - name: Deploy paired images with rollback
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          timeout 1200 ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" bash -s -- "$RELEASE_SHA" "$ECS_HOST" "${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          public_host="$2"
          backup_id="$3"
          node_image="ghcr.io/cui1112233/qiantie-v88-node:${expected_sha}"
          go_image="ghcr.io/cui1112233/qiantie-go-api:${expected_sha}"
          cd /opt/qiantie/v88/deploy/v88-public
          test -s .env
          test -s docker-compose.yml
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$node_image")" = linux/amd64
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$go_image")" = linux/amd64
          cp -a .env ".env.pre-runner-${backup_id}"
          cp -a nginx.conf "nginx.conf.pre-runner-${backup_id}"
          cp -a docker-compose.yml "docker-compose.yml.pre-runner-${backup_id}"
          rollback() {
            status=$?
            trap - EXIT ERR
            if [ "$status" -ne 0 ]; then
              cp -a ".env.pre-runner-${backup_id}" .env || true
              cp -a "nginx.conf.pre-runner-${backup_id}" nginx.conf || true
              cp -a "docker-compose.yml.pre-runner-${backup_id}" docker-compose.yml || true
              docker compose -f docker-compose.yml up -d --no-deps --force-recreate --pull never go-api browser-worker v88-node nginx || true
            fi
            rm -f "/tmp/v88-public-nginx-${expected_sha}.conf" "/tmp/v88-public-compose-${expected_sha}.yml"
            exit "$status"
          }
          trap rollback EXIT ERR
          set_env() {
            key="$1" value="$2"
            if grep -q "^${key}=" .env; then sed -i "s|^${key}=.*|${key}=${value}|" .env; else printf '\n%s=%s\n' "$key" "$value" >> .env; fi
          }
          set_env QIANTIE_NODE_IMAGE "$node_image"
          set_env QIANTIE_GO_IMAGE "$go_image"
          set_env QIANTIE_RELEASE_SHA "$expected_sha"
          set_env QIANTIE_NODE_RELEASE_SHA "$expected_sha"
          set_env QIANTIE_GO_RELEASE_SHA "$expected_sha"
          set_env QIANTIE_BATCH_FACTORY_V11_SLICE 5
          set_env QIANTIE_BATCH_FACTORY_V11_PRODUCTION_ENABLED 1
          set_env QIANTIE_BATCH_FACTORY_V11_LOCAL_MERGE_ENABLED 1
          set_env QIANTIE_BATCH_FACTORY_V11_DYNAMIC_TEXT_PROVIDER 1
          cp "/tmp/v88-public-nginx-${expected_sha}.conf" nginx.conf
          cp "/tmp/v88-public-compose-${expected_sha}.yml" docker-compose.yml
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml up -d --no-deps --force-recreate --pull never go-api browser-worker v88-node
          docker compose -f docker-compose.yml exec -T nginx nginx -t
          docker compose -f docker-compose.yml up -d --no-deps --force-recreate --pull never nginx
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/api/build-info | python3 -c 'import json,sys; raise SystemExit(0 if json.load(sys.stdin).get("git_sha") == sys.argv[1] else 1)' "$expected_sha"; then
              curl -fsS --max-time 10 http://127.0.0.1:3000/batch-factory >/dev/null
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:3000/api/batch-factory/v11/capabilities)"
              case "$code" in 200|401|403) break;; *) exit 52;; esac
            fi
            sleep 2
            [ "$attempt" = 30 ] && exit 51
          done
          curl -fsS --max-time 10 "http://${public_host}:3000/api/build-info" | python3 -c 'import json,sys; raise SystemExit(0 if json.load(sys.stdin).get("git_sha") == sys.argv[1] else 1)' "$expected_sha"
          echo "STATUS=DEPLOYED release_sha=$expected_sha"
          trap - EXIT ERR
          rm -f "/tmp/v88-public-nginx-${expected_sha}.conf" "/tmp/v88-public-compose-${expected_sha}.yml"
          REMOTE

      - name: Verify public release externally
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          curl -fsS --max-time 15 "http://${ECS_HOST}:3000/api/build-info" | tee /tmp/v88-public-build.json | python3 -c 'import json,sys; raise SystemExit(0 if json.load(sys.stdin).get("git_sha") == sys.argv[1] else 1)' "$RELEASE_SHA"
          curl -fsS --max-time 15 "http://${ECS_HOST}:3000/batch-factory" >/dev/null
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "http://${ECS_HOST}:3000/api/batch-factory/v11/capabilities")"
          case "$code" in 200|401|403) ;; *) exit 1;; esac
          echo "V88_RUNNER_TRANSPORT_DEPLOY_OK release_sha=$RELEASE_SHA v11_status=$code"
