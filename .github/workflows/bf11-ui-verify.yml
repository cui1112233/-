name: BF11 V78 UI Verify

on:
  push:
    branches:
      - feat/batch-factory-v11-layout-showcase
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install V78 frontend dependencies
        run: npm ci
      - name: Run Batch Factory V11 UI tests
        run: node --test src/user/pages/batch-factory-v11/*.test.js
      - name: Build V78 frontend
        run: npm run build
