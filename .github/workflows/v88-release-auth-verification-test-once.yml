name: V88 Release Auth Verification Test Once

on:
  push:
    branches:
      - fix/v88-release-auth-verification-20260907
    paths:
      - 'tests/v88-public-browser-worker-deploy.test.js'
      - 'scripts/patch-v88-release-auth-verification.py'
      - '.github/workflows/v88-linux-amd64-image-release.yml'
      - '.github/workflows/v88-release-auth-verification-test-once.yml'

permissions:
  contents: write

jobs:
  verify-and-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch auth-safe exact-image release verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/patch-v88-release-auth-verification.py

      - name: Verify GREEN release contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test tests/v88-public-browser-worker-deploy.test.js tests/v88-release-registry-resilience.test.js tests/v88-release-worker-secret-consistency.test.js

      - name: Stage verified workflow bytes on a normal repository path
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p staging
          cp .github/workflows/v88-linux-amd64-image-release.yml staging/v88-linux-amd64-image-release.patched.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staging/v88-linux-amd64-image-release.patched.yml
          git commit -m 'chore(v88): stage verified release workflow blob'
          git push origin HEAD:fix/v88-release-auth-verification-20260907
