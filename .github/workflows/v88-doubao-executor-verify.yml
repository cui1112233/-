name: V88 Doubao Executor Verify

on:
  push:
    branches:
      - v88
      - 'fix/v88-doubao-executor-*'
    paths:
      - 'backend/internal/httpapi/**'
      - 'backend/internal/localexecutor/**'
      - 'backend/internal/localartifact/**'
      - 'routes/script-video.js'
      - 'routes/local-executor-downloads.js'
      - 'test/**local-executor*.test.js'
      - 'test/**script-video*.test.js'
      - 'local-executor/**'
      - 'frontend/src/user/pages/ScriptPage.jsx'
      - 'frontend/src/user/pages/SettingsPage.jsx'
      - 'frontend/src/shared/api/scriptVideo.js'
      - '.github/workflows/v88-doubao-executor-verify.yml'
  pull_request:
    branches:
      - v88
    paths:
      - 'backend/internal/httpapi/**'
      - 'backend/internal/localexecutor/**'
      - 'backend/internal/localartifact/**'
      - 'routes/script-video.js'
      - 'routes/local-executor-downloads.js'
      - 'test/**local-executor*.test.js'
      - 'test/**script-video*.test.js'
      - 'local-executor/**'
      - 'frontend/src/user/pages/ScriptPage.jsx'
      - 'frontend/src/user/pages/SettingsPage.jsx'
      - 'frontend/src/shared/api/scriptVideo.js'
      - '.github/workflows/v88-doubao-executor-verify.yml'

jobs:
  backend-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum
      - name: Run backend tests
        run: go test ./...

  node-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Run executor route tests
        run: node --test test/local-executor-updates.test.js test/script-video*.test.js

  local-executor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-executor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install executor dependencies
        run: npm ci
      - name: Run executor tests
        run: npm test
      - name: Check executor syntax
        run: npm run check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
