name: Pet feature verification

on:
  push:
    branches:
      - feature/02-pixiu-pet-switcher

permissions:
  contents: write

jobs:
  pet-feature:
    name: Pet feature focused verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Materialize pixiu runtime asset
        if: ${{ hashFiles('pets/pixiu/.asset-upload/part-06-final.b64') != '' }}
        shell: bash
        run: |
          cat \
            pets/pixiu/.asset-upload/part-00.b64 \
            pets/pixiu/.asset-upload/part-01.b64 \
            pets/pixiu/.asset-upload/part-02.b64 \
            pets/pixiu/.asset-upload/part-03.b64 \
            pets/pixiu/.asset-upload/part-04.b64 \
            pets/pixiu/.asset-upload/part-05.b64 \
            pets/pixiu/.asset-upload/part-06-final.b64 \
            pets/pixiu/.asset-upload/part-07.b64 \
            | base64 --decode > pets/pixiu/spritesheet.webp

      - name: Verify pixiu runtime asset
        shell: bash
        run: |
          test -f pets/pixiu/spritesheet.webp
          echo "44edc8a2ee6a98552b4fa490bdad3b984a83e7c5596cadbbb3c012f9c5019906  pets/pixiu/spritesheet.webp" | sha256sum --check -
          test "$(stat -c %s pets/pixiu/spritesheet.webp)" = "61214"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum

      - name: Run Go pet catalog tests
        working-directory: backend
        run: go test ./internal/pet -v

      - name: Run pet preference migration tests
        working-directory: backend
        run: go test ./internal/storage -run UserPreference -v

      - name: Run config pet handler tests
        working-directory: backend
        run: go test ./internal/httpapi -run 'Config.*Pet|Pet.*Config' -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run pet frontend tests
        run: node --test frontend/src/shared/api/configPayload.test.js frontend/src/shared/pet/*.test.js

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Run root test suite
        run: npm test

      - name: Persist verified pixiu runtime asset
        if: ${{ hashFiles('pets/pixiu/.asset-upload/part-06-final.b64') != '' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r pets/pixiu/.asset-upload
          git rm -f pets/pixiu/spritesheet.svg
          git add pets/pixiu/spritesheet.webp
          git commit -m "feat: publish verified pixiu runtime asset"
          git push
