name: Pet feature verification

on:
  push:
    branches:
      - feature/02-pixiu-pet-switcher

permissions:
  contents: read

jobs:
  pet-feature:
    name: Go pet tests and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        working-directory: backend
        run: go test ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run pet frontend tests
        run: node --test frontend/src/shared/pet/*.test.js

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Run root test suite
        run: npm test
