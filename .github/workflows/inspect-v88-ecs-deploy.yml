name: Inspect V88 ECS deploy state

on:
  push:
    branches:
      - ops/cancel-stale-v88-release-20260906
    paths:
      - '.github/workflows/inspect-v88-ecs-deploy.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect final public V88 runtime without mutation
        shell: bash
        env:
          ECS_HOST: 115.190.156.223
          ECS_USER: root
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          ssh-keyscan -H "$ECS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15 "$ECS_USER@$ECS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          main_id="$(docker ps -qf name=v88-public-v88-node-1)"
          test -n "$main_id"
          target=/app/lib/novel-fetch-workshop/121-browser-client.js
          echo "FINAL_PUBLIC_CONTAINER=$main_id"
          echo "FINAL_PUBLIC_SHA256=$(docker exec "$main_id" sha256sum "$target" | awk '{print $1}')"
          docker exec "$main_id" sh -lc "grep -n -E 'QIANTIE_121_CLIENT_TIMEOUT_MS|QIANTIE_121_CLIENT_LOGIN_TIMEOUT_MS|loginTimeoutMs =|45000|20000' '$target'"

          docker exec "$main_id" node -e '
            const base=(process.env.QIANTIE_121_BROWSER_WORKER_URL||"").replace(/\/$/,"");
            const secret=process.env.QIANTIE_121_WORKER_SECRET||"";
            if(!base||!secret) throw new Error("worker env missing");
            fetch(base+"/healthz",{headers:{"x-qiantie-internal-secret":secret},signal:AbortSignal.timeout(5000)})
              .then(async r=>{if(!r.ok) throw new Error(`worker health ${r.status}`); console.log(`FINAL_PUBLIC_WORKER=status_${r.status}`)})
              .catch(e=>{console.error(e);process.exit(1)});
          '

          docker exec "$main_id" node -e '
            const {create121BrowserClient}=require("/app/lib/novel-fetch-workshop/121-browser-client");
            const fakeFetch=delay=>async (_url,options)=>new Promise((resolve,reject)=>{
              const timer=setTimeout(()=>resolve({ok:true,status:200,text:async()=>JSON.stringify({ok:true,status:"ready"})}),delay);
              options.signal.addEventListener("abort",()=>{clearTimeout(timer); const e=new Error("aborted"); e.name="AbortError"; reject(e);});
            });
            (async()=>{
              const client=create121BrowserClient({baseUrl:"http://worker:8787",secret:"test",timeoutMs:1000,loginTimeoutMs:3000,fetchImpl:fakeFetch(1500)});
              const login=await client.login({owner:"probe"});
              if(login.status!=="ready") throw new Error("login long budget failed");
              let normalTimedOut=false;
              try { await client.test({owner:"probe"}); } catch(e) { normalTimedOut=e.code==="BROWSER_WORKER_TIMEOUT"; }
              if(!normalTimedOut) throw new Error("normal request timeout protection missing");
              console.log("FINAL_PUBLIC_TIMEOUT_POLICY=ok");
            })().catch(e=>{console.error(e);process.exit(1)});
          '

          http_code="$(curl -sS -o /tmp/final-public-probe.out -w '%{http_code}' --max-time 10 http://127.0.0.1:3000/api/novel-panel/build-info || true)"
          case "$http_code" in
            200|401) ;;
            *) echo "unexpected final public HTTP status: $http_code" >&2; exit 1 ;;
          esac
          echo "FINAL_PUBLIC_HTTP_STATUS=$http_code"
          REMOTE
