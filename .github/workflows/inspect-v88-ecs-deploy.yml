name: Inspect V88 ECS deploy state

on:
  push:
    branches:
      - ops/cancel-stale-v88-release-20260906
    paths:
      - '.github/workflows/inspect-v88-ecs-deploy.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect public version profile save and reload path without mutation
        shell: bash
        env:
          ECS_HOST: 115.190.156.223
          ECS_USER: root
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          ssh-keyscan -H "$ECS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15 "$ECS_USER@$ECS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          main_id="$(docker ps -qf name=v88-public-v88-node-1)"
          test -n "$main_id"
          echo "PUBLIC_CONTAINER=$main_id"

          echo '=== exact UI labels and nearby source ==='
          docker exec "$main_id" sh -lc 'grep -R -n -C 10 -E "版本对应配置档|版本配置|配置档|同步批量后台配置|同步批量风格类型" /app/frontend /app/public /app/routes /app/lib 2>/dev/null | head -500 || true'

          echo '=== likely profile/config API source ==='
          docker exec "$main_id" sh -lc 'grep -R -n -C 8 -E "version.*profile|profile.*version|version.*config|config.*version|batch.*config|config.*batch|saveConfig|loadConfig|sync.*121|121.*sync" /app/frontend /app/routes /app/lib 2>/dev/null | head -700 || true'

          echo '=== novel panel route registrations ==='
          docker exec "$main_id" sh -lc 'grep -R -n -C 5 -E "novel-panel|batch-rewrite-v2|novel-fetch|router\.(get|post|put|patch).*config|router\.(get|post|put|patch).*profile" /app/routes /app/app.js /app/server.js 2>/dev/null | head -700 || true'

          echo '=== recent runtime logs related to config/profile/save ==='
          docker logs --since 6h "$main_id" 2>&1 | grep -E -i 'novel|profile|config|version|save|121|timeout|sync' | tail -300 || true

          echo '=== mysql env presence only ==='
          docker exec "$main_id" node -e '
            const keys=["MYSQL_HOST","MYSQL_DATABASE","MYSQL_USER","DB_HOST","DB_NAME","DATABASE_URL"];
            for (const k of keys) console.log(`${k}=${process.env[k]?"SET":"UNSET"}`);
          '
          REMOTE
