name: Inspect V88 ECS deploy state

on:
  push:
    branches:
      - ops/cancel-stale-v88-release-20260906
    paths:
      - '.github/workflows/inspect-v88-ecs-deploy.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect V88 ECS without mutation
        shell: bash
        env:
          ECS_HOST: 115.190.156.223
          ECS_USER: root
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          ssh-keyscan -H "$ECS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15 "$ECS_USER@$ECS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          main_id="$(docker ps -qf name=v88-public-v88-node-1)"
          old_worker_id="$(docker ps -qf name=v88-public-browser-worker-1)"
          echo '=== containers ==='
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          echo '=== configured worker URL ==='
          docker exec "$main_id" printenv QIANTIE_121_BROWSER_WORKER_URL || true
          echo '=== secret equality with existing browser-worker ==='
          node_secret="$(docker exec "$main_id" printenv QIANTIE_121_WORKER_SECRET 2>/dev/null || true)"
          worker_secret="$(docker exec "$old_worker_id" printenv QIANTIE_121_WORKER_SECRET 2>/dev/null || true)"
          if [ -n "$node_secret" ] && [ "$node_secret" = "$worker_secret" ]; then
            echo 'NODE_AND_EXISTING_WORKER_SECRET_MATCH=true'
          else
            echo 'NODE_AND_EXISTING_WORKER_SECRET_MATCH=false'
          fi
          echo '=== configured worker health from v88-node ==='
          docker exec "$main_id" node - <<'NODE'
          const base = process.env.QIANTIE_121_BROWSER_WORKER_URL || '';
          const secret = process.env.QIANTIE_121_WORKER_SECRET || '';
          if (!base || !secret) {
            console.log('CONFIGURED_WORKER_HEALTH=env_missing');
            process.exit(0);
          }
          fetch(`${base.replace(/\/$/, '')}/healthz`, { headers: { 'x-qiantie-internal-secret': secret } })
            .then(async r => console.log(`CONFIGURED_WORKER_HEALTH=status_${r.status} body=${(await r.text()).slice(0,300)}`))
            .catch(e => console.log(`CONFIGURED_WORKER_HEALTH=error ${e.name}:${e.message}`));
          NODE
          echo '=== existing browser-worker health from v88-node ==='
          docker exec "$main_id" node - <<'NODE'
          const secret = process.env.QIANTIE_121_WORKER_SECRET || '';
          fetch('http://browser-worker:8787/healthz', { headers: { 'x-qiantie-internal-secret': secret } })
            .then(async r => console.log(`EXISTING_WORKER_HEALTH=status_${r.status} body=${(await r.text()).slice(0,300)}`))
            .catch(e => console.log(`EXISTING_WORKER_HEALTH=error ${e.name}:${e.message}`));
          NODE
          echo '=== existing worker routes ==='
          docker exec "$old_worker_id" sh -lc 'grep -R -n -E "healthz|/login|/profiles|/styles|upload|session" /app/src 2>/dev/null | head -120 || true'
          REMOTE
