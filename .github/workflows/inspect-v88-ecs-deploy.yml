name: Inspect V88 ECS deploy state

on:
  push:
    branches:
      - ops/cancel-stale-v88-release-20260906
    paths:
      - '.github/workflows/inspect-v88-ecs-deploy.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect public version config persistence path without mutation
        shell: bash
        env:
          ECS_HOST: 115.190.156.223
          ECS_USER: root
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          ssh-keyscan -H "$ECS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15 "$ECS_USER@$ECS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          main_id="$(docker ps -qf name=v88-public-v88-node-1)"
          test -n "$main_id"
          echo "PUBLIC_CONTAINER=$main_id"

          echo '=== public file hashes ==='
          for f in /app/routes/batch-rewrite.js /app/frontend/public/batch-rewrite/app.js /app/frontend/dist/batch-rewrite/app.js /app/app.js /app/routes/batch-rewrite-v2.js /app/lib/novel-fetch-workshop/v2-compose.js; do
            if docker exec "$main_id" test -f "$f"; then
              echo "FILE=$f"
              docker exec "$main_id" sha256sum "$f"
            fi
          done

          echo '=== backend binding normalization ==='
          docker exec "$main_id" sh -lc "grep -n -A16 -B3 'function normalizeProfileBindings' /app/routes/batch-rewrite.js || true"

          echo '=== web submit save registration ==='
          docker exec "$main_id" sh -lc "grep -n -E -A10 -B5 'web-submit/config|saveWebConfig' /app/routes/batch-rewrite.js /app/routes/batch-rewrite-v2.js 2>/dev/null | head -220 || true"

          echo '=== frontend confirm save path (source) ==='
          docker exec "$main_id" sh -lc "grep -n -A36 -B8 'async function confirmWebSubmitSelection' /app/frontend/public/batch-rewrite/app.js 2>/dev/null || true"
          echo '=== frontend saveConfig render path ==='
          docker exec "$main_id" sh -lc "grep -n -A34 -B8 'async function saveConfig' /app/frontend/public/batch-rewrite/app.js 2>/dev/null | head -120 || true"
          echo '=== frontend web submit save path ==='
          docker exec "$main_id" sh -lc "grep -n -A28 -B8 'async function saveWebSubmitConfig' /app/frontend/public/batch-rewrite/app.js 2>/dev/null || true"

          echo '=== router mount ==='
          docker exec "$main_id" sh -lc "grep -n -E -A8 -B5 'createBatchRewriteRouter|attachV78NovelFetchV2|/api/batch-rewrite' /app/app.js /app/server.js /app/index.js /app/lib/novel-fetch-workshop/v2-compose.js 2>/dev/null | head -220 || true"

          echo '=== actually served frontend markers ==='
          curl -fsS --max-time 10 http://127.0.0.1:3000/batch-rewrite/app.js -o /tmp/public-batch-rewrite-app.js
          echo "PUBLIC_ASSET_SHA256=$(sha256sum /tmp/public-batch-rewrite-app.js | awk '{print $1}')"
          grep -n -A28 -B8 'async function confirmWebSubmitSelection' /tmp/public-batch-rewrite-app.js || true
          REMOTE
