name: Inspect V88 ECS deploy state

on:
  push:
    branches:
      - ops/cancel-stale-v88-release-20260906
    paths:
      - '.github/workflows/inspect-v88-ecs-deploy.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect V88 ECS without mutation
        shell: bash
        env:
          ECS_HOST: 115.190.156.223
          ECS_USER: root
          V88_ECS_SSH_PRIVATE_KEY: ${{ secrets.V88_ECS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${V88_ECS_SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$V88_ECS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/v88_ecs"
          chmod 600 "$HOME/.ssh/v88_ecs"
          ssh-keyscan -H "$ECS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$HOME/.ssh/v88_ecs" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15 "$ECS_USER@$ECS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          echo '=== time ==='
          date -Is
          echo '=== containers ==='
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          echo '=== v88 build info ==='
          curl -fsS http://127.0.0.1:3000/api/novel-panel/build-info || true
          echo
          echo '=== v88 121 env ==='
          main_id="$(docker ps -qf name=v88-public-v88-node-1)"
          if [ -n "$main_id" ]; then
            docker exec "$main_id" sh -lc 'env | grep "^QIANTIE_121_" | sed "s/=.*$/=<set>/" | sort || true'
            echo '=== v88 browser worker code markers ==='
            docker exec "$main_id" sh -lc 'grep -R -n -E "QIANTIE_121_BROWSER_WORKER_URL|browser_worker_url_missing|novel-fetch-121-worker" /app/routes /app/lib /app/server.js /app/app.js 2>/dev/null | head -80 || true'
          fi
          echo '=== playwright base image tag ==='
          docker image inspect mcr.microsoft.com/playwright:v1.55.0-noble --format '{{.Id}} {{.Os}}/{{.Architecture}}' 2>/dev/null || echo 'PLAYWRIGHT_BASE_TAG_MISSING'
          echo '=== old worker history ==='
          docker history --no-trunc qiantie-121-browser-worker:public-v78 2>/dev/null | head -20 || true
          echo '=== relevant images ==='
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' | grep -E 'qiantie-v88|121-browser-worker|qiantie-platform|mcr.microsoft.com/playwright' || true
          echo '=== active load/gzip processes ==='
          ps -eo pid,ppid,etime,cmd | grep -E '[d]ocker load|[g]unzip|[g]zip -1' || true
          REMOTE
