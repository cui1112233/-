services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - qiantie_internal

  go-api:
    build:
      context: ${QIANTIE_GO_SOURCE_DIR}/backend
      dockerfile: Dockerfile
    image: qiantie-go-api:public-v78
    restart: unless-stopped
    environment:
      QIANTIE_GO_LISTEN_ADDR: :4000
      QIANTIE_MYSQL_DSN: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?parseTime=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci
      QIANTIE_BRIDGE_SECRET: ${QIANTIE_BRIDGE_SECRET}
      QIANTIE_BATCH_FACTORY_V11_SLICE: ${QIANTIE_BATCH_FACTORY_V11_SLICE:-1}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - qiantie_internal

  browser-worker:
    build:
      context: ../../services/121-browser-worker
      dockerfile: Dockerfile
    image: qiantie-121-browser-worker:public-v78
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      QIANTIE_121_WORKER_SECRET: ${QIANTIE_121_WORKER_SECRET}
      QIANTIE_121_SESSION_DIR: /data/sessions
      QIANTIE_121_HEADED_ENABLED: "1"
    volumes:
      - browser_sessions:/data/sessions
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz',{headers:{'x-qiantie-internal-secret':process.env.QIANTIE_121_WORKER_SECRET}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - qiantie_internal

  v78-node:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: qiantie-v78-node:public-v78
    restart: unless-stopped
    environment:
      NODE_ENV: production
      QIANTIE_NODE_PORT: 3000
      QIANTIE_GO_BASE_URL: http://go-api:4000
      QIANTIE_BRIDGE_SECRET: ${QIANTIE_BRIDGE_SECRET}
      QIANTIE_121_BROWSER_WORKER_URL: http://browser-worker:8787
      QIANTIE_121_WORKER_SECRET: ${QIANTIE_121_WORKER_SECRET}
      QIANTIE_121_CREDENTIAL_SECRET: ${QIANTIE_121_CREDENTIAL_SECRET}
    volumes:
      - v78_data:/app/data
      - v78_outputs:/app/outputs
    depends_on:
      go-api:
        condition: service_started
      browser-worker:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/build-info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - qiantie_internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      v78-node:
        condition: service_healthy
    networks:
      - qiantie_internal

networks:
  qiantie_internal:
    driver: bridge

volumes:
  mysql_data:
  browser_sessions:
  v78_data:
  v78_outputs:
