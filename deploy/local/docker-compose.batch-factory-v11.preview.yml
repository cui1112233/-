# Local-only overlay for the V88 Batch Factory V11 preview.
# Apply together with /Users/ming/qiantie-v88/docker-compose.v88-review.yml.
# It deliberately leaves the existing Shuihuo backend and mysql-shuihuo services unchanged.
services:
  # The base review compose is anchored in /Users/ming/qiantie-v88.  Keep this
  # local preview's Shuihuo API on the V88 worktree under review, otherwise a
  # container rebuild silently swaps it back to that stale checkout.
  backend:
    build:
      context: /Users/ming/Documents/ChatGPT/一战晟铭/backend
      dockerfile: Dockerfile

  batch-factory-v11-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: qiantie_batch_factory_v11
      MYSQL_USER: qiantie
      MYSQL_PASSWORD: ${QIANTIE_V88_MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${QIANTIE_V88_MYSQL_ROOT_PASSWORD:?required}
    volumes:
      - batch-factory-v11-preview-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [v88-review]
    restart: "no"

  batch-factory-v11:
    build:
      context: /Users/ming/Documents/ChatGPT/一战晟铭/backend
      dockerfile: Dockerfile
      args:
        QIANTIE_RELEASE_SHA: ${QIANTIE_BATCH_FACTORY_V11_RELEASE_SHA:-local-v88}
    image: qiantie-batch-factory-v11:${QIANTIE_BATCH_FACTORY_V11_RELEASE_SHA:-local-v88}
    environment:
      QIANTIE_GO_LISTEN_ADDR: ":4000"
      QIANTIE_MYSQL_DSN: "qiantie:${QIANTIE_V88_MYSQL_PASSWORD:?required}@tcp(batch-factory-v11-mysql:3306)/qiantie_batch_factory_v11?parseTime=true&multiStatements=true"
      QIANTIE_BRIDGE_SECRET: ${QIANTIE_V88_BRIDGE_SECRET:?required}
      QIANTIE_BATCH_FACTORY_V11_SLICE: "1"
      QIANTIE_BATCH_FACTORY_V11_PRODUCTION_ENABLED: "0"
      QIANTIE_LOCAL_EXECUTOR_ARTIFACT_DIR: /data/local-executor-artifacts
      QIANTIE_LOCAL_EXECUTOR_PUBLIC_BASE_URL: http://127.0.0.1:5173
    volumes:
      - batch-factory-v11-preview-artifacts:/data/local-executor-artifacts
    depends_on:
      batch-factory-v11-mysql:
        condition: service_healthy
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "/qiantie", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [v88-review]
    restart: "no"

  platform:
    build:
      context: /Users/ming/Documents/ChatGPT/一战晟铭
      dockerfile: Dockerfile
      args:
        QIANTIE_RELEASE_SHA: ${QIANTIE_BATCH_FACTORY_V11_RELEASE_SHA:-local-v88}
    environment:
      QIANTIE_BATCH_FACTORY_V11_BASE_URL: http://batch-factory-v11:4000
    depends_on:
      batch-factory-v11:
        condition: service_healthy

volumes:
  batch-factory-v11-preview-mysql:
  batch-factory-v11-preview-artifacts:
