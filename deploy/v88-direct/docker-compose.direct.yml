# V88 日常发布“代码直传”片段。
#
# 用法（在服务器 /opt/qiantie/v88/deploy/v88-public 目录）：
#   docker compose -f docker-compose.yml \
#     -f /opt/qiantie/v88/direct/docker-compose.direct.yml config -q
#   docker compose -f docker-compose.yml \
#     -f /opt/qiantie/v88/direct/docker-compose.direct.yml up -d --force-recreate go-api v88-node
#
# 原理：基础镜像只提供操作系统/运行环境（ffmpeg、node 等），业务程序改为
# 挂载宿主机上直传上来的成品。以后改小细节只需替换 current 软链指向的
# 成品并重启容器，不再从国外镜像仓库整包下载。
#
# 注意：本片段只追加挂载与环境变量，网络、MySQL、浏览器工人等其余拓扑
# 完全沿用主 docker-compose.yml，不做任何改动。
services:
  go-api:
    environment:
      # 覆盖镜像里烧录的旧 SHA，让 /api/build-info 反映直传版本。
      QIANTIE_RELEASE_SHA: ${DIRECT_RELEASE_SHA}
    volumes:
      # Go 单二进制直传，只读挂载到镜像内入口路径。
      - /opt/qiantie/v88/direct/current/go/qiantie:/qiantie:ro
      # 合成成品持久卷沿用主 compose 声明，这里显式重复一次以防基础
      # compose 版本较旧缺少该挂载。
      - go_api_artifacts:/data/local-executor-artifacts
    healthcheck:
      test: ["CMD", "/qiantie", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  v88-node:
    environment:
      QIANTIE_RELEASE_SHA: ${DIRECT_RELEASE_SHA}
    volumes:
      # Node 运行时整目录直传（含 server.js/app.js/routes/lib/frontend/dist
      # 与生产 node_modules）。主 compose 中 /app/data、/app/outputs 的命名卷
      # 挂载在子路径上，会叠加在只读根目录之上保持可写。
      - /opt/qiantie/v88/direct/current/node:/app:ro

volumes:
  go_api_artifacts:
    external: true
    name: v88-public_go_api_artifacts
