services:
  merge-redis:
    image: redis:7.4-alpine
    env_file:
      - ./merge.env
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$QIANTIE_MERGE_REDIS_PASSWORD"
    volumes:
      - merge_redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$QIANTIE_MERGE_REDIS_PASSWORD" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - qiantie_internal
    restart: unless-stopped

  merge-worker:
    image: ${QIANTIE_MERGE_WORKER_IMAGE:-qiantie-merge-worker:public-v88}
    env_file:
      - ./merge.env
    environment:
      QIANTIE_MERGE_WORKER_LISTEN_ADDR: ":8790"
      QIANTIE_MERGE_REDIS_PREFIX: qiantie:v88-public:bf11:merge
      QIANTIE_MERGE_WORK_ROOT: /tmp/qiantie-merge
    depends_on:
      merge-redis:
        condition: service_healthy
    expose:
      - "8790"
    networks:
      - qiantie_internal
    restart: unless-stopped

  go-api:
    image: ${QIANTIE_GO_API_IMAGE:-qiantie-go-api:public-v88-merge}
    env_file:
      - ./merge.env
    environment:
      QIANTIE_BATCH_FACTORY_V11_MERGE_ENDPOINT: http://merge-worker:8790/v1/merge
      QIANTIE_BATCH_FACTORY_V11_MERGE_POLL_ENDPOINT: http://merge-worker:8790/v1/merge/{id}
    depends_on:
      merge-worker:
        condition: service_started

volumes:
  merge_redis_data:

networks:
  qiantie_internal:
    external: false
