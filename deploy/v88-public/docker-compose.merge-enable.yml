services:
  go-api:
    image: ${QIANTIE_GO_API_IMAGE:?required}
    environment:
      QIANTIE_BATCH_FACTORY_V11_SLICE: "5"
      QIANTIE_BATCH_FACTORY_V11_MERGE_ENABLED: "1"
      QIANTIE_BATCH_FACTORY_V11_MERGE_ENDPOINT: http://merge-worker:8790/v1/merge
      QIANTIE_BATCH_FACTORY_V11_MERGE_POLL_ENDPOINT: http://merge-worker:8790/v1/merge/{id}
      QIANTIE_BATCH_FACTORY_V11_MERGE_API_KEY: ${QIANTIE_MERGE_WORKER_SECRET:?required}
    depends_on:
      merge-worker:
        condition: service_started
