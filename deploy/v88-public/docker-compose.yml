# Browser Worker source contract (no deployment is performed by config):
# docker compose -f deploy/v88-public/docker-compose.yml \
#   -f deploy/v88-public/docker-compose.browser-worker.yml config --quiet
# Use the same file pair for a separately approved runtime operation. Supply
# the immutable QIANTIE_BROWSER_WORKER_IMAGE and worker environment in the
# protected deployment environment; never commit credentials or session data.
# The overlay requires QIANTIE_* inputs only; generic operator environment
# variables must not replace Browser Worker image/runtime defaults.
services:
  go-api:
    image: ${QIANTIE_GO_IMAGE:?set an immutable Go image reference}
    restart: unless-stopped
    environment:
      QIANTIE_GO_LISTEN_ADDR: :4000
      QIANTIE_MYSQL_DSN: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?parseTime=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci
      QIANTIE_BRIDGE_SECRET: ${QIANTIE_BRIDGE_SECRET}
      # The Go API can be repaired independently during an emergency.  Normal
      # releases still use QIANTIE_RELEASE_SHA for both services.
      QIANTIE_RELEASE_SHA: ${QIANTIE_GO_RELEASE_SHA:-${QIANTIE_RELEASE_SHA}}
      # Service-side Qingyu credential for giant-material metadata resolution.
      # The value lives only in the protected production .env file.
      QINGYU_N8_ADMIN_TOKEN: ${QINGYU_N8_ADMIN_TOKEN:-}
      QIANTIE_BATCH_FACTORY_V11_SLICE: ${QIANTIE_BATCH_FACTORY_V11_SLICE:-1}
      QIANTIE_BATCH_FACTORY_V11_TEXT_ENDPOINT: ${QIANTIE_BATCH_FACTORY_V11_TEXT_ENDPOINT:-}
      QIANTIE_BATCH_FACTORY_V11_TEXT_API_KEY: ${QIANTIE_BATCH_FACTORY_V11_TEXT_API_KEY:-}
      QIANTIE_BATCH_FACTORY_V11_TEXT_MODEL: ${QIANTIE_BATCH_FACTORY_V11_TEXT_MODEL:-}
      # Text credentials stay in the account-level Node configuration and are
      # signed into the trusted Node -> Go request for the active book.
      QIANTIE_BATCH_FACTORY_V11_DYNAMIC_TEXT_PROVIDER: ${QIANTIE_BATCH_FACTORY_V11_DYNAMIC_TEXT_PROVIDER:-1}
      QIANTIE_BATCH_FACTORY_V11_PRODUCTION_ENABLED: ${QIANTIE_BATCH_FACTORY_V11_PRODUCTION_ENABLED:-0}
      QIANTIE_BATCH_FACTORY_V11_LOCAL_MERGE_ENABLED: ${QIANTIE_BATCH_FACTORY_V11_LOCAL_MERGE_ENABLED:-1}
      # Merged video readback must use a durable object reader. Dedicated merge
      # credentials take priority; the already-configured reference-asset TOS
      # client is the compatible fallback for existing public installations.
      QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_ENDPOINT: ${QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_ENDPOINT:-${QIANTIE_REFERENCE_ASSET_TOS_ENDPOINT:-}}
      QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_REGION: ${QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_REGION:-${QIANTIE_REFERENCE_ASSET_TOS_REGION:-}}
      QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_BUCKET: ${QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_BUCKET:-${QIANTIE_REFERENCE_ASSET_TOS_BUCKET:-}}
      QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_ACCESS_KEY: ${QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_ACCESS_KEY:-${QIANTIE_REFERENCE_ASSET_TOS_ACCESS_KEY:-}}
      QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_SECRET_KEY: ${QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_SECRET_KEY:-${QIANTIE_REFERENCE_ASSET_TOS_SECRET_KEY:-}}
      QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_PUBLIC_BASE_URL: ${QIANTIE_BATCH_FACTORY_V11_MERGE_TOS_PUBLIC_BASE_URL:-}
      # 内置合成的成片工作目录必须落在持久卷上：否则 go-api 容器一重建，
      # 已合成的 mp4 随容器内部目录一起丢失，上传时会 404。
      QIANTIE_LOCAL_EXECUTOR_ARTIFACT_DIR: /data/local-executor-artifacts
    volumes:
      - go_api_artifacts:/data/local-executor-artifacts
    expose:
      - "4000"
    networks:
      - qiantie_internal

  browser-worker:
    image: ${QIANTIE_BROWSER_WORKER_IMAGE:?set the existing browser worker image reference}
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      QIANTIE_121_WORKER_SECRET: ${QIANTIE_121_WORKER_SECRET}
      QIANTIE_121_SESSION_DIR: /data/sessions
      QIANTIE_121_LEGACY_SESSION_DIR: /data/legacy-sessions
      QIANTIE_121_HEADED_ENABLED: "1"
      QIANTIE_121_VERIFY_TIMEOUT_MS: ${QIANTIE_121_VERIFY_TIMEOUT_MS:-30000}
      QIANTIE_121_LOGIN_TIMEOUT_MS: ${QIANTIE_121_LOGIN_TIMEOUT_MS:-55000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:8787,path:'/healthz',headers:{'x-qiantie-internal-secret':process.env.QIANTIE_121_WORKER_SECRET}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - browser_sessions:/data/sessions
      - novel-fetch-121-data:/data/legacy-sessions:ro
    expose:
      - "8787"
    networks:
      - qiantie_internal

  # The retained legacy implementation runs with its own database and object
  # volume. It must never apply legacy migrations to qiantie_v88.
  shuihuo-compat:
    image: ${QIANTIE_SHUIHUO_COMPAT_IMAGE:?set the retained legacy Shuihuo image reference}
    pull_policy: never
    restart: unless-stopped
    environment:
      QIANTIE_ADDR: :4100
      QIANTIE_MYSQL_DSN: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/qiantie_shuihuo_compat?parseTime=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci
      QIANTIE_BRIDGE_SECRET: ${QIANTIE_BRIDGE_SECRET}
      QIANTIE_STORAGE_DRIVER: local
      QIANTIE_STORAGE_LOCAL_DIR: /var/lib/qiantie/objects
      QIANTIE_STORAGE_PUBLIC_BASE_URL: ${QIANTIE_SHUIHUO_STORAGE_PUBLIC_BASE_URL:-http://127.0.0.1:3000}
    volumes:
      - shuihuo_objects:/var/lib/qiantie/objects
    expose:
      - "4100"
    networks:
      - qiantie_internal

  v88-node:
    image: ${QIANTIE_NODE_IMAGE:?set an immutable Node image reference}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      QIANTIE_NODE_PORT: 3000
      QIANTIE_GO_BASE_URL: http://go-api:4000
      QIANTIE_SHUIHUO_COMPAT_BASE_URL: http://shuihuo-compat:4100
      QIANTIE_BRIDGE_SECRET: ${QIANTIE_BRIDGE_SECRET}
      QIANTIE_121_BROWSER_WORKER_URL: http://browser-worker:8787
      QIANTIE_121_WORKER_SECRET: ${QIANTIE_121_WORKER_SECRET}
      QIANTIE_121_CREDENTIAL_SECRET: ${QIANTIE_121_CREDENTIAL_SECRET}
      QIANTIE_121_CLIENT_TIMEOUT_MS: ${QIANTIE_121_CLIENT_TIMEOUT_MS:-40000}
      QIANTIE_121_CLIENT_LOGIN_TIMEOUT_MS: ${QIANTIE_121_CLIENT_LOGIN_TIMEOUT_MS:-60000}
      QIANTIE_REFERENCE_ASSET_PUBLIC_BASE_URL: ${QIANTIE_REFERENCE_ASSET_PUBLIC_BASE_URL:?required}
      QIANTIE_REFERENCE_ASSET_ALLOW_HTTP: ${QIANTIE_REFERENCE_ASSET_ALLOW_HTTP:-false}
      QIANTIE_REFERENCE_ASSET_SIGNING_SECRET: ${QIANTIE_REFERENCE_ASSET_SIGNING_SECRET:?required}
      QIANTIE_REFERENCE_ASSET_TOS_ENDPOINT: ${QIANTIE_REFERENCE_ASSET_TOS_ENDPOINT:-}
      QIANTIE_REFERENCE_ASSET_TOS_REGION: ${QIANTIE_REFERENCE_ASSET_TOS_REGION:-}
      QIANTIE_REFERENCE_ASSET_TOS_BUCKET: ${QIANTIE_REFERENCE_ASSET_TOS_BUCKET:-}
      QIANTIE_REFERENCE_ASSET_TOS_ACCESS_KEY: ${QIANTIE_REFERENCE_ASSET_TOS_ACCESS_KEY:-}
      QIANTIE_REFERENCE_ASSET_TOS_SECRET_KEY: ${QIANTIE_REFERENCE_ASSET_TOS_SECRET_KEY:-}
      # Component-only emergency repairs retain the counterpart's truthful
      # runtime identity. Normal paired releases set both pointers together.
      QIANTIE_RELEASE_SHA: ${QIANTIE_NODE_RELEASE_SHA:-${QIANTIE_RELEASE_SHA}}
    volumes:
      - v88_data:/app/data
      - v88_outputs:/app/outputs
    depends_on:
      go-api:
        condition: service_started
      browser-worker:
        condition: service_healthy
      shuihuo-compat:
        condition: service_started
    expose:
      - "3000"
    networks:
      - qiantie_internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - ./acme:/var/www/certbot:ro
    depends_on:
      - v88-node
    networks:
      - qiantie_internal

networks:
  qiantie_internal:
    external: true
    name: v88-public_qiantie_internal

volumes:
  browser_sessions:
    external: true
    name: v88-public_browser_sessions
  novel-fetch-121-data:
    external: true
    name: v88-public_novel-fetch-121-data
  v88_data:
    external: true
    name: v88-public_v88_data
  v88_outputs:
    external: true
    name: v88-public_v88_outputs
  shuihuo_objects:
    external: true
    name: v88-public_shuihuo_objects
  go_api_artifacts:
    external: true
    name: v88-public_go_api_artifacts
