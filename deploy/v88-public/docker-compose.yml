services:
  go-api:
    image: ${QIANTIE_GO_IMAGE:?set an immutable Go image reference}
    restart: unless-stopped
    environment:
      QIANTIE_GO_LISTEN_ADDR: :4000
      QIANTIE_MYSQL_DSN: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?parseTime=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci
      QIANTIE_BRIDGE_SECRET: ${QIANTIE_BRIDGE_SECRET}
      QIANTIE_RELEASE_SHA: ${QIANTIE_RELEASE_SHA}
      QIANTIE_BATCH_FACTORY_V11_SLICE: ${QIANTIE_BATCH_FACTORY_V11_SLICE:-1}
      QIANTIE_BATCH_FACTORY_V11_TEXT_ENDPOINT: ${QIANTIE_BATCH_FACTORY_V11_TEXT_ENDPOINT:-}
      QIANTIE_BATCH_FACTORY_V11_TEXT_API_KEY: ${QIANTIE_BATCH_FACTORY_V11_TEXT_API_KEY:-}
      QIANTIE_BATCH_FACTORY_V11_TEXT_MODEL: ${QIANTIE_BATCH_FACTORY_V11_TEXT_MODEL:-}
      QIANTIE_BATCH_FACTORY_V11_PRODUCTION_ENABLED: ${QIANTIE_BATCH_FACTORY_V11_PRODUCTION_ENABLED:-0}
    expose:
      - "4000"
    networks:
      - qiantie_internal

  browser-worker:
    image: ${QIANTIE_BROWSER_WORKER_IMAGE:?set the existing browser worker image reference}
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      QIANTIE_121_WORKER_SECRET: ${QIANTIE_121_WORKER_SECRET}
      QIANTIE_121_SESSION_DIR: /data/sessions
      QIANTIE_121_HEADED_ENABLED: "1"
      QIANTIE_121_VERIFY_TIMEOUT_MS: ${QIANTIE_121_VERIFY_TIMEOUT_MS:-30000}
      QIANTIE_121_LOGIN_TIMEOUT_MS: ${QIANTIE_121_LOGIN_TIMEOUT_MS:-30000}
    volumes:
      - browser_sessions:/data/sessions
    expose:
      - "8787"
    networks:
      - qiantie_internal

  # The retained legacy implementation runs with its own database and object
  # volume. It must never apply legacy migrations to qiantie_v88.
  shuihuo-compat:
    image: ${QIANTIE_SHUIHUO_COMPAT_IMAGE:?set the retained legacy Shuihuo image reference}
    pull_policy: never
    restart: unless-stopped
    environment:
      QIANTIE_ADDR: :4100
      QIANTIE_MYSQL_DSN: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/qiantie_shuihuo_compat?parseTime=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci
      QIANTIE_BRIDGE_SECRET: ${QIANTIE_BRIDGE_SECRET}
      QIANTIE_STORAGE_DRIVER: local
      QIANTIE_STORAGE_LOCAL_DIR: /var/lib/qiantie/objects
      QIANTIE_STORAGE_PUBLIC_BASE_URL: ${QIANTIE_SHUIHUO_STORAGE_PUBLIC_BASE_URL:-http://127.0.0.1:3000}
    volumes:
      - shuihuo_objects:/var/lib/qiantie/objects
    expose:
      - "4100"
    networks:
      - qiantie_internal

  v88-node:
    image: ${QIANTIE_NODE_IMAGE:?set an immutable Node image reference}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      QIANTIE_NODE_PORT: 3000
      QIANTIE_GO_BASE_URL: http://go-api:4000
      QIANTIE_SHUIHUO_COMPAT_BASE_URL: http://shuihuo-compat:4100
      QIANTIE_BRIDGE_SECRET: ${QIANTIE_BRIDGE_SECRET}
      QIANTIE_121_BROWSER_WORKER_URL: http://browser-worker:8787
      QIANTIE_121_WORKER_SECRET: ${QIANTIE_121_WORKER_SECRET}
      QIANTIE_121_CREDENTIAL_SECRET: ${QIANTIE_121_CREDENTIAL_SECRET}
      QIANTIE_RELEASE_SHA: ${QIANTIE_RELEASE_SHA}
    volumes:
      - v88_data:/app/data
      - v88_outputs:/app/outputs
    depends_on:
      - go-api
      - browser-worker
      - shuihuo-compat
    expose:
      - "3000"
    networks:
      - qiantie_internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - v88-node
    networks:
      - qiantie_internal

networks:
  qiantie_internal:
    external: true
    name: v88-public_qiantie_internal

volumes:
  browser_sessions:
    external: true
    name: v88-public_browser_sessions
  v88_data:
    external: true
    name: v88-public_v88_data
  v88_outputs:
    external: true
    name: v88-public_v88_outputs
  shuihuo_objects:
    external: true
    name: v88-public_shuihuo_objects
