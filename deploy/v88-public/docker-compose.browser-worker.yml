# Derived non-secret Browser Worker contract from retained runtime evidence.
# Supply the observed immutable image reference in the protected environment.
# Pair with docker-compose.yml; this file does not introduce a release path.
# Require only application inputs. HOST/PORT retain the base listener defaults;
# PATH, LANG, LC_ALL and PLAYWRIGHT_BROWSERS_PATH remain image/runtime-owned.
# Never copy the operator's generic environment into the container.
services:
  browser-worker:
    image: ${QIANTIE_BROWSER_WORKER_IMAGE:?required immutable Browser Worker image reference}
    restart: unless-stopped
    environment:
      QIANTIE_121_HEADED_ENABLED: ${QIANTIE_121_HEADED_ENABLED:?required}
      QIANTIE_121_LEGACY_SESSION_DIR: ${QIANTIE_121_LEGACY_SESSION_DIR:?required}
      QIANTIE_121_LOGIN_TIMEOUT_MS: ${QIANTIE_121_LOGIN_TIMEOUT_MS:?required}
      QIANTIE_121_SESSION_DIR: ${QIANTIE_121_SESSION_DIR:?required}
      QIANTIE_121_VERIFY_TIMEOUT_MS: ${QIANTIE_121_VERIFY_TIMEOUT_MS:?required}
      QIANTIE_121_WORKER_SECRET: ${QIANTIE_121_WORKER_SECRET:?required}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:8787,path:'/healthz',headers:{'x-qiantie-internal-secret':process.env.QIANTIE_121_WORKER_SECRET}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - browser_sessions:/data/sessions:rw
      - novel-fetch-121-data:/data/legacy-sessions:ro
    networks:
      qiantie_internal:
        aliases:
          - browser-worker

networks:
  qiantie_internal:
    external: true
    name: v88-public_qiantie_internal

volumes:
  browser_sessions:
    external: true
    name: v88-public_browser_sessions
  novel-fetch-121-data:
    external: true
    name: v88-public_novel-fetch-121-data
