# Compatibility shim for pre-existing Compose invocations that include this
# filename. The complete Browser Worker definition belongs to
# docker-compose.yml; duplicating it here would create a second environment
# contract and make otherwise valid deployments fail on absent optional values.
# Keep only the fail-closed secret requirement. This file does not introduce a
# release path or copy generic operator environment into the container.
services:
  browser-worker:
    environment:
      QIANTIE_121_WORKER_SECRET: ${QIANTIE_121_WORKER_SECRET:?required}
