services:
  platform:
    volumes:
      - ${QIANTIE_HOST_PLATFORM_DATA_DIR:?set QIANTIE_HOST_PLATFORM_DATA_DIR}:/app/data

  backend:
    environment:
      # Values are injected from the local service configuration at deployment time.
      QIANTIE_MYSQL_DSN: ${QIANTIE_TEST_MYSQL_DSN:?set QIANTIE_TEST_MYSQL_DSN}
      QIANTIE_CREDENTIAL_ENCRYPTION_KEY: ${QIANTIE_CREDENTIAL_ENCRYPTION_KEY:?set QIANTIE_CREDENTIAL_ENCRYPTION_KEY}
      QIANTIE_STORAGE_DRIVER: ${QIANTIE_RUNTIME_STORAGE_DRIVER:-tos}
      QIANTIE_STORAGE_BUCKET: ${QIANTIE_RUNTIME_STORAGE_BUCKET:?set QIANTIE_RUNTIME_STORAGE_BUCKET}
      QIANTIE_STORAGE_ENDPOINT: ${QIANTIE_RUNTIME_STORAGE_ENDPOINT:?set QIANTIE_RUNTIME_STORAGE_ENDPOINT}
      QIANTIE_STORAGE_REGION: ${QIANTIE_RUNTIME_STORAGE_REGION:?set QIANTIE_RUNTIME_STORAGE_REGION}
      QIANTIE_STORAGE_ACCESS_KEY: ${QIANTIE_RUNTIME_STORAGE_ACCESS_KEY:?set QIANTIE_RUNTIME_STORAGE_ACCESS_KEY}
      QIANTIE_STORAGE_SECRET_KEY: ${QIANTIE_RUNTIME_STORAGE_SECRET_KEY:?set QIANTIE_RUNTIME_STORAGE_SECRET_KEY}
